        Server: config.ServerConfig{LogLevel: "error"}}\n\tgo func() { defer close(done);
        runL3Tunnel(cfg, ctx, "") }()\n\tt.Cleanup(func() {\n\t\tcancel()\n\t\tselect
        {\n\t\tcase <-done:\n\t\tcase <-time.After(2 * time.Second):\n\t\t\tt.Error("supervisor
        did not stop")\n\t\t}\n\t\tos.Stdout = previousOutput\n\t\twriter.Close()\n\t\treader.Close()\n\t\t<-logDone\n\t})\n\tselect
        {\n\tcase <-failedBind:\n\tcase <-time.After(3 * time.Second):\n\t\tt.Fatal("initial
        conflicting bind was not attempted")\n\t}\n\theld.Close()\n\tvar client net.Conn\n\tdeadline
        := time.Now().Add(8 * time.Second)\n\tfor time.Now().Before(deadline) {\n\t\tclient,
        err = net.DialTimeout("tcp", blockedAddr, 100*time.Millisecond)\n\t\tif err
        == nil {\n\t\t\tbreak\n\t\t}\n\t\ttime.Sleep(20 * time.Millisecond)\n\t}\n\tif
        err != nil {\n\t\tt.Fatalf("forwarder never recovered after conflicting listener
        left: %v", err)\n\t}\n\tdefer client.Close()\n\tclient.SetDeadline(time.Now().Add(time.Second))\n\tif
        _, err := client.Write([]byte("recovered")); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tresponse
        := make([]byte, len("recovered"))\n\tif _, err := io.ReadFull(client, response);
        err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif string(response) != "recovered"
        {\n\t\tt.Fatal("restarted forwarder lost data")\n\t}\n\tif ctx.Err() != nil
