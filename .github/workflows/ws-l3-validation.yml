        := bufio.NewScanner(reader)\n\t\tfor scanner.Scan() {\n\t\t\tline := scanner.Text()\n\t\t\tif
        strings.Contains(line, "tcp forwarder for "+blockedAddr+" stopped") {\n\t\t\t\tselect
