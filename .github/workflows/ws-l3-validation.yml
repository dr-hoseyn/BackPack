        {\n\t\t\t\treturn\n\t\t\t}\n\t\t\tgo func() { defer c.Close(); io.Copy(c,
        c) }()\n\t\t}\n\t}()\n\t// Observe the actual first bind failure before releasing
        the conflict;\n\t// guessing a sleep could let the old code bind successfully
