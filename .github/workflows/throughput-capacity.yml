name: Throughput capacity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wssmux-resources-${{ github.ref }}
  cancel-in-progress: true
jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build candidate and identical measurement on v1.16.0
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/resource-base" v1.16.0
          cp internal/e2e/wssmux_resources_test.go "$RUNNER_TEMP/resource-base/internal/e2e/"
          go test -c -o "$RUNNER_TEMP/resource-candidate" ./internal/e2e
          (cd "$RUNNER_TEMP/resource-base" && go test -c -o "$RUNNER_TEMP/resource-baseline" ./internal/e2e)
      - name: Compare quality with delay, loss and a fixed link rate
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2
          for sample in 1 2 3; do
            order="baseline candidate"
            if [ $((sample % 2)) -eq 0 ]; then order="candidate baseline"; fi
            for kind in $order; do
              sudo env GOMAXPROCS=4 BP_RESOURCE_BENCHMARK=1 BP_RESOURCE_IDLE_CONNECTIONS=16 \
                BP_RESOURCE_ROUNDS=2 BP_RESOURCE_NETEM=1 BIN="$RUNNER_TEMP/resource-$kind" \
                unshare --net -- bash -eu -c 'ip link set lo up; ulimit -n 16384; exec "$BIN" -test.run "^TestWSMuxResourceProfile$" -test.v -test.timeout 2m' \
                | tee "$RUNNER_TEMP/delayed-$kind-$sample.txt"
            done
          done
          python3 .github/scripts/compare-wssmux-resources.py "$RUNNER_TEMP" delayed | tee "$RUNNER_TEMP/delayed-comparison.json"
          cat "$RUNNER_TEMP/delayed-comparison.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wssmux-resources
          path: |
            ${{ runner.temp }}/resource-*.txt
            ${{ runner.temp }}/delayed-*.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wssmux-profiles
          path: ${{ runner.temp }}/resource-*.pprof
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wssmux-resource-comparison
          path: |
            ${{ runner.temp }}/resource-comparison.json
            ${{ runner.temp }}/delayed-comparison.json
