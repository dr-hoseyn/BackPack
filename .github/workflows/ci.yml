name: Focused dual-stack coverage diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dual-stack-diagnosis-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare fixtures
        run: |
          export BP_DIAG_LOGDIR="$RUNNER_TEMP/dual-stack-engine-logs"
          echo "BP_DIAG_LOGDIR=$BP_DIAG_LOGDIR" >> "$GITHUB_ENV"
          install -d -m 700 "$BP_DIAG_LOGDIR"
          sudo install -d -m 700 -o "$(id -un)" -g "$(id -gn)" /etc/backpack
          sudo install -m 600 -o "$(id -un)" -g "$(id -gn)" /dev/null /etc/backpack.restore.lock
      - name: Repeat the real sequential IPv4 and IPv6 test under coverage
        run: |
          set -o pipefail
          go test ./internal/manage -run '^TestBothFamiliesCarryRealTrafficThroughOneLinkInSequence$' -count=5 -coverpkg=./... -v -timeout 12m | tee "$RUNNER_TEMP/dual-stack-coverage.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dual-stack-coverage-diagnostics
          path: |
            ${{ runner.temp }}/dual-stack-engine-logs/*.log
            ${{ runner.temp }}/dual-stack-coverage.txt
