name: CI

# Every push and pull request is built and tested. The end-to-end suite starts
# real tunnels and moves real traffic, so a change that breaks a transport is
# caught here rather than on somebody's server.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xhttp-awg:
    name: XHTTP split download and AmneziaWG real TUN
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare private configuration fixtures
        run: sudo install -d -m 700 -o "$(id -un)" -g "$(id -gn)" /etc/backpack
      - name: Verify configuration, encrypted packets and negative authentication
        run: go test ./internal/amneziawg ./internal/tunnel/naive ./config ./cmd ./internal/manage/tunnelspec -race -count=1 -timeout 4m
      - name: Exercise existing and advanced HTTPS menu flows
        run: go test ./internal/manage -run '^(TestManagedHTTPS|TestXHTTPAdvanced)' -race -count=1 -timeout 1m
      - name: Install verified Xray and exercise independent TLS download
        run: |
          sudo env "PATH=$PATH" BP_HELPERS=xray BP_BUILD_FROM_SOURCE=1 bash ./install.sh
          BP_XRAY_BINARY=/usr/local/lib/backpack/helpers/xray/v26.3.27-amd64/xray \
            go test ./internal/tunnel/naive -run '^TestXHTTPSplitDownloadWithPinnedHelper$' -race -count=1 -v -timeout 2m
      - name: AmneziaWG over IPv4 and IPv6, restart and loss
        run: |
          set -eu
          go build -o "$RUNNER_TEMP/backpack-awg" .
          for scenario in ipv4 ipv6 restart loss; do
            extra=()
            case "$scenario" in
              ipv6) extra+=(IPV6=1) ;;
              restart) extra+=(RESTART=1) ;;
              loss) extra+=("NETEM=delay 20ms loss 1%") ;;
            esac
            sudo env BIN="$RUNNER_TEMP/backpack-awg" W="$RUNNER_TEMP/awg-$scenario" "${extra[@]}" \
              timeout -k 5s 5m unshare --net --mount --fork -- \
              bash internal/amneziawg/testdata/live.sh | tee "$RUNNER_TEMP/awg-$scenario.out"
            grep -q '^RESULT OK' "$RUNNER_TEMP/awg-$scenario.out"
          done

  masque:
    name: MASQUE and installation readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Give the new carrier, its authentication boundary and paired setup
      # links fast feedback before the full connection-test suite completes.
      - name: Verify MASQUE, setup links and installer readiness
        run: >-
          go test -race ./internal/tunnel/l3 ./internal/manage ./internal/cli ./config ./internal/app
          -run '^(TestMasque|TestLinkApply|TestEveryShareLinkFieldHasAnID|TestEveryDocument|TestTheConfigReference|TestConnectionTestStartup|TestInstallerInstallsHTTPSHelpers|TestInstallerFetchesOnlyMissingHelper|TestConnectionTestMasque|TestIPv6Pck|TestManagedAndDirectProtocolLabels)'
          -count=1 -timeout 3m

  masque-live:
    name: MASQUE over real Linux TUN
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare network test tools and binary
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iproute2 iputils-ping netcat-openbsd bc openssl
          go build -o "$RUNNER_TEMP/backpack-live" .
      # Root is confined to fresh network/mount namespaces on an ephemeral
      # runner. This avoids changing the host's user-namespace security policy.
      - name: Transfer traffic, restart the listener and exercise a lossy path
        run: |
          set -eu
          for scenario in normal restart loss; do
            echo "MASQUE real TUN: $scenario"
            extra=()
            case "$scenario" in
              restart) extra+=(RESTART=1) ;;
              loss) extra+=("NETEM=delay 20ms loss 1%") ;;
            esac
            sudo env BIN="$RUNNER_TEMP/backpack-live" W="$RUNNER_TEMP/masque-$scenario" "${extra[@]}" \
              timeout -k 5s 6m unshare --net --mount --fork -- \
              bash internal/e2e/testdata/l3live.sh masque 1 | tee "$RUNNER_TEMP/masque-$scenario.out"
            grep -q '^RESULT OK' "$RUNNER_TEMP/masque-$scenario.out"
          done

  # Keep the existing required-check name while all three complete suites run
  # independently. A matrix failure must fail this gate, never cancel coverage.
  test:
    name: Build and test
    needs: test-suites
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every regression suite
        env:
          RESULT: ${{ needs.test-suites.result }}
        run: test "$RESULT" = success

  test-suites:
    name: Regression (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [test, race, coverage]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Configuration round-trip tests exercise the real /etc/backpack paths.
      # The ephemeral runner owns their private fixture directory; production
      # configuration permissions remain unchanged.
      - name: Prepare configuration test fixtures
        run: sudo install -d -m 700 -o "$(id -un)" -g "$(id -gn)" /etc/backpack

      # The panel's own tests are plain `node --test` with no dependencies, and
      # `go test ./internal/webui` runs them. That test skips when node is
      # missing rather than failing — a Go toolchain is the only thing this
      # repository requires — so node is pinned here to make sure the skip
      # never happens in CI.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Exercise native helper paths in the coverage gate rather than crediting
      # skipped optional-helper tests. The protocol job also checks real TUNs.
      - name: Install pinned sing-box for measured helper coverage
        if: matrix.mode == 'coverage'
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/SagerNet/sing-box/releases/download/v1.14.2/sing-box-1.14.2-linux-amd64.tar.gz -o "$RUNNER_TEMP/sing.tar.gz"
          echo "a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6  $RUNNER_TEMP/sing.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sing.tar.gz" -C "$RUNNER_TEMP"
          echo "BP_SINGBOX_BINARY=$RUNNER_TEMP/sing-box-1.14.2-linux-amd64/sing-box" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/sing-box-1.14.2-linux-amd64" >> "$GITHUB_ENV"

      - name: Verify formatting
        if: matrix.mode == 'test'
        run: |
          unformatted="$(gofmt -l . || true)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        if: matrix.mode == 'test'
        run: go vet ./...

      - name: Test
        if: matrix.mode == 'test'
        # The e2e tests bind loopback ports and wait on real handshakes, so
        # they need more than the default 10 minute budget on a shared runner.
        run: go test ./... -timeout 20m

      - name: Test with the race detector
        if: matrix.mode == 'race'
        # Enforced. The transports are heavily concurrent and a data race there
        # corrupts traffic rather than crashing loudly, so this must stay clean.
        run: go test ./... -race -timeout 20m

      - name: Coverage
        if: matrix.mode == 'coverage'
        # Measured with -coverpkg, which is the only way this number means
        # anything here.
        #
        # Without it `go test` credits a package only for the lines its *own*
        # tests reach. The two transport packages are driven almost entirely by
        # the end-to-end suite in internal/e2e — ten transports, establish,
        # restart, loss, soak — and none of that counted. They reported 13% and
        # 18% while actually being covered at 68%, and a number that wrong is
        # worse than no number: it argues for writing tests where they are not
        # needed and hides the places they are.
        #
        # The floor only ever goes up. If this fails, look at what stopped being
        # exercised before lowering it.
        run: |
          go test ./... -coverpkg=./... -coverprofile=coverage.out -timeout 20m
          total="$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9.]+')"
          echo "total coverage: ${total}%"
          floor=50
          awk -v t="$total" -v f="$floor" 'BEGIN {
            if (t+0 < f+0) {
              printf "coverage %.1f%% is below the floor of %d%%\n", t, f
              exit 1
            }
          }'

      - name: Per-package coverage floors
        if: matrix.mode == 'coverage'
        # A whole-project number hides a package falling off a cliff while
        # another one rises. These are the packages where a drop means something
        # specific, each with the reason it is on the list.
        #
        # Floors sit just under what each package measures today, so they are a
        # ratchet rather than a target. If one fails, find out what stopped
        # being exercised before lowering it — that is the entire point of the
        # mechanism, and lowering it silently is how a coverage gate becomes
        # decoration.
        run: |
          set -eu
          check() {
            pkg="$1"; floor="$2"; why="$3"
            got="$(go tool cover -func=coverage.out \
                    | grep "^github.com/backpack/backpack/$pkg/" \
                    | awk '{gsub(/%/,"",$3); s+=$3; n++} END {if (n) printf "%.1f", s/n; else print "0"}')"
            echo "  $pkg: ${got}% (floor ${floor}%) — $why"
            awk -v g="$got" -v f="$floor" -v p="$pkg" 'BEGIN {
              if (g+0 < f+0) { printf "%s fell below its floor\n", p; exit 1 }
            }'
          }
          check internal/tunnel/l3      60 "the layer-3 data path"
          check internal/tunnel/chain   80 "transport fallback: a wrong decision here takes a tunnel down"
          check internal/control        50 "the fleet and the job runner"
          check internal/cli            60 "the scriptable surface; scripts depend on its exit codes"
          check internal/node           40 "the fleet RPC and the staged rollout"
          check internal/metrics        60 "what every other component reads to decide anything"
          check internal/menu           25 "the screens an operator actually meets this product through"
          check internal/server/transport 85 "the Iran side of every reverse transport: lifecycle, forwarder, control loop"
          check internal/client/transport 83 "the kharej side of every reverse transport"
          check internal/controlwire    95 "the control channel's wire, shared by both ends"
          check internal/utils/acceptloop 90 "accept backoff and the pre-authentication gate (ADR 0004)"
          check internal/manage/tunnelspec 70 "a tunnel's configuration: render, load, apply with revert"
          check internal/manage/host    60 "this machine's addresses, ports and certificates"
          check internal/manage/health  40 "tunnel health, the watchdog and the Health Check"

  managed:
    name: Managed HTTPS carriers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install the verified pinned helpers
        run: sudo env "PATH=$PATH" BP_BUILD_FROM_SOURCE=1 BP_HELPERS=naive,xray bash ./install.sh
      - name: Authenticate REALITY cover fallback and exercise the real reverse carriers
        env:
          BP_CONNTEST_HELPERS: '1'
        run: go test ./internal/manage -run '^(TestRealityCoverSelectionAuthenticatesWithThePinnedHelper|TestAConnectionTestOverLoopbackPassesEveryReverseTransport)$' -race -count=1 -v -timeout 8m

      - name: Authenticate the managed HTTPS carriers over IPv6
        env:
          BP_CONNTEST_HELPERS: '1'
          BP_CONNTEST_HOST: '::1'
        run: go test ./internal/manage -run '^TestAConnectionTestOverLoopbackPassesEveryReverseTransport$' -race -count=1 -v -timeout 8m

  conntest-ipv6:
    name: Connection Test over an IPv6-only path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Selection, fallback, sequencing, cancellation and panel API regressions
        run: |
          go test ./internal/manage ./internal/webui ./internal/utils/network -race -count=1 -v -timeout 6m \
            -run '^(TestConnectionTest|TestAnUnreachablePath|TestIPv6|TestBothFamilies|TestUnjoinedFamilies|TestStoppingASuite|TestStoppingBetweenPaths|TestBackgroundProbes|TestTheScreensReadTunnelStateThroughOnePlace|TestEveryPanelCallReachesAHandlerThatReadsWhatItSends)'
      - name: IPv6-only native, PCK, SNI, xDi and MASQUE data paths; PMTU and spoof exclusions
        run: |
          sudo env PATH="$PATH" GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            go test ./internal/manage -run '^TestTheTestSettingsFitOnePacketAndCarryNoToken$' -count=1 -v -timeout 1m
          sudo env PATH="$PATH" GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" BP_L3_LIVE=1 \
            unshare --net -- go test ./internal/utils/network -run '^TestIPv6PckFirewallCleanupPreservesLiveOwners$' -count=1 -v -timeout 1m
          sudo env PATH="$PATH" GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" BP_L3_LIVE=1 \
            go test ./internal/manage -run '^TestTheConnectionTestAcrossAnIPv6OnlyPath$' -count=1 -v -timeout 10m

      - name: IPv6 raw carriers survive listener restart and packet loss
        if: success() || failure()
        run: |
          set -eu
          go build -o "$RUNNER_TEMP/backpack-ipv6" .
          for carrier in pck sni xdi; do
            for scenario in restart loss; do
              extra=()
              case "$scenario" in
                restart) extra+=(RESTART=1) ;;
                loss) extra+=("NETEM=delay 20ms loss 1%") ;;
              esac
              sudo env IPV6=1 BIN="$RUNNER_TEMP/backpack-ipv6" W="$RUNNER_TEMP/v6-$carrier-$scenario" "${extra[@]}" \
                timeout -k 5s 6m unshare --net --mount --fork -- \
                bash internal/e2e/testdata/l3live.sh "$carrier" 1 | tee "$RUNNER_TEMP/v6-$carrier-$scenario.out"
              grep -q '^RESULT OK' "$RUNNER_TEMP/v6-$carrier-$scenario.out"
            done
          done
      - name: MASQUE Connection Test on IPv4 with verified temporary trust
        if: success() || failure()
        run: |
          set -eu
          go test -c -o "$RUNNER_TEMP/conntest-ipv4.test" ./internal/manage
          sudo env BIN="$RUNNER_TEMP/backpack-ipv6" TESTBIN="$RUNNER_TEMP/conntest-ipv4.test" \
            W="$RUNNER_TEMP/masque-ct-ipv4" SOAK=3 ONLY=direct/masque \
            timeout -k 5s 6m unshare --net --mount --fork -- \
            bash internal/manage/testdata/conntestlive.sh | tee "$RUNNER_TEMP/masque-ct-ipv4.out"
          grep -q '^RESULT DONE' "$RUNNER_TEMP/masque-ct-ipv4.out"
          sudo python3 - "$RUNNER_TEMP/masque-ct-ipv4/iran.json" <<'PY'
          import json, sys
          rows = json.load(open(sys.argv[1]))
          masque = [r for r in rows if r['k'] == 'direct' and r['t'] == 'masque']
          assert len(masque) == 1 and masque[0]['s'] == 'ok', rows
          PY

      - name: Direct SNI candidates and recommendation on IPv4
        if: success() || failure()
        run: |
          set -eu
          sudo env BIN="$RUNNER_TEMP/backpack-ipv6" TESTBIN="$RUNNER_TEMP/conntest-ipv4.test" \
            W="$RUNNER_TEMP/sni-ct-ipv4" SOAK=3 ONLY=direct/sni \
            timeout -k 5s 6m unshare --net --mount --fork -- \
            bash internal/manage/testdata/conntestlive.sh | tee "$RUNNER_TEMP/sni-ct-ipv4.out"
          grep -q '^RESULT DONE' "$RUNNER_TEMP/sni-ct-ipv4.out"
          sudo python3 - "$RUNNER_TEMP/sni-ct-ipv4" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          rows = json.loads((root / 'iran.json').read_text())
          sni = [r for r in rows if r['k'] == 'direct' and r['t'] == 'sni']
          assert len(sni) == 3 and all(r['s'] == 'ok' for r in sni), rows
          assert len({r['sni'] for r in sni}) == 3 and len({r['case'] for r in sni}) == 3, sni
          best = json.loads((root / 'iran-best.json').read_text())
          assert best['sni'] == max(sni, key=lambda r: r['m'])['sni'], (best, sni)
          PY

  audit:
    name: Vulnerabilities and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Known vulnerabilities
        # govulncheck reports only what this code actually *reaches*, which is
        # what makes it worth failing on: a CVE in a dependency nothing calls is
        # noise, and one on a path the panel serves HTTP over is not.
        #
        # It is the reason the toolchain moved from 1.26.0 to 1.26.6. That scan
        # found 24 reachable vulnerabilities in the standard library — net/http,
        # crypto/tls, crypto/x509, html/template, net/url — every one of them in
        # code this product runs, and every one already fixed upstream. Nothing
        # else in the repository was going to notice.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Static analysis
        # go vet catches a narrow, high-confidence set. staticcheck catches the
        # next band out: values written and never read, an error checked against
        # the wrong thing, a loop that cannot run, a comparison that is always
        # true. None of those fail a build and all of them have been real bugs
        # in code that compiled.
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  fuzz:
    name: Fuzz the parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz
        # Short runs, every push.
        #
        # This is not here to find deep bugs — an hour per target would, and
        # that belongs in a nightly. It is here so the targets keep compiling
        # and keep passing their seeds, because a fuzz target that has quietly
        # stopped building is worth exactly nothing and nothing else notices.
        #
        # These parsers read what the network puts in front of the machine: a
        # packet socket sees every frame on the interface, and the setup link is
        # pasted in by a person from wherever it arrived. Both of the bugs found
        # when these were written were found in the first minute.
        run: |
          set -eux
          go test ./internal/tunnel/l3/        -run=X -fuzz=FuzzParseHeader        -fuzztime=30s
          go test ./internal/tunnel/l3/        -run=X -fuzz=FuzzParseReplyPayload  -fuzztime=30s
          go test ./internal/utils/network/    -run=X -fuzz=FuzzParsePckFrame      -fuzztime=30s
          go test ./internal/utils/network/    -run=X -fuzz=FuzzDecodeXdiPayload   -fuzztime=30s
          go test ./internal/utils/network/    -run=X -fuzz=FuzzParseTCPFlags      -fuzztime=20s
          go test ./internal/utils/network/    -run=X -fuzz=FuzzParseSpoofProfile  -fuzztime=20s
          go test ./internal/manage/           -run=X -fuzz=FuzzDecodeShareLink    -fuzztime=30s
          go test ./internal/manage/           -run=X -fuzz=FuzzShareLinkRoundTrip -fuzztime=30s

      - name: Report a crasher
        if: failure()
        # A failing input is written into testdata/fuzz and is the most valuable
        # artifact this job can produce: it is a regression seed that will be
        # checked on every run once it is committed.
        run: |
          echo "A fuzz target failed. The input that did it:"
          find . -path '*/testdata/fuzz/*' -type f -print -exec cat {} \;

  soak:
    name: Sustained run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Two minutes of steady traffic, watching for a leak
        # The rest of the suite proves correctness over seconds. Both leaks this
        # project has had — pooled slots bleeding on a pairing timeout, and a
        # sixty-second timer per forwarded UDP packet — are invisible at that
        # timescale and were found by reading the code months later.
        #
        # The pass condition is a trend rather than a number: goroutine counts
        # wobble with scheduling and the heap saws between collections, so a
        # threshold on any single reading would fail on runner noise.
        env:
          BACKPACK_SOAK_SECONDS: "120"
        run: go test ./internal/e2e/ -run TestASustainedRunDoesNotLeak -count=1 -v -timeout 10m

  compat:
    name: Wire compatibility with the previous release
    runs-on: ubuntu-latest
    steps:
      # Tags, not just the tip: the previous release is found with
      # `git describe`, and a shallow clone has no tags to describe against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the previous release
        id: prev
        # The two ends of a tunnel are two machines and are never updated at the
        # same instant, so there is always a window where one end is new and the
        # other is not. A wire change that forgets this does not degrade — it
        # takes the tunnel down until somebody updates the far side, over a link
        # that may be the only way to reach it.
        #
        # A repository with no tag yet has nothing to compare against, which is a
        # reason to skip rather than to fail.
        run: |
          # A release tag may already point at HEAD. Compare against the
          # previous release, not this commit's newly tagged copy of itself.
          tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -z "$tag" ]; then
            echo "no previous tag to compare against; skipping"
            echo "binary=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "previous release: $tag"
          git worktree add --detach /tmp/prev "$tag"
          (cd /tmp/prev && go build -o /tmp/backpack-prev .)
          echo "binary=/tmp/backpack-prev" >> "$GITHUB_OUTPUT"

      - name: Old and new ends of one tunnel, both directions
        if: steps.prev.outputs.binary != ''
        env:
          BACKPACK_PREV_BINARY: ${{ steps.prev.outputs.binary }}
        run: go test ./internal/e2e/ -run TestThePreviousReleaseStillTalksToThisOne -count=1 -v

  build:
    name: Cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check the version is in step
        # VERSION is what the updater reads to detect a new release — the raw
        # file on main is the fallback the CLI uses when the GitHub API rate
        # limits the source's IP — so it must match the version compiled into
        # the binary.
        #
        # Before `make release`, and deliberately. `release` depends on the
        # `version` target, whose recipe regenerates VERSION from app.go; run
        # afterwards, this compared app.go with a file derived from app.go
        # moments earlier and could not fail however far the committed VERSION
        # had drifted. A guard that cannot fire is worse than no guard, because
        # it is read as one.
        run: |
          embedded="$(grep -oE 'Version = "v[0-9.]+"' internal/app/app.go | grep -oE 'v[0-9.]+')"
          declared="$(tr -d ' \n' < VERSION)"
          echo "embedded=$embedded declared=$declared"
          if [ "$embedded" != "$declared" ]; then
            echo "VERSION ($declared) does not match internal/app/app.go ($embedded)."
            echo "Run: make version"
            exit 1
          fi

      - name: Build both architectures
        run: make release

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            release/backpack_linux_amd64.tar.gz
            release/backpack_linux_arm64.tar.gz
            release/SHA256SUMS
          retention-days: 14
