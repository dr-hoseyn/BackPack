name: Focused dual-stack coverage diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dual-stack-diagnosis-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare fixtures
        run: |
          export BP_DIAG_LOGDIR="$RUNNER_TEMP/dual-stack-engine-logs"
          echo "BP_DIAG_LOGDIR=$BP_DIAG_LOGDIR" >> "$GITHUB_ENV"
          install -d -m 700 "$BP_DIAG_LOGDIR"
          sudo install -d -m 700 -o "$(id -un)" -g "$(id -gn)" /etc/backpack
          sudo install -m 600 -o "$(id -un)" -g "$(id -gn)" /dev/null /etc/backpack.restore.lock
      - name: Install the same pinned helper as the full coverage gate
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/SagerNet/sing-box/releases/download/v1.14.2/sing-box-1.14.2-linux-amd64.tar.gz -o "$RUNNER_TEMP/sing.tar.gz"
          echo "a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6  $RUNNER_TEMP/sing.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sing.tar.gz" -C "$RUNNER_TEMP"
          echo "BP_SINGBOX_BINARY=$RUNNER_TEMP/sing-box-1.14.2-linux-amd64/sing-box" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/sing-box-1.14.2-linux-amd64" >> "$GITHUB_ENV"
      - name: Run the full coverage suite with engine diagnostics
        run: |
          set -o pipefail
          go test ./... -count=1 -coverpkg=./... -coverprofile=coverage.out -v -timeout 20m | tee "$RUNNER_TEMP/dual-stack-coverage.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dual-stack-coverage-diagnostics
          path: |
            ${{ runner.temp }}/dual-stack-engine-logs/*.log
            ${{ runner.temp }}/dual-stack-coverage.txt
