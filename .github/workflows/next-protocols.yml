name: WSSMux resume pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Compare plain and resumable WSSMux bulk traffic
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/pilot"
          work="$RUNNER_TEMP/pilot"
          go vet ./tools/wssresume-pilot
          go build -o "$work/backpack" .
          go build -o "$work/pilot" ./tools/wssresume-pilot
          go build -o "$work/tunnelbench" ./tools/tunnelbench
          cd "$work"
          umask 077
          openssl rand -hex 32 > pilot.key
          token="$(openssl rand -hex 32)"
          cat > server.toml <<EOF
          [server]
          bind_addr = "127.0.0.1:38443"
          transport = "wssmux"
          token = "$token"
          preset = "throughput"
          skip_optz = true
          accept_udp = false
          heartbeat = 40
          keepalive = 75
          nodelay = true
          channel_size = 8192
          mux_con = 512
          mux_version = 2
          mux_framesize = 65535
          mux_recievebuffer = 33554432
          mux_streambuffer = 33554432
          ports = ["127.0.0.1:38444=127.0.0.1:38502", "127.0.0.1:38448=127.0.0.1:38501"]
          EOF
          cat > client.toml <<EOF
          [client]
          remote_addr = "127.0.0.1:38443"
          transport = "wssmux"
          token = "$token"
          preset = "throughput"
          skip_optz = true
          keepalive = 75
          nodelay = true
          dial_timeout = 5
          retry_interval = 1
          channel_size = 8192
          connection_pool = 64
          mux_version = 2
          mux_framesize = 65535
          mux_recievebuffer = 33554432
          mux_streambuffer = 33554432
          EOF
          pids=()
          trap 'kill "${pids[@]}" 2>/dev/null || true' EXIT
          ./tunnelbench -serve 127.0.0.1:38502 -mode bulk > backend.log 2>&1 & pids+=($!)
          ./pilot -mode exit -listen 127.0.0.1:38501 -target 127.0.0.1:38502 -key-file pilot.key > exit.log 2>&1 & exit_pid=$!; pids+=("$exit_pid")
          ./pilot -mode edge -listen 127.0.0.1:38449 -target 127.0.0.1:38448 -key-file pilot.key > edge.log 2>&1 & edge_pid=$!; pids+=("$edge_pid")
          ./backpack -c server.toml > server.log 2>&1 & server=$!; pids+=("$server")
          sleep 1
          ./backpack -c client.toml > client.log 2>&1 & client=$!; pids+=("$client")
          sleep 5
          measure() {
            python3 - "$@" <<'PY'
          import json,pathlib,sys
          result=[]
          for pid in sys.argv[1:]:
              cols=pathlib.Path("/proc",pid,"stat").read_text().split(") ",1)[1].split()
              result.append([int(cols[11])+int(cols[12]),int(cols[21])])
          print(json.dumps(result))
          PY
          }
          for case in raw-1 resume-1 resume-2 raw-2; do
            port=38444
            tracked=("$server" "$client")
            if [[ "$case" == resume-* ]]; then
              port=38449
              tracked+=("$edge_pid" "$exit_pid")
            fi
            measure "${tracked[@]}" > "$case-before.json"
            if ./tunnelbench -mode bulk -target "$case=127.0.0.1:$port" -parallel 8 -duration 10s -warmup 2s -io-timeout 10s -json > "$case-bulk.json"; then
              measure "${tracked[@]}" > "$case-after.json"
            else
              echo "$case failed"
              tail -10 edge.log exit.log server.log client.log
              exit 1
            fi
          done
          python3 - <<'PY' | tee summary.json
          import glob,json,os,pathlib,statistics
          summary={}
          for kind in ("raw","resume"):
              trials=[]
              for run in (1,2):
                  tag=f"{kind}-{run}"
                  rows=json.loads(pathlib.Path(f"{tag}-bulk.json").read_text())
                  before=json.loads(pathlib.Path(f"{tag}-before.json").read_text())
                  after=json.loads(pathlib.Path(f"{tag}-after.json").read_text())
                  trials.append(dict(directions={r["direction"]:round(r["verified_bulk_mbps"],2) for r in rows},
                    failures=sum(r["failures"] for r in rows),
                    cpu_seconds=round(sum(b[0]-a[0] for a,b in zip(before,after))/os.sysconf("SC_CLK_TCK"),3),
                    rss_mib=round(sum(r[1] for r in after)*os.sysconf("SC_PAGE_SIZE")/2**20,2)))
              summary[kind]=trials
          print(json.dumps(summary,indent=2))
          PY
          cat summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wssmux-resume-pilot
          path: |
            ${{ runner.temp }}/pilot/*-bulk.json
            ${{ runner.temp }}/pilot/summary.json
