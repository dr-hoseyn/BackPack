name: WSSMux Throughput backend CPU comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOMAXPROCS: '4'
      BP_RESOURCE_BENCHMARK: '1'
      BP_WSSMUX_THROUGHPUT: '1'
      BP_RESOURCE_ROUNDS: '32'
      BP_RESOURCE_IDLE_CONNECTIONS: '1000'
      BP_RESOURCE_TARGET_MBPS: '720'
      BP_RESOURCE_MIN_MBPS: '700'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Compare three pairs at the same offered rate
        run: |
          set -euo pipefail
          ulimit -n 16384
          results="$RUNNER_TEMP/results"
          mkdir -p "$results"
          git worktree add --detach "$RUNNER_TEMP/wssmux-base" 472ae493a82354f162c0b2219cd7e5d77c84ba24
          go test -c -o "$RUNNER_TEMP/candidate" ./internal/e2e
          (cd "$RUNNER_TEMP/wssmux-base" && go test -c -o "$RUNNER_TEMP/baseline" ./internal/e2e)
          for sample in 1 2 3; do
            order="baseline candidate"
            if [ "$sample" = 2 ]; then order="candidate baseline"; fi
            for kind in $order; do
              "$RUNNER_TEMP/$kind" -test.run '^TestWSMuxResourceProfile$' -test.v -test.timeout 2m \
                | tee "$results/$kind-$sample.log"
            done
          done
          for kind in baseline candidate; do
            BP_RESOURCE_PROFILE_DIR="$results" BP_RESOURCE_PROFILE_NAME="$kind" \
              "$RUNNER_TEMP/$kind" -test.run '^TestWSMuxResourceProfile$' -test.v -test.timeout 2m \
              | tee "$results/$kind-profile.log"
            go tool pprof -top -nodecount=35 "$RUNNER_TEMP/$kind" "$results/resource-$kind-cpu.pprof" \
              > "$results/$kind-profile.txt"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wssmux-backend-cpu
          path: ${{ runner.temp }}/results/*
