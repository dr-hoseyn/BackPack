name: WSSMux ChaCha20 CPU support experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOMAXPROCS: '4'
      BP_RESOURCE_BENCHMARK: '1'
      BP_WSSMUX_THROUGHPUT: '1'
      BP_RESOURCE_ROUNDS: '32'
      BP_RESOURCE_IDLE_CONNECTIONS: '1000'
      BP_RESOURCE_TARGET_MBPS: '720'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Isolate scalar and accelerated ChaCha20 on one Linux runner
        run: |
          set -euo pipefail
          ulimit -n 16384
          results="$RUNNER_TEMP/cipher-results"
          mkdir -p "$results"
          go test -c -o "$RUNNER_TEMP/cipher-fixture" ./internal/e2e
          grep -q -w ssse3 /proc/cpuinfo
          for run in accelerated-1 scalar-1 scalar-2 accelerated-2; do
            debug="cpu.aes=off"
            if [[ "$run" == scalar-* ]]; then debug="$debug,cpu.ssse3=off"; fi
            GODEBUG="$debug" BP_RESOURCE_PROFILE_DIR="$results" BP_RESOURCE_PROFILE_NAME="$run" \
              "$RUNNER_TEMP/cipher-fixture" -test.run '^TestWSMuxResourceProfile$' -test.v -test.timeout 2m \
              | tee "$results/$run.log"
            go tool pprof -top -nodecount=30 "$RUNNER_TEMP/cipher-fixture" "$results/resource-$run-cpu.pprof" \
              > "$results/$run-profile.txt"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wssmux-cipher-comparison
          path: ${{ runner.temp }}/cipher-results/*
