name: Next protocol regression tests
on:
  push:
    branches: [codex/next-protocols]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: next-protocols-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  networking:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Config and network regression tests with race detection
        run: |
          sudo install -d -m 700 -o "$(id -un)" -g "$(id -gn)" /etc/backpack
          go test ./config ./cmd ./internal/utils/network ./internal/masqueh2 ./internal/nativeudp ./internal/pathprobe ./internal/tunnel/adaptive ./internal/tunnel/l3 ./internal/manage/tunnelspec ./internal/shorthttps ./internal/tunnel/naive -race -count=1 -timeout 10m
      - name: Adaptive paths preserve active streams and recover new connections
        if: success() || failure()
        run: go test ./internal/e2e -run '^TestAdaptiveManagedPaths' -race -count=1 -v -timeout 4m
      - name: Verify vet and build
        if: success() || failure()
        run: |
          go vet ./...
          go build ./...
      - name: MPTCP multiple subflows and primary-path outage
        if: success() || failure()
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2
          go test -c -o "$RUNNER_TEMP/network.test" ./internal/utils/network
          sudo env TESTBIN="$RUNNER_TEMP/network.test" W="$RUNNER_TEMP/mptcp-live" timeout -k 5s 60s \
            unshare --net --mount --fork bash internal/e2e/testdata/mptcp-live.sh
      - name: Real MASQUE HTTP2 TUN, restart and loss
        if: success() || failure()
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 netcat-openbsd bc
          go build -o "$RUNNER_TEMP/backpack-next" .
          for scenario in ipv4 ipv6 restart loss; do
            extra=()
            case "$scenario" in
              ipv6) extra+=(IPV6=1) ;;
              restart) extra+=(RESTART=1) ;;
              loss) extra+=("NETEM=delay 20ms loss 1%") ;;
            esac
            sudo env BIN="$RUNNER_TEMP/backpack-next" W="$RUNNER_TEMP/masque-h2-$scenario" "${extra[@]}" \
              timeout -k 5s 6m unshare --net --mount --fork -- bash internal/e2e/testdata/l3live.sh masque-h2 1 \
              | tee "$RUNNER_TEMP/masque-h2-$scenario.out"
            grep -q '^RESULT OK' "$RUNNER_TEMP/masque-h2-$scenario.out"
          done
  management:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare private fixtures and test management
        run: |
          sudo install -d -m 700 -o "$(id -un)" -g "$(id -gn)" /etc/backpack
          go test ./internal/manage -race -count=1 -timeout 15m
  native-reverse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install verified pinned sing-box
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/SagerNet/sing-box/releases/download/v1.14.2/sing-box-1.14.2-linux-amd64.tar.gz -o "$RUNNER_TEMP/sing.tar.gz"
          echo "a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6  $RUNNER_TEMP/sing.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sing.tar.gz" -C "$RUNNER_TEMP"
          echo "BP_SINGBOX_BINARY=$RUNNER_TEMP/sing-box-1.14.2-linux-amd64/sing-box" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/sing-box-1.14.2-linux-amd64" >> "$GITHUB_ENV"
      - name: Real helper reverse TCP, stream/native UDP and directional EOF
        run: go test ./internal/e2e -run '^(TestSingReverse|TestAdaptiveNativeUDP)' -race -count=1 -v -timeout 8m
