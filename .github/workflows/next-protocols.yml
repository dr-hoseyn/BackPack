name: Short HTTPS resume capacity experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Measure 128 MiB of verified Short HTTPS echo with resume off and on
        env:
          BP_RESUME_RESOURCE_BENCHMARK: '1'
        run: go test ./internal/e2e -run '^TestManagedShortResumeResources$' -count=1 -v -timeout 5m
      - name: Measure WSSMux Throughput on the same runner
        if: success() || failure()
        env:
          BP_RESOURCE_BENCHMARK: '1'
          BP_WSSMUX_THROUGHPUT: '1'
          BP_RESOURCE_IDLE_CONNECTIONS: '1000'
          BP_RESOURCE_ROUNDS: '64'
          BP_RESOURCE_TARGET_MBPS: '720'
          BP_RESOURCE_MIN_MBPS: '700'
        run: go test ./internal/e2e -run '^TestWSMuxResourceProfile$' -count=1 -v -timeout 3m
