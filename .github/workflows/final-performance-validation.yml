        != nil {\n\t\t\t\tt.Fatal("flow EOF closed QUIC carrier")\n\t\t\t}\n\t\t})\n\t}\n}\n\n//
        This wrapper hides transport methods, as the bandwidth-limiting wrappers do.\ntype
        runtimeAuditUnderlyingConn struct{ net.Conn }\n\nfunc (c *runtimeAuditUnderlyingConn)
        UnderlyingConn() net.Conn { return c.Conn }\n\nfunc TestRuntimeAuditQUICTwoRelaysCarryTCPHalfClose(t
        *testing.T) {\n\ttunnel, peer, carrier := runtimeAuditHalfCloseQUICPair(t)\n\tclient,
        ingress := tcpPair(t)\n\tegress, service := tcpPair(t)\n\tctx, cancel := context.WithCancel(context.Background())\n\tdefer
