        server), peer, client\n}\n\nfunc TestRuntimeAuditQUICRequestEOFPreservesDelayedReply(t
        *testing.T) {\n\tfor _, name := range []string{"plain", "counted", "counted_underlying"}
        {\n\t\tt.Run(name, func(t *testing.T) {\n\t\t\ttunnel, peer, carrier := runtimeAuditHalfCloseQUICPair(t)\n\t\t\trelay,
        service := tcpPair(t)\n\t\t\tif name == "counted_underlying" {\n\t\t\t\ttunnel
        = &runtimeAuditUnderlyingConn{Conn: tunnel}\n\t\t\t}\n\t\t\tif name != "plain"
