        := bytes.Repeat([]byte("request"), 1000)\n\t\t\treply := bytes.Repeat([]byte("delayed-reply"),
        6000)\n\t\t\tserviceDone := make(chan error, 1)\n\t\t\tgo func() {\n\t\t\t\tservice.SetReadDeadline(time.Now().Add(3
        * time.Second))\n\t\t\t\tgot, err := io.ReadAll(service)\n\t\t\t\tif err !=
        nil {\n\t\t\t\t\tserviceDone <- err\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t\tif
        !bytes.Equal(got, request) {\n\t\t\t\t\tserviceDone <- io.ErrUnexpectedEOF\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t\ttime.Sleep(100
