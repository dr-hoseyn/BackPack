        secondDone} {\n\t\tselect {\n\t\tcase <-done:\n\t\tcase <-time.After(time.Second):\n\t\t\tt.Fatal("flow
        did not retire both relays")\n\t\t}\n\t}\n\tif carrier.Context().Err() !=
        nil {\n\t\tt.Fatal("flow EOF closed carrier")\n\t}\n}\n'',encoding=''utf-8'')

