name: WSSMux isolated loss investigation
on:
  push:
    branches: [codex/wssmux-next-validation]
  workflow_dispatch:
    inputs:
      baseline_ref:
        type: string
        default: codex/wssmux-integrated-validation
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [auto1, pinned2]
    env:
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build identical fixtures
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" '${{ inputs.baseline_ref || 'origin/codex/wssmux-integrated-validation' }}'
          cp internal/e2e/wssmux_resources_test.go "$RUNNER_TEMP/base/internal/e2e/"
          go test -c -o "$RUNNER_TEMP/candidate" ./internal/e2e
          (cd "$RUNNER_TEMP/base" && go test -c -o "$RUNNER_TEMP/baseline" ./internal/e2e)
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 ethtool
          sudo modprobe ifb
      - name: Seven alternating pairs with unchanged quality criteria
        run: |
          set -euo pipefail
          auto=""
          if [ '${{ matrix.mode }}' = auto1 ]; then auto=1; fi
          for sample in 1 2 3 4 5 6 7; do
            order="baseline candidate"
            if [ $((sample % 2)) -eq 0 ]; then order="candidate baseline"; fi
            for kind in $order; do
              sudo env GOMAXPROCS=4 BP_RESOURCE_BENCHMARK=1 BP_RESOURCE_IDLE_CONNECTIONS=16 \
                BP_RESOURCE_ROUNDS=2 BP_RESOURCE_NETEM=1 BP_RESOURCE_MUX_AUTO="$auto" BIN="$RUNNER_TEMP/$kind" \
                unshare --net -- bash -eu -c 'ip link set lo up; ulimit -n 16384; exec "$BIN" -test.run "^TestWSMuxResourceProfile$" -test.v -test.timeout 2m' \
                | tee "$RUNNER_TEMP/delayed-${{ matrix.mode }}-$kind-$sample.txt"
            done
          done
          # Change only the expected sample count, not acceptance thresholds.
          sed -i 's/(mode, 3) if delayed/(mode, 7) if delayed/' .github/scripts/compare-wssmux-resources.py
          python3 .github/scripts/compare-wssmux-resources.py "$RUNNER_TEMP" 'delayed-${{ matrix.mode }}' | tee "$RUNNER_TEMP/comparison.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: loss-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/delayed-*.txt
            ${{ runner.temp }}/comparison.json
