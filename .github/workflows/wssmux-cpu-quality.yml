name: WSS Mux CPU quality experiment

on:
  pull_request:
    paths:
      - profiles/**
      - third_party/smux/**
      - internal/**
      - config/**
      - go.mod
      - '.github/workflows/wssmux-cpu-quality.yml'
      - '.github/scripts/compare-wssmux-cpu-quality.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wssmux-cpu-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smux-upstream-race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify the complete upstream suite including both 8 GiB transfers under race detection
        working-directory: third_party/smux
        run: go test -race ./... -count=1 -timeout 15m
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify the quality gate rejects misleading wins
        run: python3 .github/scripts/test_compare_wssmux_cpu_quality.py
      - name: Verify the pinned smux implementation and extension
        run: |
          (cd third_party/smux && go test ./... -count=1 -timeout 5m)
          (cd third_party/smux && go test -race -run '^TestReadyBatch' -count=20 -timeout 1m)
          (cd third_party/smux && go test -run '^TestReadyBatch' -count=20 -timeout 1m)
          (cd third_party/smux && go test -run '^$' -bench . -benchtime=10x -timeout 3m)
      - name: Build the deployed baseline and opt-in batching candidate without PGO
        id: build
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '61eb57a48f9d3b012c7038400460915554f16d66' }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/quality-base" "$BASE_SHA"
          # The identical fixture decodes the optional flag through TOML, so
          # an older baseline can ignore the unknown option without source edits.
          cp internal/e2e/wssmux_resources_test.go "$RUNNER_TEMP/quality-base/internal/e2e/"
          (cd "$RUNNER_TEMP/quality-base" && go test -c -pgo=off -o "$RUNNER_TEMP/quality-baseline" ./internal/e2e)
          go test -c -pgo=off -o "$RUNNER_TEMP/quality-candidate" ./internal/e2e
          go build -trimpath -pgo=off -o "$RUNNER_TEMP/backpack-batch" .
          go version -m "$RUNNER_TEMP/backpack-batch" | tee "$RUNNER_TEMP/candidate-build.txt"
      - name: Preserve authentication, framing, ownership and cancellation
        env:
          BP_WSSMUX_WRITE_BATCH: '1'
        run: >-
          go test -race -pgo=off ./internal/utils/network ./internal/utils/handlers ./internal/client/transport ./internal/e2e
          -run '^(TestWSS|TestWSMux|TestWebSocket|TestMuxUpgrade|TestTLSTransports|TestAdaptiveRelay|TestMuxCapacityGrows)'
          -count=2 -timeout 5m
      - name: Alternate six equal-load pairs at 600 Mbit with 1000 open users
        env:
          BP_RESOURCE_BENCHMARK: '1'
          BP_WSSMUX_BOUNDED: '1'
          BP_RESOURCE_IDLE_CONNECTIONS: '1000'
          BP_RESOURCE_TARGET_MBPS: '600'
        run: |
          set -euo pipefail
          ulimit -n 16384
          for sample in 1 2 3 4 5 6; do
            order="baseline candidate"
            if [ $((sample % 2)) -eq 0 ]; then order="candidate baseline"; fi
            for kind in $order; do
              batch=""; if [ "$kind" = candidate ]; then batch=1; fi
              BP_WSSMUX_WRITE_BATCH="$batch" "$RUNNER_TEMP/quality-$kind" -test.run '^TestWSMuxResourceProfile$' -test.v -test.timeout 2m \
                | tee "$RUNNER_TEMP/paced-$kind-$sample.txt"
            done
          done
          python3 .github/scripts/compare-wssmux-cpu-quality.py "$RUNNER_TEMP" \
            | tee "$RUNNER_TEMP/paced-quality.json"
      - name: Verify download capacity without offered-load pacing
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          BP_CAPACITY_BENCHMARK: '1'
          BP_WSSMUX_BOUNDED: '1'
          BP_CAPACITY_MIN_MBPS: '600'
        run: |
          set -euo pipefail
          for kind in baseline candidate; do
            batch=""; if [ "$kind" = candidate ]; then batch=1; fi
            BP_WSSMUX_WRITE_BATCH="$batch" "$RUNNER_TEMP/quality-$kind" -test.run '^TestBulkProfileDownloadCapacity/wssmux$' \
              -test.count 3 -test.v -test.timeout 2m | tee "$RUNNER_TEMP/download-$kind.txt"
          done
      - name: Preserve quality with delay and packet loss
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 ethtool
          sudo modprobe ifb
          status=0
          for mode in auto1 pinned2; do
            auto=""
            if [ "$mode" = auto1 ]; then auto=1; fi
            for sample in 1 2 3; do
              order="baseline candidate"
              if [ $((sample % 2)) -eq 0 ]; then order="candidate baseline"; fi
              for kind in $order; do
                batch=""; if [ "$kind" = candidate ]; then batch=1; fi
                sudo env GOMAXPROCS=4 BP_WSSMUX_WRITE_BATCH="$batch" BP_RESOURCE_BENCHMARK=1 BP_RESOURCE_IDLE_CONNECTIONS=16 \
                  BP_RESOURCE_ROUNDS=2 BP_RESOURCE_NETEM=1 BP_RESOURCE_MUX_AUTO="$auto" \
                  BIN="$RUNNER_TEMP/quality-$kind" unshare --net -- bash -eu -c \
                  'ip link set lo up; exec "$BIN" -test.run "^TestWSMuxResourceProfile$" -test.v -test.timeout 2m' \
                  | tee "$RUNNER_TEMP/delayed-$mode-$kind-$sample.txt"
              done
            done
            python3 .github/scripts/compare-wssmux-cpu-quality.py "$RUNNER_TEMP" "delayed-$mode" 3 \
              | tee "$RUNNER_TEMP/delayed-$mode-quality.json" || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wssmux-cpu-quality
          path: |
            ${{ runner.temp }}/paced-*.txt
            ${{ runner.temp }}/delayed-*.txt
            ${{ runner.temp }}/download-*.txt
            ${{ runner.temp }}/*quality.json
            ${{ runner.temp }}/candidate-build.txt
