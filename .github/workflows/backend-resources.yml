name: Backend parsing resources

on:
  pull_request:
    paths:
      - internal/client/transport/backendpool*
      - .github/workflows/backend-resources.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-resources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backends:
    name: Bounded backend parsing and forwarding
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify backend order, health and allocation bounds
        run: go test -race ./internal/client/transport -run '^Test(Backend|UDPBackendSelection)' -count=5 -timeout 2m
      - name: Verify real tunnel forwarding across backends
        run: go test -race ./internal/e2e -run '^TestBackendPoolCarriesTrafficAcrossBackends$' -count=3 -timeout 2m
      - name: Compare base and head parsing resources
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="${BASE_SHA:-$(git rev-parse HEAD^)}"
          baseline="$RUNNER_TEMP/backend-baseline"
          mkdir -p "$baseline" "$RUNNER_TEMP/backend-results"
          git archive "$base" | tar -x -C "$baseline"
          cp internal/client/transport/backendpool_bench_test.go "$baseline/internal/client/transport/"
          printf 'base=%s\nhead=%s\n' "$base" "$(git rev-parse HEAD)" > "$RUNNER_TEMP/backend-results/revisions.txt"
          (
            cd "$baseline"
            go test ./internal/client/transport -run '^$' -bench '^Benchmark(BackendListParsing|FirstUDPBackend)$' -benchmem -count=6 -benchtime=500ms -timeout 2m
          ) | tee "$RUNNER_TEMP/backend-results/base.txt"
          go test ./internal/client/transport -run '^$' -bench '^Benchmark(BackendListParsing|FirstUDPBackend)$' -benchmem -count=6 -benchtime=500ms -timeout 2m | tee "$RUNNER_TEMP/backend-results/head.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-parsing-resources
          path: ${{ runner.temp }}/backend-results/
          if-no-files-found: ignore
