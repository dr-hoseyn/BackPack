name: Release

# Publishes the assets for a tag. A tag containing a suffix (v1.6.0-beta.1) is
# published as a pre-release, which is what the Beta release channel installs.
#
# A manual run (Actions -> Release -> Run workflow) publishes the commit it was
# started on. Its tag is the `tag` input, or VERSION when that is left blank, so
# a run started on main publishes main as the version main declares. Either way
# the tag still has to match VERSION, exactly as a pushed tag does.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v1.8.5 or v1.8.5-beta.1. Blank uses VERSION."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the tag
        # A pushed tag is its own name. A manual run started on a branch has
        # only the branch name in GITHUB_REF_NAME ("main"), which is not a
        # release, so it takes the tag from the input or from VERSION instead.
        #
        # Resolved before the test suite so a bad input fails in seconds.
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -eu
          input="$(printf '%s' "${INPUT_TAG:-}" | tr -d ' ')"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            if [ -n "$input" ] && [ "$input" != "$tag" ]; then
              echo "Started on tag $tag but asked to publish $input."
              exit 1
            fi
          else
            tag="${input:-$(tr -d ' \n' < VERSION)}"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "\"$tag\" is not a release tag (vX.Y.Z or vX.Y.Z-suffix)."
            exit 1
          fi
          # A manual run creates the tag at this commit. If the tag already
          # exists somewhere else, publishing would put this commit's binaries
          # under a release whose tag points at different source.
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            existing="$(git ls-remote --tags origin "refs/tags/$tag^{}" "refs/tags/$tag" | awk '{print $1}' | tail -1)"
            if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
              echo "Tag $tag already exists at $existing, not at $GITHUB_SHA."
              echo "Bump VERSION, or start the run on the tag itself."
              exit 1
            fi
          fi
          echo "Publishing $tag from $GITHUB_SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Prepare configuration test fixtures
        run: sudo install -d -m 700 -o "$(id -un)" -g "$(id -gn)" /etc/backpack

      - name: Require the configured signing key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "RELEASE_SIGNING_KEY is required for releases accepted by the pinned updater."
            exit 1
          fi

      # CI runs the complete test, race and coverage suites for this commit.
      # Build and compatibility checks can overlap that work; the mandatory
      # exact-commit CI gate below must pass before anything is published.
      - name: Build release assets
        # RELEASE_SIGNING_KEY signs release/SHA256SUMS. Without it the build
        # still produces every asset and simply publishes no signature, which
        # is what a fork gets — and what this repository got until a key was
        # generated. See tools/signsums and internal/manage/releasesig.go.
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: make release

      - name: Require the detached checksum signature
        run: test -s release/SHA256SUMS.sig

      - name: Real L3 TUN compatibility with the previous stable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          previous="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.draft == false and .prerelease == false and .tag_name != \"$TAG\")][0].tag_name")"
          printf '%s' "$previous" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          git fetch --depth 1 origin "refs/tags/$previous:refs/tags/$previous"
          git worktree add --detach "$RUNNER_TEMP/previous-l3" "$previous"
          (cd "$RUNNER_TEMP/previous-l3" && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/backpack-previous-l3" .)
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 netcat-openbsd bc tcpdump iptables
          BIN="$PWD/dist/backpack-linux-amd64" PREV_BIN="$RUNNER_TEMP/backpack-previous-l3" \
            bash .github/scripts/verify-release-l3.sh

      - name: Verify the tag matches the built version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          tag="$TAG"
          declared="$(tr -d ' \n' < VERSION)"
          # A pre-release tag (v1.6.0-beta.1) carries the version it is a
          # pre-release of, so compare only the part before the suffix.
          base="${tag%%-*}"
          if [ "$base" != "$declared" ]; then
            echo "Tag $tag does not match VERSION ($declared)."
            exit 1
          fi

      - name: Mark pre-releases
        id: kind
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          case "$TAG" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Release notes from CHANGELOG
        # The release description is this tag's section of CHANGELOG.md — from
        # its "## <tag>" heading up to the next version heading.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          tag="$TAG"
          awk -v h="## ${tag}" '
            index($0, h) == 1 { f = 1; next }
            f && /^## v/ { exit }
            f { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Backpack ${tag}" > RELEASE_NOTES.md
          fi

      - name: Require every CI workflow for this commit
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for attempt in $(seq 1 80); do
            ready=true
            for workflow in ci.yml protocol-suite.yml recovery-regressions.yml next-protocols.yml conntest-setup.yml throughput-capacity.yml high-concurrency.yml; do
              result="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&per_page=20" \
                --jq '.workflow_runs | sort_by(.run_number) | last | [.status, .conclusion] | @tsv')"
              case "$result" in
                *success*) echo "$workflow passed for $GITHUB_SHA" ;;
                completed*) echo "$workflow did not pass: $result"; exit 1 ;;
                *) ready=false; echo "Waiting for $workflow: $result" ;;
              esac
            done
            if [ "$ready" = true ]; then exit 0; fi
            sleep 30
          done
          echo "CI did not complete before the release deadline."
          exit 1

      - name: Publish
        # Pinned to a commit, not the moving v2 tag: this job holds
        # RELEASE_SIGNING_KEY, and steps in a job share a runner — so whoever
        # can repoint that tag can read the one secret the whole update
        # verification design rests on. Update deliberately, with the tag the
        # SHA belongs to written beside it.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Explicit, because a manual run on a branch has no tag in its ref.
          # For a pushed tag this is the same tag, so nothing changes there.
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.kind.outputs.prerelease }}
          body_path: RELEASE_NOTES.md
          # Every archive make release produced, by glob rather than by name.
          #
          # Listing them one by one is how five of the seven architectures came
          # to be built and then not published: the build learned about them and
          # this did not, and nothing failed — the assets simply were not there,
          # and an update on those machines 404s.
          files: |
            release/backpack_linux_*.tar.gz
            release/SHA256SUMS
            release/SHA256SUMS.sig
            release/SBOM.txt
            install.sh

      - name: Verify published signature and all seven archives
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/published-release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$assets"
          verify_source="$GITHUB_WORKSPACE/release-verify-sums-temp.go"
          trap 'rm -f "$verify_source"' EXIT
          cat > "$verify_source" <<'GO'
          package main
          import("crypto/ed25519";"encoding/base64";"fmt";"os";"path/filepath";"strings";"github.com/backpack/backpack/internal/app")
          func must(err error){if err!=nil{panic(err)}}
          func main(){
            root:=os.Args[1]
            sums,e:=os.ReadFile(filepath.Join(root,"SHA256SUMS"));must(e)
            raw,e:=os.ReadFile(filepath.Join(root,"SHA256SUMS.sig"));must(e)
            sig,e:=base64.StdEncoding.DecodeString(strings.TrimSpace(string(raw)));must(e)
            pub,e:=base64.StdEncoding.DecodeString(app.ReleasePublicKey);must(e)
            if !ed25519.Verify(pub,app.ReleaseSignedMessage(os.Getenv("TAG"),sums),sig){panic("invalid pinned-key release signature")}
            expected:=map[string]bool{}
            for _,a:=range []string{"amd64","arm64","386","s390x","armv5","armv6","armv7"}{expected["backpack_linux_"+a+".tar.gz"]=true}
            lines:=strings.Split(strings.TrimSpace(string(sums)),"\n")
            if len(lines)!=7{panic("expected exactly seven architectures")}
            for _,line:=range lines{f:=strings.Fields(line);if len(f)!=2 || !expected[f[1]]{panic("unexpected or duplicate checksum entry")};delete(expected,f[1])}
            if len(expected)!=0{panic("missing release architecture")}
            fmt.Println("Pinned Ed25519 signature verified for this release; all seven architectures covered")
          }
          GO
          go run "$verify_source" "$assets"
          rm -f "$verify_source"
          declared="$(tr -d ' \n' < VERSION)"
          cd "$assets"
          sha256sum -c SHA256SUMS
          test -s SBOM.txt
          test -s install.sh
          tar -xzf backpack_linux_amd64.tar.gz
          test "$(./backpack -v | head -1)" = "$declared"
          ./backpack version --json
          echo 'RESULT: published signature, all archive hashes, SBOM, installer and executable version verified'

      - name: Verify the published one-line installer
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh" -o "$RUNNER_TEMP/verify-install.sh"
          sudo bash "$RUNNER_TEMP/verify-install.sh" </dev/null
          test "$(/usr/local/bin/backpack -v | head -1)" = "$TAG"
          /usr/local/bin/backpack version --json | tee "$RUNNER_TEMP/installed-version.json"
          test -x /usr/local/lib/backpack/helpers/naive/v154.0.8037.49-4-amd64/naive
          test -x /usr/local/lib/backpack/helpers/sing-box/v1.14.2-amd64/sing-box
          test -s /usr/local/lib/backpack/helpers/sing-box/v1.14.2-amd64/libcronet.so
          test -x /usr/local/lib/backpack/helpers/xray/v26.3.27-amd64/xray
          grep -F "https://github.com/$GITHUB_REPOSITORY" "$RUNNER_TEMP/installed-version.json"
