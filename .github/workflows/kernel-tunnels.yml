name: Standard kernel tunnels

on:
  pull_request:
    paths:
      - 'config/kernel.go'
      - 'cmd/**'
      - 'internal/tunnel/kernel/**'
      - 'internal/manage/**'
      - '.github/scripts/kernel-tunnels-live.sh'
      - '.github/workflows/kernel-tunnels.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate paired configuration, rollback and encrypted reverse carrier
        run: go test -race ./internal/tunnel/kernel ./config ./cmd -count=1 -timeout 4m
      - name: Validate links and Quick speed coverage
        run: |
          sudo install -d -m 700 -o "$(id -un)" -g "$(id -gn)" /etc/backpack
          go test -race ./internal/manage -run 'TestKernel|TestQuickTest|TestTrafficObservationHasAWallClockLimit|TestScreenedRowsCannotBeRecommendedOrInstalled' -count=1 -timeout 4m
      - name: Install kernel test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iproute2 iputils-ping wireguard-tools strongswan-charon strongswan-swanctl libcharon-extra-plugins libstrongswan-extra-plugins
      - name: Build the actual engine
        run: go build -o "$RUNNER_TEMP/backpack-kernel" .
      - name: Exchange real packets in isolated network namespaces
        run: sudo bash .github/scripts/kernel-tunnels-live.sh "$RUNNER_TEMP/backpack-kernel"
      - name: Save isolated tunnel diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-tunnel-diagnostics
          path: /tmp/backpack-kernel-live-*/**/*.log
          if-no-files-found: ignore
