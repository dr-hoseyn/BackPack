        -race -count=5 -v -timeout 2m

        go vet ./...

        go run honnef.co/go/tools/cmd/staticcheck@latest ./...

        go test ./internal/client/transport ./internal/server/transport ./internal/utils/network
        ./internal/utils/handlers ./internal/tunnel/direct ./internal/tunnel/l3 ./internal/tunnel/limits
        ./internal/tunnel/bridge ./cmd -race -timeout 20m

        GOOS=linux GOARCH=amd64 go build ./...

        GOOS=linux GOARCH=arm64 go build ./...'
