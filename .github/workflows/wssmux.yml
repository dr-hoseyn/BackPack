name: WSS Mux blocked-backend credit regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Fixed Read path returns credit before the TCP write
        run: go test -race ./internal/utils/handlers -run '^TestMuxReceiveWindowCredit' -count=3 -v -timeout 1m
      - name: Previous WriterTo path reproduces the blocked credit
        run: |
          set -euo pipefail
          git show eb850d3844f612dd62fad4bdc0d1228549affd0b:internal/utils/handlers/mux_copy.go > "$RUNNER_TEMP/previous.go"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          path = str(pathlib.Path.cwd() / 'internal/utils/handlers/mux_copy.go')
          (root / 'previous.json').write_text(json.dumps({'Replace': {path: str(root / 'previous.go')}}))
          PY
          set +e
          go test -race -overlay "$RUNNER_TEMP/previous.json" ./internal/utils/handlers -run '^TestMuxReceiveWindowCredit' -count=1 -v -timeout 1m > "$RUNNER_TEMP/previous.txt" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/previous.txt"
          test "$result" -ne 0
          grep -F 'blocked TCP write withheld mux receive credit despite available stream capacity' "$RUNNER_TEMP/previous.txt"
