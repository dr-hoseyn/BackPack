        got TunnelSpec;applySpec=func(s TunnelSpec)error{got=s;return nil};_,err=updateReverseFromLink(ShareLink{Host:"127.0.0.1",Port:"9001",Tr:"wssmux",Tok:"pw"},LinkApplyOptions{},"audit59-client");if
        err!=nil{t.Fatal(err)};if got.Proxy!=s.Proxy||got.EdgeIP!=s.EdgeIP||got.LocalAddr!=s.LocalAddr||got.Interface!=s.Interface||got.SOMark!=s.SOMark{t.Fatal("setup
