        PY'
    - name: Generate extended regression fixtures
      run: 'python3 - <<''PY''

        from pathlib import Path

        Path(''internal/node/issue57_extended_test.go'').write_text(''package node\nimport("testing";"net";"context";"time";"strconv";"golang.org/x/crypto/ssh")\nfunc
        TestIssue57ChannelOpenDeadline(t *testing.T){key,err:=ssh.ParsePrivateKey(testHostKey);if
