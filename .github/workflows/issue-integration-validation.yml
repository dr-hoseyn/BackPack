        Path(''internal/tunnel/l3/issue59_audit_test.go'').write_text(''package l3\nimport("testing";"net")\nfunc
        TestIssue59FECMismatchRejected(t *testing.T){c:=&fecCarrier{cfg:FECConfig{Data:10,Parity:3},groups:make(map[uint32]*fecGroup)};addr:=&net.UDPAddr{};if
