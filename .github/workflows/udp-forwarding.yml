name: Forwarded UDP resources

on:
  pull_request:
    paths:
      - internal/server/transport/**
      - internal/utils/network/**
      - go.mod
      - go.sum
      - .github/workflows/udp-forwarding.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forwarded-udp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forwarding:
    name: UDP source isolation and resource comparison
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify forwarding behavior with the race detector
        run: >-
          go test -race ./internal/server/transport
          -run '^Test(ForwardedUDPValueAddresses|ClosingAnOldUDPFlow|ARefusedFlow|AdmittedFlowsCarry|FlowFramesBothDirections|ABusyUDPPort|AUDPFlowStays)'
          -count=5 -timeout 3m
      - name: Verify end-to-end UDP across every stream transport
        run: go test -race ./internal/e2e -run '^TestForwardedUDP' -count=1 -timeout 4m
      - name: Compare base and head on the same Linux runner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="${BASE_SHA:-$(git rev-parse HEAD^)}"
          baseline="$RUNNER_TEMP/udp-baseline"
          mkdir -p "$baseline" "$RUNNER_TEMP/udp-results"
          git archive "$base" | tar -x -C "$baseline"
          cp internal/server/transport/udpforward_bench_test.go "$baseline/internal/server/transport/"
          printf 'base=%s\nhead=%s\n' "$base" "$(git rev-parse HEAD)" > "$RUNNER_TEMP/udp-results/revisions.txt"
          (
            cd "$baseline"
            go test ./internal/server/transport -run '^$' -bench '^BenchmarkForwardedUDPReceive$' -benchmem -count=6 -benchtime=1s -timeout 3m
          ) | tee "$RUNNER_TEMP/udp-results/base.txt"
          go test ./internal/server/transport -run '^$' -bench '^BenchmarkForwardedUDPReceive$' -benchmem -count=6 -benchtime=1s -timeout 3m | tee "$RUNNER_TEMP/udp-results/head.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: forwarded-udp-resources
          path: ${{ runner.temp }}/udp-results/
          if-no-files-found: ignore
