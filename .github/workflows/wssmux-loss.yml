name: WSS Mux lossy-path investigation
on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Buffered relay reference before receive-frame reuse
        default: b2a6ebf66ed263b2cfb7887fc938378afe5872dc
        type: string
      previous_ref:
        description: Previous direct-frame relay reference
        default: eb850d3844f612dd62fad4bdc0d1228549affd0b
        type: string
      mode:
        description: Negotiated mux mode
        default: pinned2
        type: choice
        options: [pinned2, auto1]
permissions:
  contents: read
concurrency:
  group: wssmux-loss-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOMAXPROCS: '4'
      BASELINE_REF: ${{ inputs.baseline_ref }}
      PREVIOUS_REF: ${{ inputs.previous_ref }}
      MUX_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test adaptive buffers and actual mux-to-TCP relays
        run: |
          go test ./internal/utils/handlers -run '^Test(AdaptiveRelay|MuxReceive)' -count=5 -timeout 2m
          go test -race ./internal/utils/handlers -run '^Test(AdaptiveRelay|MuxReceive)' -count=3 -timeout 2m
      - name: Build three revisions with the identical measurement
        run: |
          set -euo pipefail
          for kind in baseline previous; do
            ref="$BASELINE_REF"
            if [ "$kind" = previous ]; then ref="$PREVIOUS_REF"; fi
            git worktree add --detach -- "$RUNNER_TEMP/$kind" "$ref"
            git -C "$RUNNER_TEMP/$kind" rev-parse HEAD > "$RUNNER_TEMP/loss-$kind-sha.txt"
            cp internal/e2e/wssmux_resources_test.go "$RUNNER_TEMP/$kind/internal/e2e/"
            (cd "$RUNNER_TEMP/$kind" && go test -c -o "$RUNNER_TEMP/loss-$kind" ./internal/e2e)
          done
          git rev-parse HEAD > "$RUNNER_TEMP/loss-candidate-sha.txt"
          go test -c -o "$RUNNER_TEMP/loss-candidate" ./internal/e2e
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 ethtool
          sudo modprobe ifb
      - name: Rotate independent processes with five paired loss seeds
        run: |
          set -euo pipefail
          auto=""
          if [ "$MUX_MODE" = auto1 ]; then auto=1; fi
          for sample in 1 2 3 4 5; do
            case "$sample" in
              1|4) order="baseline previous candidate" ;;
              2|5) order="candidate baseline previous" ;;
              3) order="previous candidate baseline" ;;
            esac
            for kind in $order; do
              sudo env GOMAXPROCS=4 BP_RESOURCE_BENCHMARK=1 BP_RESOURCE_IDLE_CONNECTIONS=16 \
                BP_RESOURCE_ROUNDS=8 BP_RESOURCE_NETEM=1 BP_RESOURCE_NETEM_SEED="$((41+sample))" \
                BP_RESOURCE_MUX_AUTO="$auto" BIN="$RUNNER_TEMP/loss-$kind" \
                unshare --net -- bash -eu -c 'ip link set lo up; ulimit -n 16384; exec "$BIN" -test.run "^TestWSMuxResourceProfile$" -test.v -test.timeout 3m' \
                | tee "$RUNNER_TEMP/loss-$kind-$sample.txt"
            done
          done
          python3 .github/scripts/compare-wssmux-loss.py "$RUNNER_TEMP" | tee "$RUNNER_TEMP/loss-comparison.json"
          cat "$RUNNER_TEMP/loss-comparison.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wssmux-loss-${{ inputs.mode }}
          path: ${{ runner.temp }}/loss-*.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wssmux-loss-${{ inputs.mode }}-comparison
          path: ${{ runner.temp }}/loss-comparison.json
