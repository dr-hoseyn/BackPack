name: Recovery regressions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wss-cpu-quality:
    name: ${{ matrix.transport }} CPU and verified connection quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        transport: [wss, wssmux]
    env:
      GOMAXPROCS: '4'
      BP_RESOURCE_BENCHMARK: '1'
      BP_RESOURCE_TRANSPORT: ${{ matrix.transport }}
      BP_RESOURCE_IDLE_CONNECTIONS: '64'
      BP_RESOURCE_ROUNDS: '16'
      BP_RESOURCE_BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify TLS record boundaries, bytes and legacy framing
        run: >-
          go test -race ./internal/utils/network ./internal/utils/handlers
          -run '^Test(WebSocketTLS|WebSocketRelay|WSMuxBinaryStreamAndLegacyCompatibility|WSMuxHeaderOnlyAndPayloadFramesKeepTheirBytes)'
          -count=3 -v -timeout 2m
      - name: Build the same workload on the PR base and candidate
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/wss-cpu-base" "$BP_RESOURCE_BASELINE_REF"
          echo "BP_RESOURCE_BASELINE_SHA=$(git -C "$RUNNER_TEMP/wss-cpu-base" rev-parse HEAD)" >> "$GITHUB_ENV"
          cp internal/e2e/wssmux_resources_test.go "$RUNNER_TEMP/wss-cpu-base/internal/e2e/"
          go test -c -o "$RUNNER_TEMP/wss-cpu-candidate" ./internal/e2e
          (cd "$RUNNER_TEMP/wss-cpu-base" && go test -c -o "$RUNNER_TEMP/wss-cpu-baseline" ./internal/e2e)
      - name: Alternate five verified baseline and candidate CPU samples
        run: |
          set -euo pipefail
          ulimit -n 16384
          for sample in 1 2 3 4 5; do
            order="baseline candidate"
            if [ $((sample % 2)) -eq 0 ]; then order="candidate baseline"; fi
            for kind in $order; do
              "$RUNNER_TEMP/wss-cpu-$kind" -test.run '^TestWSMuxResourceProfile$' -test.v -test.timeout 2m \
                | tee "$RUNNER_TEMP/wss-cpu-$kind-$sample.txt"
            done
          done
          python3 .github/scripts/compare-wss-cpu.py "$RUNNER_TEMP" | tee "$RUNNER_TEMP/wss-cpu-comparison.json"
          cat "$RUNNER_TEMP/wss-cpu-comparison.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve CPU profiles outside the timed comparison
        run: |
          set -euo pipefail
          for kind in baseline candidate; do
            BP_RESOURCE_PROFILE_DIR="$RUNNER_TEMP" BP_RESOURCE_PROFILE_NAME="wss-cpu-$kind" \
              "$RUNNER_TEMP/wss-cpu-$kind" -test.run '^TestWSMuxResourceProfile$' -test.v -test.timeout 2m \
              > "$RUNNER_TEMP/wss-cpu-profile-$kind.txt"
            go tool pprof -top -nodecount=30 "$RUNNER_TEMP/wss-cpu-$kind" \
              "$RUNNER_TEMP/resource-wss-cpu-$kind-cpu.pprof" > "$RUNNER_TEMP/wss-cpu-profile-$kind-cpu.txt"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.transport }}-cpu-quality
          path: |
            ${{ runner.temp }}/wss-cpu-*.txt
            ${{ runner.temp }}/wss-cpu-comparison.json
            ${{ runner.temp }}/resource-wss-cpu-*.pprof
  l3-udp-quality:
    name: L3 UDP and authenticated FEC CPU and quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Repeat datagram, deadline, fair pacing and authentication checks
        run: >-
          go test -race ./internal/tunnel/l3
          -run '^Test(UDPReply|UDPWriteQueue|UDPFlowClose|ForwarderCarriesUDP|ForwarderKeepsUDPFlows|ForwarderRoutesUDPRepliesAcrossAddressFamilies|ForwarderPacesUDPAcrossFlows|AuthenticatedFEC|FEC|ReviewedFEC)'
          -count=20 -v -timeout 3m
      - name: Measure verified reply CPU, FEC cost and idle memory
        run: |
          set -euo pipefail
          go test ./internal/tunnel/l3 -run '^$' -bench '^BenchmarkUDPIdleReplyFlows$' -benchtime=1x -count=3 | tee "$RUNNER_TEMP/udp-idle-candidate.txt"
          go test ./internal/tunnel/l3 -run '^$' -bench '^BenchmarkUDPForwardedReplies$' -benchmem -benchtime=1s -count=5 | tee "$RUNNER_TEMP/udp-idle-replies-candidate.txt"
          go test ./internal/tunnel/l3 -run '^$' -bench '^BenchmarkAuthenticatedFEC$' -benchmem -benchtime=1s -count=5 | tee "$RUNNER_TEMP/udp-idle-fec-candidate.txt"
      - name: Measure the same idle workers on the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/udp-idle-base" "$BASE_SHA"
          cp internal/tunnel/l3/udpflow_memory_test.go "$RUNNER_TEMP/udp-idle-base/internal/tunnel/l3/"
          cp internal/tunnel/l3/fec_cpu_test.go "$RUNNER_TEMP/udp-idle-base/internal/tunnel/l3/"
          cd "$RUNNER_TEMP/udp-idle-base"
          go test ./internal/tunnel/l3 -run '^$' -bench '^BenchmarkUDPIdleReplyFlows$' -benchtime=1x -count=3 | tee "$RUNNER_TEMP/udp-idle-base.txt"
          go test ./internal/tunnel/l3 -run '^$' -bench '^BenchmarkUDPForwardedReplies$' -benchmem -benchtime=1s -count=5 | tee "$RUNNER_TEMP/udp-idle-replies-base.txt"
          go test ./internal/tunnel/l3 -run '^$' -bench '^BenchmarkAuthenticatedFEC$' -benchmem -benchtime=1s -count=5 | tee "$RUNNER_TEMP/udp-idle-fec-base.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: l3-udp-fec-cpu-quality
          path: ${{ runner.temp }}/udp-idle-*.txt
  udp-readiness:
    name: Direct UDP listener readiness under race scheduling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Repeat UDP startup, stable flows, boundaries and large datagrams
        run: >-
          go test -race ./internal/tunnel/direct
          -run '^(TestTunnelForwardsUDP|TestUDPFlowIsStableAcrossDatagrams|TestUDPPreservesDatagramBoundaries|TestUDPCarriesALargeDatagram)$'
          -count=100 -v -timeout 3m
  address-failover:
    name: IPv4 IPv6 address health and active mux failover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate address lists, actual-route probes and cancellation
        run: >-
          go test -race ./config ./cmd ./internal/utils/network ./internal/client ./internal/manage
          -run '^Test(NormalizeMixedFamilyBackups|FallbackConfigNormalizesIPv6|Health|TCPHealth|IPv6HealthFailover|AddressFailoverEdits)'
          -count=2 -v -timeout 2m
      - name: Carry real TCPMux traffic from IPv4 to IPv6 and back and verify safe WSS probes
        run: >-
          go test -race ./internal/e2e
          -run '^Test(AddressHealthFailoverMovesActiveMuxBetweenIPv4AndIPv6|WSSHealth.*)$'
          -count=2 -v -timeout 5m
      - name: Repeat direct forwarded-port readiness under the race detector
        run: >-
          go test -race ./internal/tunnel/direct
          -run '^TestTunnelForwardsAPort$' -count=30 -v -timeout 2m

  update-health:
    name: Update payload verification and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify bounded payload probes and policy validation
        run: go test -race ./internal/updatehealth -count=3 -v -timeout 1m
      - name: Keep services active while cutting real TCP and Stealth tunnels
        run: go test -race ./internal/manage -run '^TestUpdateHealth' -count=3 -v -timeout 2m
      - name: Install and restore actual binary and config files in a private mount namespace
        run: |
          sudo env PATH="$PATH" GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" \
            timeout -k 5s 2m unshare --mount --net --fork -- \
            bash .github/scripts/test-update-health-install.sh

  history:
    name: Connection Test history and comparison
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Save and compare bounded credential-free samples
        run: go test ./internal/testhistory ./internal/manage ./internal/cli -run '^Test(ConcurrentRuns|CorruptOrOversized|ComparisonKeeps|EmptyStore|ConnectionTestHistory|OlderPeerWithoutJitter)' -race -count=1 -timeout 1m

  recovery:
    name: Descriptor recovery and IPv6 KCP transfers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Withdraw exited helpers and verify restart recovery
        run: go test ./internal/tunnel/adaptive ./internal/tunnel/naive -run '^Test(ManagedHelper|HelperReadiness|StartupRetry)' -race -count=3 -v -timeout 1m
      - name: Exhaust descriptors with an independent caller and backend
        run: go test ./internal/e2e -run '^TestATunnelSurvivesRunningOutOfFileDescriptors$' -count=5 -race -v -timeout 5m
      - name: Repeat peer termination while TCPMux frames are in flight
        run: go test ./internal/e2e -run '^TestAPeerKilledMidTransferDoesNotWedgeTheOther$' -count=5 -race -v -timeout 5m
      - name: Exercise descriptor recovery with coverage instrumentation
        run: go test ./internal/e2e -run '^TestATunnelSurvivesRunningOutOfFileDescriptors$' -count=5 -coverpkg=./... -v -timeout 5m
      - name: Repeat KCP download and upload over a 1400-byte IPv6 path
        run: |
          sudo env PATH="$PATH" GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" BP_L3_LIVE=1 \
            go test ./internal/manage -run '^TestTheKCPConnectionTestAcrossAnIPv6OnlyPath$' -count=5 -v -timeout 8m
      - name: Keep slow setup within both directional budgets and cancel pending dials
        run: go test ./internal/manage -run '^TestConnectionTestSpeed' -race -count=1 -v -timeout 1m

  performance:
    name: Native UDP performance and concurrent benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify buffers, payload correctness and resource sampling
        run: go test ./internal/nativeudp ./tools/tunnelbench -race -count=1 -timeout 1m
      - name: Record sender allocations and contention
        run: go test ./internal/nativeudp -run '^$' -bench '^BenchmarkNativeUDPEncryptedSend' -benchmem -benchtime 200ms -count=2
