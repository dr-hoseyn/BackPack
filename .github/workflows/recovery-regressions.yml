name: Recovery regressions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    name: Connection Test history and comparison
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Save and compare bounded credential-free samples
        run: go test ./internal/testhistory ./internal/manage ./internal/cli -run '^Test(ConcurrentRuns|CorruptOrOversized|ComparisonKeeps|EmptyStore|ConnectionTestHistory|OlderPeerWithoutJitter)' -race -count=1 -timeout 1m

  recovery:
    name: Descriptor recovery and IPv6 KCP transfers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Withdraw exited helpers and verify restart recovery
        run: go test ./internal/tunnel/adaptive ./internal/tunnel/naive -run '^Test(ManagedHelper|HelperReadiness|StartupRetry)' -race -count=3 -v -timeout 1m
      - name: Exhaust descriptors with an independent caller and backend
        run: go test ./internal/e2e -run '^TestATunnelSurvivesRunningOutOfFileDescriptors$' -count=5 -race -v -timeout 5m
      - name: Exercise descriptor recovery with coverage instrumentation
        run: go test ./internal/e2e -run '^TestATunnelSurvivesRunningOutOfFileDescriptors$' -count=5 -coverpkg=./... -v -timeout 5m
      - name: Repeat KCP download and upload over a 1400-byte IPv6 path
        run: |
          sudo env PATH="$PATH" GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" BP_L3_LIVE=1 \
            go test ./internal/manage -run '^TestTheKCPConnectionTestAcrossAnIPv6OnlyPath$' -count=5 -v -timeout 8m
      - name: Keep slow setup within both directional budgets and cancel pending dials
        run: go test ./internal/manage -run '^TestConnectionTestSpeed' -race -count=1 -v -timeout 1m

  performance:
    name: Native UDP performance and concurrent benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify buffers, payload correctness and resource sampling
        run: go test ./internal/nativeudp ./tools/tunnelbench -race -count=1 -timeout 1m
      - name: Record sender allocations and contention
        run: go test ./internal/nativeudp -run '^$' -bench '^BenchmarkNativeUDPEncryptedSend' -benchmem -benchtime 200ms -count=2
