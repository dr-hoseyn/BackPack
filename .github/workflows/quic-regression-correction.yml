        TestRuntimeAuditFECReopenedSender(t *testing.T) {\n\tsend, recv := newLossyPair(nil)\n\tcfg := FECConfig{Data: 4,
        Parity: 2}\n\ttx, err := newFECCarrier(send, cfg)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\trx, err := newFECCarrier(recv,
        cfg)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tfor i := range 8 {\n\t\tif _, err := tx.WriteTo([]byte(fmt.Sprintf("old-%d",
        i)), recv.addr); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\tif got := len(drain(t, rx)); got != 8 {\n\t\tt.Fatalf("old
        sender delivered=%d", got)\n\t}\n\t// A sender process/carrier reopens; the receiver and its FEC cache survive.\n\t//
        Reusing the same address is deliberate: restart recovery must work both\n\t// with a new source port and a NAT which
        assigns the same port again.\n\treopened, err := newFECCarrier(send, cfg)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tattempt,
        err := beginHandshakeFresh("fec-reopen-token", 0, "gre", 123456789)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tvar
        expected [][]byte\n\tfor i := range 4 {\n\t\tp := []byte(fmt.Sprintf("new-%d", i))\n\t\tif i == 0 {\n\t\t\tp = attempt.datagram()\n\t\t}\n\t\texpected
        = append(expected, p)\n\t\tif _, err := reopened.WriteTo(p, recv.addr); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\tgot
        := drain(t, rx)\n\tif len(got) != 4 {\n\t\tt.Fatalf("reopened sender delivered=%d want4; old FEC group/index suppresses
        fresh packets", len(got))\n\t}\n\tfor _, want := range expected {\n\t\tfound := false\n\t\tfor _, actual := range
        got {\n\t\t\tif bytes.Equal(want, actual) {\n\t\t\t\tfound = true\n\t\t\t}\n\t\t}\n\t\tif !found {\n\t\t\tt.Fatalf("fresh
        payload %q lost", want)\n\t\t}\n\t}\n}\n'',encoding="utf-8")

