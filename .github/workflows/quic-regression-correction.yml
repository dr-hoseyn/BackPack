        Path(''internal/server/transport/runtime_audit_quic_test.go'').write_text(''package transport\n\nimport (\n\t"context"\n\t"errors"\n\t"github.com/backpack/backpack/internal/utils"\n\t"github.com/backpack/backpack/internal/utils/network"\n\t"github.com/quic-go/quic-go"\n\t"io"\n\t"testing"\n\t"time"\n)\n\nfunc
