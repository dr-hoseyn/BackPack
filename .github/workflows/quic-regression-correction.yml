        Path(''internal/tunnel/direct/runtime_audit_dns_test.go'').write_text(''package direct\n\nimport (\n "context"\n "errors"\n
        "net"\n "sync"\n "testing"\n "time"\n\n "golang.org/x/net/dns/dnsmessage"\n)\n\nfunc auditStalledResolver(t *testing.T)(<-chan
        struct{},func()){\n t.Helper();old:=net.DefaultResolver;release:=make(chan struct{});started:=make(chan struct{},1);var
        once sync.Once\n unblock:=func(){once.Do(func(){close(release)})}\n net.DefaultResolver=&net.Resolver{PreferGo:true,Dial:func(ctx
        context.Context,network,address string)(net.Conn,error){\n  select{case started<-struct{}{}:default:}\n  select{case<-release:return
        nil,errors.New("audit DNS released");case<-ctx.Done():return nil,ctx.Err()}\n }}\n t.Cleanup(func(){unblock();net.DefaultResolver=old})\n
        return started,unblock\n}\n\nfunc TestRuntimeAuditBackendDNSCancel(t *testing.T){\n started,unblock:=auditStalledResolver(t)\n
        ctx,cancel:=context.WithCancel(context.Background());defer cancel();done:=make(chan error,1)\n go func(){_,err:=dialBackend(ctx,"tcp","cancel.backend-audit.invalid:443",time.Second);done<-err}()\n
        select{case<-started:case<-time.After(time.Second):t.Fatal("resolver did not start")}\n cancel()\n select{case err:=<-done:if
        !errors.Is(err,context.Canceled){t.Fatalf("error=%v",err)};case<-time.After(250*time.Millisecond):\n  t.Error("canceled
        backend dial still blocked in metadata DNS");unblock();select{case<-done:case<-time.After(time.Second):t.Error("dial
        did not leave after release")}\n }\n}\n\nfunc TestRuntimeAuditBackendDNSTimeout(t *testing.T){\n _,unblock:=auditStalledResolver(t)\n
        done:=make(chan error,1)\n go func(){_,err:=dialBackend(context.Background(),"tcp","timeout.backend-audit.invalid:443",40*time.Millisecond);done<-err}()\n
        select{case err:=<-done:if !errors.Is(err,context.DeadlineExceeded){t.Fatalf("error=%v",err)};case<-time.After(250*time.Millisecond):\n  t.Error("backend
        DialTimeout does not cover metadata DNS");unblock();select{case<-done:case<-time.After(time.Second):t.Error("dial
        did not leave after release")}\n }\n}\n\nfunc TestRuntimeAuditBackendDNSSharedBudget(t *testing.T){\n dns,err:=net.ListenPacket("udp","127.0.0.1:0");if
        err!=nil{t.Fatal(err)};defer dns.Close()\n var queries sync.WaitGroup;done:=make(chan struct{})\n go func(){defer
        close(done);buf:=make([]byte,2048);for{n,addr,err:=dns.ReadFrom(buf);if err!=nil{return};msg:=append([]byte(nil),buf[:n]...);queries.Add(1);go
        func(){defer queries.Done();time.Sleep(60*time.Millisecond)\n  var request dnsmessage.Message;if request.Unpack(msg)!=nil{return}\n  response:=dnsmessage.Message{Header:dnsmessage.Header{ID:request.ID,Response:true,RecursionAvailable:true},Questions:request.Questions}\n  for
        _,question:=range request.Questions{if question.Type==dnsmessage.TypeA{response.Answers=append(response.Answers,dnsmessage.Resource{Header:dnsmessage.ResourceHeader{Name:question.Name,Type:dnsmessage.TypeA,Class:dnsmessage.ClassINET},Body:&dnsmessage.AResource{A:[4]byte{127,0,0,1}}})}}\n  wire,err:=response.Pack();if
        err==nil{dns.WriteTo(wire,addr)}\n }()}}()\n defer func(){dns.Close();<-done;queries.Wait()}()\n old:=net.DefaultResolver;defer
        func(){net.DefaultResolver=old}()\n net.DefaultResolver=&net.Resolver{PreferGo:true,Dial:func(ctx context.Context,_,_
        string)(net.Conn,error){return (&net.Dialer{}).DialContext(ctx,"udp",dns.LocalAddr().String())}}\n backend,err:=net.Listen("tcp","127.0.0.1:0");if
        err!=nil{t.Fatal(err)};defer backend.Close()\n _,port,_:=net.SplitHostPort(backend.Addr().String());start:=time.Now()\n
        conn,err:=dialBackend(context.Background(),"tcp",net.JoinHostPort("budget.backend-audit.invalid",port),100*time.Millisecond)\n
        if conn!=nil{conn.Close()}\n if err==nil{t.Fatal("DNS checks and socket DNS each received a fresh timeout")}\n if
        elapsed:=time.Since(start);elapsed>250*time.Millisecond{t.Fatalf("shared budget exceeded: %v",elapsed)}\n}\n\nfunc
        TestRuntimeAuditBackendLiteralConnect(t *testing.T){\n for _,network:=range []string{"tcp","udp"}{t.Run(network,func(t
        *testing.T){\n  if network=="tcp"{listener,err:=net.Listen("tcp","127.0.0.1:0");if err!=nil{t.Fatal(err)};defer listener.Close();conn,err:=dialBackend(context.Background(),network,listener.Addr().String(),time.Second);if
        err!=nil{t.Fatal(err)};conn.Close()\n  }else{listener,err:=net.ListenPacket("udp","127.0.0.1:0");if err!=nil{t.Fatal(err)};defer
        listener.Close();conn,err:=dialBackend(context.Background(),network,listener.LocalAddr().String(),time.Second);if
        err!=nil{t.Fatal(err)};conn.Close()}\n })}\n for _,address:=range []string{"169.254.169.254:80","100.100.100.200:80","[fd00:ec2::254]:80"}{if
        conn,err:=dialBackend(context.Background(),"tcp",address,time.Second);err==nil{conn.Close();t.Fatalf("metadata target
        accepted: %s",address)}}\n}\n'',encoding="utf-8")

        Path(''internal/tunnel/l3/runtime_audit_fec_reopen_test.go'').write_text(''package l3\n\nimport (\n\t"bytes"\n\t"fmt"\n\t"testing"\n)\n\nfunc
        TestRuntimeAuditFECReopenedSender(t *testing.T) {\n\tsend, recv := newLossyPair(nil)\n\tcfg := FECConfig{Data: 4,
        Parity: 2}\n\ttx, err := newFECCarrier(send, cfg)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\trx, err := newFECCarrier(recv,
        cfg)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tfor i := range 8 {\n\t\tif _, err := tx.WriteTo([]byte(fmt.Sprintf("old-%d",
        i)), recv.addr); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\tif got := len(drain(t, rx)); got != 8 {\n\t\tt.Fatalf("old
        sender delivered=%d", got)\n\t}\n\t// A sender process/carrier reopens; the receiver and its FEC cache survive.\n\t//
        Reusing the same address is deliberate: restart recovery must work both\n\t// with a new source port and a NAT which
        assigns the same port again.\n\treopened, err := newFECCarrier(send, cfg)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tattempt,
        err := beginHandshakeFresh("fec-reopen-token", 0, "gre", 123456789)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tvar
        expected [][]byte\n\tfor i := range 4 {\n\t\tp := []byte(fmt.Sprintf("new-%d", i))\n\t\tif i == 0 {\n\t\t\tp = attempt.datagram()\n\t\t}\n\t\texpected
        = append(expected, p)\n\t\tif _, err := reopened.WriteTo(p, recv.addr); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\tgot
        := drain(t, rx)\n\tif len(got) != 4 {\n\t\tt.Fatalf("reopened sender delivered=%d want4; old FEC group/index suppresses
        fresh packets", len(got))\n\t}\n\tfor _, want := range expected {\n\t\tfound := false\n\t\tfor _, actual := range
        got {\n\t\t\tif bytes.Equal(want, actual) {\n\t\t\t\tfound = true\n\t\t\t}\n\t\t}\n\t\tif !found {\n\t\t\tt.Fatalf("fresh
