name: Corrected QUIC and integrated runtime regressions
permissions:
  contents: read
jobs:
  baseline:
    name: Reproduce all new failures on the previous integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v7
      with:
        ref: b1c951573abdf037568ec91075859f6599e6398c
        fetch-depth: 0
    - run: 'sudo mkdir -p /etc/backpack /etc/systemd/system /etc/cron.d

        sudo chmod 777 /etc/backpack /etc/systemd/system /etc/cron.d'
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - name: Temporary runtime regressions
      run: 'python3 - <<''PY''

        from pathlib import Path

        Path(''internal/tunnel/bridge/runtime_audit_test.go'').write_text(''package bridge\n\nimport (\n "bytes"\n "context"\n
        "io"\n "net"\n "testing"\n "time"\n\n "github.com/backpack/backpack/internal/metrics"\n "github.com/backpack/backpack/internal/tunnel/limits"\n)\n\nfunc
        TestRuntimeAuditBridgeEOFResponse(t *testing.T) {\n variants := []struct{name string; wrap func(net.Conn) net.Conn}{\n  {"plain",func(c
        net.Conn) net.Conn{return c}},\n  {"counted",metrics.CountedConn},\n  {"limited",func(c net.Conn) net.Conn{return
        limits.New(limits.Config{BandwidthMbps:1}).Wrap(context.Background(),c)}},\n  {"counted-limited",func(c net.Conn)
        net.Conn{return metrics.CountedConn(limits.New(limits.Config{BandwidthMbps:1}).Wrap(context.Background(),c))}},\n  {"limited-counted",func(c
        net.Conn) net.Conn{return limits.New(limits.Config{BandwidthMbps:1}).Wrap(context.Background(),metrics.CountedConn(c))}},\n
        }\n for _,variant:=range variants {t.Run(variant.name,func(t *testing.T){\n  user,left:=tcpPair(t); right,backend:=tcpPair(t)\n  ctx,cancel:=context.WithCancel(context.Background());defer
        cancel()\n  done:=make(chan struct{});go func(){Join(ctx,variant.wrap(left),right);close(done)}()\n  user.SetDeadline(time.Now().Add(3*time.Second));backend.SetDeadline(time.Now().Add(3*time.Second))\n  user.Write([]byte("request"));user.(*net.TCPConn).CloseWrite()\n  request,err:=io.ReadAll(backend);if
        err!=nil||string(request)!="request"{t.Fatalf("upload %q %v",request,err)}\n  time.Sleep(30*time.Millisecond)\n  response:=bytes.Repeat([]byte("reply"),4096)\n  if
        _,err=backend.Write(response);err!=nil{t.Fatalf("response write: %v",err)}\n  backend.(*net.TCPConn).CloseWrite()\n  got,err:=io.ReadAll(user);if
        err!=nil||!bytes.Equal(got,response){t.Fatalf("response length=%d want=%d error=%v",len(got),len(response),err)}\n  select{case<-done:case<-time.After(time.Second):t.Fatal("bridge
        did not drain")}\n })}\n}\n\nfunc TestRuntimeAuditBridgeHalfCloseCancel(t *testing.T){\n user,left:=tcpPair(t);right,backend:=tcpPair(t)\n
        ctx,cancel:=context.WithCancel(context.Background());defer cancel()\n done:=make(chan struct{});go func(){Join(ctx,left,right);close(done)}()\n
        user.(*net.TCPConn).CloseWrite();backend.SetReadDeadline(time.Now().Add(time.Second))\n if _,err:=io.ReadAll(backend);err!=nil{t.Fatal(err)}\n
        select{case<-done:t.Fatal("closed reverse direction before cancellation");case<-time.After(30*time.Millisecond):}\n
        cancel();select{case<-done:case<-time.After(time.Second):t.Fatal("half-closed bridge outlived cancellation")}\n}\n\nfunc
        TestRuntimeAuditBridgeMixedEOF(t *testing.T){\n user,left:=net.Pipe();right,backend:=tcpPair(t);defer user.Close()\n
        ctx,cancel:=context.WithCancel(context.Background());defer cancel()\n done:=make(chan struct{});go func(){Join(ctx,left,right);close(done)}()\n
        user.Close()\n select{case<-done:case<-time.After(time.Second):t.Fatal("non-TCP EOF did not tear down")}\n backend.SetReadDeadline(time.Now().Add(time.Second));if
        _,err:=io.ReadAll(backend);err!=nil{t.Fatal(err)}\n}\n\nfunc TestRuntimeAuditBridgeRateRemainsActive(t *testing.T){\n
        user,left:=tcpPair(t);right,backend:=tcpPair(t)\n ctx,cancel:=context.WithCancel(context.Background());defer cancel()\n
        done:=make(chan struct{});go func(){Join(ctx,limits.New(limits.Config{BandwidthMbps:1}).Wrap(ctx,metrics.CountedConn(left)),right);close(done)}()\n
        user.SetDeadline(time.Now().Add(5*time.Second));backend.SetDeadline(time.Now().Add(5*time.Second))\n user.(*net.TCPConn).CloseWrite();if
        _,err:=io.ReadAll(backend);err!=nil{t.Fatal(err)}\n response:=bytes.Repeat([]byte{7},250000)\n go func(){backend.Write(response);backend.(*net.TCPConn).CloseWrite()}()\n
        start:=time.Now();got,err:=io.ReadAll(user)\n if err!=nil||!bytes.Equal(got,response){t.Fatalf("paced response length=%d
        error=%v",len(got),err)}\n if elapsed:=time.Since(start);elapsed<700*time.Millisecond{t.Fatalf("pacing bypassed: %v",elapsed)}\n
        select{case<-done:case<-time.After(time.Second):t.Fatal("paced bridge did not drain")}\n}\n'',encoding="utf-8")

        Path(''internal/utils/network/runtime_audit_quic_test.go'').write_text(''package network\n\nimport (\n\t"bytes"\n\t"context"\n\t"errors"\n\t"github.com/quic-go/quic-go"\n\t"io"\n\t"net"\n\t"sync"\n\t"testing"\n\t"time"\n)\n\nfunc
        runtimeAuditQUICPair(t *testing.T) (*QUICStreamConn, *quic.Stream, *quic.Conn) {\n\tt.Helper()\n\tctx, cancel := context.WithTimeout(context.Background(),
        20*time.Second)\n\tt.Cleanup(cancel)\n\tlistener, err := QUICListen("127.0.0.1:0", QUICSettings{KeepAlivePeriod: time.Second,
        MaxIdleTimeout: 15 * time.Second})\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tt.Cleanup(func() { listener.Close()
        })\n\taccepted := make(chan *quic.Conn, 1)\n\tgo func() {\n\t\tc, err := listener.Accept(ctx)\n\t\tif err == nil {\n\t\t\taccepted
        <- c\n\t\t}\n\t}()\n\tcfg := (QUICSettings{KeepAlivePeriod: time.Second, MaxIdleTimeout: 15 * time.Second}).quicConfig()\n\tcfg.InitialStreamReceiveWindow
        = 32 * 1024\n\tcfg.MaxStreamReceiveWindow = 32 * 1024\n\tpeer, err := quic.DialAddr(ctx, listener.Addr().String(),
        quicClientTLS(), cfg)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tt.Cleanup(func() { peer.CloseWithError(0, "test
        end") })\n\tvar server *quic.Conn\n\tselect {\n\tcase server = <-accepted:\n\tcase <-ctx.Done():\n\t\tt.Fatal(ctx.Err())\n\t}\n\tt.Cleanup(func()
        { server.CloseWithError(0, "test end") })\n\tsender, err := peer.OpenStreamSync(ctx)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif
        _, err := sender.Write([]byte{1}); err != nil {\n\t\tt.Fatal(err)\n\t}\n\treceiver, err := server.AcceptStream(ctx)\n\tif
        err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif _, err := io.ReadFull(receiver, make([]byte, 1)); err != nil {\n\t\tt.Fatal(err)\n\t}\n\treturn
        NewQUICStreamConn(receiver, server).(*QUICStreamConn), sender, peer\n}\n\nfunc TestRuntimeAuditQUICCloseUnblocksRead(t
        *testing.T) {\n\tconn, _, peer := runtimeAuditQUICPair(t)\n\tdone := make(chan error, 1)\n\tgo func() { _, err :=
        conn.Read(make([]byte, 1)); done <- err }()\n\tif err := conn.Close(); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tselect
        {\n\tcase err := <-done:\n\t\tif err == nil {\n\t\t\tt.Fatal("closed read succeeded")\n\t\t}\n\tcase <-time.After(time.Second):\n\t\tt.Fatal("net.Conn.Close
        left QUIC Read blocked")\n\t}\n\tif peer.Context().Err() != nil {\n\t\tt.Fatal("closing stream closed carrier")\n\t}\n\tif
        err := conn.Close(); err != nil {\n\t\tt.Fatal("second Close:", err)\n\t}\n}\n\nfunc TestRuntimeAuditQUICCloseUnblocksWrite(t
        *testing.T) {\n\tconn, _, peer := runtimeAuditQUICPair(t)\n\tdone := make(chan error, 1)\n\tgo func() { _, err :=
        conn.Write(make([]byte, 16*1024*1024)); done <- err }()\n\tselect {\n\tcase err := <-done:\n\t\tt.Fatalf("write did
        not reach flow-control block: %v", err)\n\tcase <-time.After(100 * time.Millisecond):\n\t}\n\tclosed := make(chan
        error, 1)\n\tgo func() { closed <- conn.Close() }()\n\tselect {\n\tcase err := <-closed:\n\t\tif err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\tcase
        <-time.After(time.Second):\n\t\tt.Fatal("Close blocked behind Write")\n\t}\n\tselect {\n\tcase err := <-done:\n\t\tif
        err == nil {\n\t\t\tt.Fatal("blocked Write survived Close")\n\t\t}\n\tcase <-time.After(time.Second):\n\t\tt.Fatal("net.Conn.Close
        left QUIC Write blocked")\n\t}\n\tif peer.Context().Err() != nil {\n\t\tt.Fatal("closing stream closed carrier")\n\t}\n}\n\nfunc
        TestRuntimeAuditQUICClosePreservesCompletedReply(t *testing.T) {\n\tconn, peer, _ := runtimeAuditQUICPair(t)\n\tpayload
        := bytes.Repeat([]byte("reply"), 1600)\n\tif n, err := conn.Write(payload); err != nil || n != len(payload) {\n\t\tt.Fatalf("write
        n=%d err=%v", n, err)\n\t}\n\tif err := conn.Close(); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tpeer.SetReadDeadline(time.Now().Add(3
        * time.Second))\n\tgot, err := io.ReadAll(peer)\n\tif err != nil || !bytes.Equal(got, payload) {\n\t\tt.Fatalf("completed
        reply lost: got=%d err=%v", len(got), err)\n\t}\n}\n\nfunc TestRuntimeAuditQUICCloseConcurrentWriteAndClose(t *testing.T)
        {\n\tconn, _, _ := runtimeAuditQUICPair(t)\n\tvar workers sync.WaitGroup\n\tstart := make(chan struct{})\n\tfor range
        8 {\n\t\tworkers.Add(1)\n\t\tgo func() {\n\t\t\tdefer workers.Done()\n\t\t\t<-start\n\t\t\t_, err := conn.Write([]byte("reply"))\n\t\t\tif
        err != nil && !errors.Is(err, net.ErrClosed) { /* active stream reset is also expected */\n\t\t\t}\n\t\t}()\n\t\tworkers.Add(1)\n\t\tgo
        func() { defer workers.Done(); <-start; conn.Close() }()\n\t}\n\tclose(start)\n\tdone := make(chan struct{})\n\tgo
        func() { workers.Wait(); close(done) }()\n\tselect {\n\tcase <-done:\n\tcase <-time.After(3 * time.Second):\n\t\tt.Fatal("concurrent
        Write/Close hung")\n\t}\n\tif _, err := conn.Write([]byte{1}); !errors.Is(err, net.ErrClosed) {\n\t\tt.Fatalf("Write
        after Close err=%v", err)\n\t}\n}\n'',encoding="utf-8")

