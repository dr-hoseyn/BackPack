name: Issue 57 Linux validation
permissions:
  contents: read
jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: bf45f31a3a33df9990648c5e0c2c35dee377adec
    - name: Prepare writable system fixtures
      run: 'sudo mkdir -p /etc/backpack /etc/systemd/system /etc/cron.d

        sudo chmod 777 /etc/backpack /etc/systemd/system /etc/cron.d'
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Verify formatting
      run: "unformatted=\"$(gofmt -l . || true)\"\nif [ -n \"$unformatted\" ]; then\n\
        \  echo \"These files are not gofmt'd:\"\n  echo \"$unformatted\"\n  exit\
        \ 1\nfi\n"
    - name: Vet
      run: go vet ./...
    - name: Test
      run: go test ./... -timeout 20m
    - name: Test with the race detector
      run: go test ./... -race -timeout 20m
    - name: Coverage
      run: "go test ./... -coverpkg=./... -coverprofile=coverage.out -timeout 20m\n\
        total=\"$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9.]+')\"\
        \necho \"total coverage: ${total}%\"\nfloor=50\nawk -v t=\"$total\" -v f=\"\
        $floor\" 'BEGIN {\n  if (t+0 < f+0) {\n    printf \"coverage %.1f%% is below\
        \ the floor of %d%%\\n\", t, f\n    exit 1\n  }\n}'\n"
    - name: Per-package coverage floors
      run: "set -eu\ncheck() {\n  pkg=\"$1\"; floor=\"$2\"; why=\"$3\"\n  got=\"$(go\
        \ tool cover -func=coverage.out \\\n          | grep \"^github.com/backpack/backpack/$pkg/\"\
        \ \\\n          | awk '{gsub(/%/,\"\",$3); s+=$3; n++} END {if (n) printf\
        \ \"%.1f\", s/n; else print \"0\"}')\"\n  echo \"  $pkg: ${got}% (floor ${floor}%)\
        \ \xE2\u20AC\u201D $why\"\n  awk -v g=\"$got\" -v f=\"$floor\" -v p=\"$pkg\"\
        \ 'BEGIN {\n    if (g+0 < f+0) { printf \"%s fell below its floor\\n\", p;\
        \ exit 1 }\n  }'\n}\ncheck internal/tunnel/l3      60 \"the layer-3 data path\"\
        \ncheck internal/tunnel/chain   80 \"transport fallback: a wrong decision\
        \ here takes a tunnel down\"\ncheck internal/control        50 \"the fleet\
        \ and the job runner\"\ncheck internal/cli            60 \"the scriptable\
        \ surface; scripts depend on its exit codes\"\ncheck internal/node       \
        \    40 \"the fleet RPC and the staged rollout\"\ncheck internal/metrics \
        \       60 \"what every other component reads to decide anything\"\ncheck\
        \ internal/menu           25 \"the screens an operator actually meets this\
        \ product through\"\ncheck internal/server/transport 85 \"the Iran side of\
        \ every reverse transport: lifecycle, forwarder, control loop\"\ncheck internal/client/transport\
        \ 83 \"the kharej side of every reverse transport\"\ncheck internal/controlwire\
        \    95 \"the control channel's wire, shared by both ends\"\ncheck internal/utils/acceptloop\
        \ 90 \"accept backoff and the pre-authentication gate (ADR 0004)\"\ncheck\
        \ internal/manage/tunnelspec 70 \"a tunnel's configuration: render, load,\
        \ apply with revert\"\ncheck internal/manage/host    60 \"this machine's addresses,\
        \ ports and certificates\"\ncheck internal/manage/health  40 \"tunnel health,\
        \ the watchdog and the Health Check\"\n"
    timeout-minutes: 55
  audit:
    name: Vulnerabilities and static analysis
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: bf45f31a3a33df9990648c5e0c2c35dee377adec
    - name: Prepare writable system fixtures
      run: 'sudo mkdir -p /etc/backpack /etc/systemd/system /etc/cron.d

        sudo chmod 777 /etc/backpack /etc/systemd/system /etc/cron.d'
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - name: Known vulnerabilities
      run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
    - name: Static analysis
      run: 'go run honnef.co/go/tools/cmd/staticcheck@latest ./...

        '
    timeout-minutes: 55
  fuzz:
    name: Fuzz the parsers
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: bf45f31a3a33df9990648c5e0c2c35dee377adec
    - name: Prepare writable system fixtures
      run: 'sudo mkdir -p /etc/backpack /etc/systemd/system /etc/cron.d

        sudo chmod 777 /etc/backpack /etc/systemd/system /etc/cron.d'
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - name: Fuzz
      run: 'set -eux

        go test ./internal/tunnel/l3/        -run=X -fuzz=FuzzParseHeader        -fuzztime=30s

        go test ./internal/tunnel/l3/        -run=X -fuzz=FuzzParseReplyPayload  -fuzztime=30s

        go test ./internal/utils/network/    -run=X -fuzz=FuzzParsePckFrame      -fuzztime=30s

        go test ./internal/utils/network/    -run=X -fuzz=FuzzDecodeXdiPayload   -fuzztime=30s

        go test ./internal/utils/network/    -run=X -fuzz=FuzzParseTCPFlags      -fuzztime=20s

        go test ./internal/utils/network/    -run=X -fuzz=FuzzParseSpoofProfile  -fuzztime=20s

        go test ./internal/manage/           -run=X -fuzz=FuzzDecodeShareLink    -fuzztime=30s

        go test ./internal/manage/           -run=X -fuzz=FuzzShareLinkRoundTrip -fuzztime=30s

        '
    - name: Report a crasher
      if: failure()
      run: 'echo "A fuzz target failed. The input that did it:"

        find . -path ''*/testdata/fuzz/*'' -type f -print -exec cat {} \;

        '
    timeout-minutes: 55
  soak:
    name: Sustained run
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: bf45f31a3a33df9990648c5e0c2c35dee377adec
    - name: Prepare writable system fixtures
      run: 'sudo mkdir -p /etc/backpack /etc/systemd/system /etc/cron.d

        sudo chmod 777 /etc/backpack /etc/systemd/system /etc/cron.d'
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - name: Two minutes of steady traffic, watching for a leak
      env:
        BACKPACK_SOAK_SECONDS: '120'
      run: go test ./internal/e2e/ -run TestASustainedRunDoesNotLeak -count=1 -v -timeout
        10m
    timeout-minutes: 55
  compat:
    name: Wire compatibility with the previous release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: bf45f31a3a33df9990648c5e0c2c35dee377adec
    - name: Prepare writable system fixtures
      run: 'sudo mkdir -p /etc/backpack /etc/systemd/system /etc/cron.d

        sudo chmod 777 /etc/backpack /etc/systemd/system /etc/cron.d'
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - name: Build the previous release
      id: prev
      run: "tag=\"$(git describe --tags --abbrev=0 2>/dev/null || true)\"\nif [ -z\
        \ \"$tag\" ]; then\n  echo \"no previous tag to compare against; skipping\"\
        \n  echo \"binary=\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\necho \"previous\
        \ release: $tag\"\ngit worktree add --detach /tmp/prev \"$tag\"\n(cd /tmp/prev\
        \ && go build -o /tmp/backpack-prev .)\necho \"binary=/tmp/backpack-prev\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
    - name: Old and new ends of one tunnel, both directions
      if: steps.prev.outputs.binary != ''
      env:
        BACKPACK_PREV_BINARY: ${{ steps.prev.outputs.binary }}
      run: go test ./internal/e2e/ -run TestThePreviousReleaseStillTalksToThisOne
        -count=1 -v
    timeout-minutes: 55
  build:
    name: Cross-build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: bf45f31a3a33df9990648c5e0c2c35dee377adec
    - name: Prepare writable system fixtures
      run: 'sudo mkdir -p /etc/backpack /etc/systemd/system /etc/cron.d

        sudo chmod 777 /etc/backpack /etc/systemd/system /etc/cron.d'
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - name: Check the version is in step
      run: "embedded=\"$(grep -oE 'Version = \"v[0-9.]+\"' internal/app/app.go | grep\
        \ -oE 'v[0-9.]+')\"\ndeclared=\"$(tr -d ' \\n' < VERSION)\"\necho \"embedded=$embedded\
        \ declared=$declared\"\nif [ \"$embedded\" != \"$declared\" ]; then\n  echo\
        \ \"VERSION ($declared) does not match internal/app/app.go ($embedded).\"\n\
        \  echo \"Run: make version\"\n  exit 1\nfi\n"
    - name: Build both architectures
      run: make release
    - uses: actions/upload-artifact@v7
      with:
        name: release-assets
        path: 'release/backpack_linux_amd64.tar.gz

          release/backpack_linux_arm64.tar.gz

          release/SHA256SUMS

          '
        retention-days: 14
    timeout-minutes: 55
  regressions:
    name: Issue 57 runtime regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        ref: bf45f31a3a33df9990648c5e0c2c35dee377adec
        fetch-depth: 0
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - run: 'sudo mkdir -p /etc/backpack

        sudo chmod 777 /etc/backpack'
    - name: Generate temporary behavior regressions
      run: 'python3 - <<''PY''

        from pathlib import Path

        Path(''internal/webui/issue57_audit_test.go'').write_text(''package webui\nimport("testing";"os";"net/url";"net/http";"net/http/httptest";"sync";"sync/atomic";"time";"strings";"net";"github.com/gorilla/websocket")\nfunc
        TestIssue57MissingCredentials(t *testing.T){useConfigFile(t,Config{Password:"pw"});if
        err:=os.Remove(configPath());err!=nil{t.Fatal(err)};w:=postLogin(t,loginServer(),url.Values{"password":
        {""}});if cookieNamed(w,sessionCookie)!=nil{t.Fatal("runtime missing credentials
        admitted empty password")}}\nfunc TestIssue57PendingPasswordRotation(t *testing.T){secret,_:=newTOTPSecret();useConfigFile(t,Config{Password:"old",TOTPSecret:secret});s:=loginServer();pending:=s.pending.create("203.0.113.7");if
        err:=s.updatePassword("new");err!=nil{t.Fatal(err)};code,_:=totpCode(secret,time.Now());w:=postLogin(t,s,url.Values{"code":{code}},&http.Cookie{Name:twoFactorCookie,Value:pending});if
        cookieNamed(w,sessionCookie)!=nil{t.Fatal("old password pending sign-in survived
        rotation")}}\nfunc TestIssue57RecoveryAtomic(t *testing.T){codes,hashes,err:=newRecoveryCodes();if
        err!=nil{t.Fatal(err)};secret,_:=newTOTPSecret();useConfigFile(t,Config{Password:"pw",TOTPSecret:secret,RecoveryHashes:hashes});var
        wg sync.WaitGroup;var successes atomic.Int32;start:=make(chan struct{});for
        range 32{wg.Add(1);go func(){defer wg.Done();<-start;if checkSecondFactor(codes[0]){successes.Add(1)}}()};close(start);wg.Wait();if
        successes.Load()!=1{t.Fatalf("single recovery code accepted %d times",successes.Load())}}\nfunc
        TestIssue57TerminalLifetime(t *testing.T){for _,expiry:=range []bool{false,true}{t.Run(map[bool]string{false:"revocation",true:"expiry"}[expiry],func(t
        *testing.T){s:=loginServer();tok:=s.sessions.create("127.0.0.1");if expiry{s.sessions.mu.Lock();entry:=s.sessions.sessions[tok];entry.expires=time.Now().Add(700*time.Millisecond);s.sessions.sessions[tok]=entry;s.sessions.mu.Unlock()};done:=make(chan
        struct{});srv:=httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter,r
        *http.Request){defer close(done);s.handleTerminal(w,r)}));defer srv.Close();ws,_,err:=websocket.DefaultDialer.Dial(strings.Replace(srv.URL,"http:","ws:",1),http.Header{"Cookie":{sessionCookie+"="+tok}});if
        err!=nil{t.Fatal(err)};defer func(){ws.Close();select{case <-done:case <-time.After(5*time.Second):t.Error("terminal
        handler did not stop")}}();if !expiry{s.sessions.destroy(tok)};ws.SetReadDeadline(time.Now().Add(2*time.Second));for{_,_,err:=ws.ReadMessage();if
        err!=nil{if ne,ok:=err.(net.Error);ok&&ne.Timeout(){t.Error("terminal remained
        open after session ended")};break}}})}}\n'')

        Path(''cmd/issue57_audit_test.go'').write_text(''package cmd\nimport("testing";"context";"os";"path/filepath";"time";"github.com/backpack/backpack/internal/quota")\nfunc
        TestIssue57QuotaFailsClosed(t *testing.T){dir:=t.TempDir();path:=filepath.Join(dir,"audit.toml");if
        err:=os.WriteFile(quota.Path(dir,"audit"),[]byte("{"),0600);err!=nil{t.Fatal(err)};if
        !quotaReached(path){t.Fatal("invalid quota permits start")};ctx,cancel:=context.WithTimeout(context.Background(),20*time.Millisecond);defer
        cancel();ok,waited:=awaitQuota(ctx,path);if ok||!waited{t.Fatal("invalid quota
        permits resume")};gen,end:=context.WithCancel(context.Background());defer
        end();stopped:=make(chan struct{});done:=make(chan struct{});go func(){defer
        close(done);watchQuota(gen,path,func(){close(stopped)})}();select{case <-stopped:case
        <-time.After(300*time.Millisecond):t.Error("initial quota read error ignored")};end();<-done}\n'')

        Path(''internal/node/issue57_audit_test.go'').write_text(''package node\nimport("testing";"context";"net";"time";"strconv")\nfunc
        TestIssue57HandshakeCancellation(t *testing.T){ln,err:=net.Listen("tcp","127.0.0.1:0");if
        err!=nil{t.Fatal(err)};defer ln.Close();peer:=make(chan net.Conn,1);go func(){c,e:=ln.Accept();if
        e==nil{peer<-c}}();host,port,_:=net.SplitHostPort(ln.Addr().String());number,_:=strconv.Atoi(port);ctx,cancel:=context.WithTimeout(context.Background(),100*time.Millisecond);defer
        cancel();done:=make(chan error,1);go func(){c,_,e:=dialSSH(ctx,"audit",SSHTarget{Host:host,Port:number,User:"audit"});if
        c!=nil{c.Close()};done<-e}();c:=<-peer;defer c.Close();select{case e:=<-done:if
        e==nil{t.Fatal("handshake unexpectedly accepted")};case <-time.After(600*time.Millisecond):c.Close();<-done;t.Fatal("SSH
        handshake ignored cancellation")}}\n'')

        PY'
    - name: Prove baseline defects
      run: 'git worktree add --detach /tmp/issue57-baseline ff86354bcafbd054e7888e48343145323c9b2207

        for file in internal/webui/issue57_audit_test.go cmd/issue57_audit_test.go
        internal/node/issue57_audit_test.go; do cp "$file" "/tmp/issue57-baseline/$file";
        done

        cd /tmp/issue57-baseline

        if go test ./internal/webui ./cmd ./internal/node -run TestIssue57 -count=1
        -timeout 3m > /tmp/baseline.log 2>&1; then cat /tmp/baseline.log; exit 1;
        fi

        cat /tmp/baseline.log

        if grep -q ''build failed'' /tmp/baseline.log; then exit 1; fi

        '
    - name: Fixed behavior and race detector
      run: go test ./internal/webui ./cmd ./internal/node -run TestIssue57 -race -count=3
        -v -timeout 5m
'on':
  push:
    branches:
    - codex/validate-issue-57
