name: Protocol suite
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: protocols-${{ github.ref }}
  cancel-in-progress: true
jobs:
  helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned official sing-box in the disposable runner
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/SagerNet/sing-box/releases/download/v1.14.2/sing-box-1.14.2-linux-amd64.tar.gz -o "$RUNNER_TEMP/sing.tar.gz"
          echo "a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6  $RUNNER_TEMP/sing.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sing.tar.gz" -C "$RUNNER_TEMP"
          echo "BP_SINGBOX_BINARY=$RUNNER_TEMP/sing-box-1.14.2-linux-amd64/sing-box" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/sing-box-1.14.2-linux-amd64" >> "$GITHUB_ENV"
      - name: Actual TCP and native UDP transfers with all four protocols
        run: go test ./internal/tunnel/naive -run '^TestSing' -count=1 -race -v -timeout 8m
      - name: Reverse engines, concurrent transfers, UDP and reply after EOF
        run: go test ./internal/e2e -run '^TestSingReverse' -count=1 -race -v -timeout 4m
      - name: Prepare private configuration fixtures
        run: sudo install -d -m 700 -o "$(id -un)" -g "$(id -gn)" /etc/backpack
      - name: Native carriers through Noise and paired management settings
        run: go test ./cmd ./internal/manage ./internal/tunnel/l3 ./internal/amneziawg ./config -run '^(TestSing|TestNativeSing|TestNativeDatagram|TestAWG|TestManagedAWG|TestManagedTelemetry|TestConnectionTestStartup|TestEveryShareLink|TestHelperCertificate)' -count=1 -race -v -timeout 4m
      - name: Real Linux TUN, IPv4 and IPv6, process restart and packet loss
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 netcat-openbsd bc
          go build -o "$RUNNER_TEMP/backpack-protocols" .
          for protocol in hysteria2 tuic; do
            for scenario in ipv4 ipv6 restart loss; do
              extra=()
              case "$scenario" in
                ipv6) extra+=(IPV6=1) ;;
                restart) extra+=(RESTART=1) ;;
                loss) extra+=("NETEM=delay 20ms loss 1%") ;;
              esac
              sudo env BIN="$RUNNER_TEMP/backpack-protocols" W="$RUNNER_TEMP/native-$protocol-$scenario" \
                BP_SINGBOX_BINARY="$BP_SINGBOX_BINARY" LD_LIBRARY_PATH="$LD_LIBRARY_PATH" "${extra[@]}" \
                timeout -k 5s 6m unshare --net --mount --fork -- bash internal/e2e/testdata/l3live.sh "$protocol" 1 \
                | tee "$RUNNER_TEMP/native-$protocol-$scenario.out"
              grep -q '^RESULT OK' "$RUNNER_TEMP/native-$protocol-$scenario.out"
            done
          done
          for scenario in ipv4 ipv6 restart loss; do
            extra=()
            case "$scenario" in
              ipv6) extra+=(IPV6=1) ;;
              restart) extra+=(RESTART=1) ;;
              loss) extra+=("NETEM=delay 20ms loss 1%") ;;
            esac
            sudo env MANAGED=1 BIN="$RUNNER_TEMP/backpack-protocols" W="$RUNNER_TEMP/managed-awg-$scenario" "${extra[@]}" \
              timeout -k 5s 6m unshare --net --mount --fork -- bash internal/amneziawg/testdata/live.sh \
              | tee "$RUNNER_TEMP/managed-awg-$scenario.out"
            grep -q '^RESULT OK' "$RUNNER_TEMP/managed-awg-$scenario.out"
          done
      - name: Native Connection Test coordinator over real IPv4 and IPv6 paths
        shell: bash
        run: |
          set -euo pipefail
          sudo install -D -m 755 "$BP_SINGBOX_BINARY" /usr/local/lib/backpack/helpers/sing-box/v1.14.2-amd64/sing-box
          go test -c -o "$RUNNER_TEMP/protocol-conntest.test" ./internal/manage
          for protocol in hysteria2 tuic; do
            for ipv6 in 0 1; do
              work="$RUNNER_TEMP/native-conntest-$protocol-$ipv6"
              sudo env BIN="$RUNNER_TEMP/backpack-protocols" TESTBIN="$RUNNER_TEMP/protocol-conntest.test" \
                W="$work" SOAK=3 ONLY="direct/$protocol" CT_IPV6="$ipv6" PATHMTU=1400 LD_LIBRARY_PATH="$LD_LIBRARY_PATH" \
                timeout -k 5s 6m unshare --net --mount --fork -- bash internal/manage/testdata/conntestlive.sh \
                | tee "$work.out"
              grep -q '^RESULT DONE' "$work.out"
              sudo python3 - "$work/iran.json" "$protocol" <<'PY'
          import json, sys
          rows = json.load(open(sys.argv[1]))
          selected = [r for r in rows if r['k'] == 'direct' and r['t'] == sys.argv[2]]
          assert len(selected) == 1 and selected[0]['s'] == 'ok', rows
          PY
            done
          done
      - name: Regression tests and race detector
        run: go test ./... -race -count=1 -timeout 15m
      - name: Vet
        run: go vet ./...
      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Reachable vulnerability audit
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
