name: Carrier diagnostics
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/carrierdiag ./internal/pathprobe -count=3 -timeout 2m
      - run: go test -race ./internal/manage ./internal/cli -run 'TestCarrierDiagnostic|TestDiagnose' -count=1 -timeout 2m
