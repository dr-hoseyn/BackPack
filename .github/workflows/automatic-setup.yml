name: Automatic setup
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/manage -run 'TestAutomatic|TestKharejLinkNeverAsksForAProtocol|TestManagedPath|TestManagedHTTPS|TestReverseSummary|TestDirectSummary' -count=1 -timeout 3m
