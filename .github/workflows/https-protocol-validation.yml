name: Tunnel runtime cancellation and resource audit
permissions:
  contents: read
'on':
  push:
    branches:
    - codex/validate-https-protocols
jobs:
  quic-baseline:
    name: Reproduce reverse QUIC DNS cancellation and deadline failures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 5c170cf85e918a3f1519209178af1c6bf752af1b
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - run: '

        if go test ./internal/utils/network -run ''^TestQUICDialDNSStopsWithContext$'' -v -timeout 1m > /tmp/quic-baseline.log
        2>&1; then cat /tmp/quic-baseline.log; exit 1; fi

        cat /tmp/quic-baseline.log

        test "$(grep -c ''QUIC DNS ignored parent cancellation or deadline'' /tmp/quic-baseline.log)" = 2

        '
  quic-fixed:
    name: QUIC resolver budgets, existing transport races and vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 02850b6d183f89ab82d115cc66a9063c4dc897f2
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - run: '

        go test ./internal/utils/network -run ''TestQUICDialDNSStopsWithContext|TestQUICAddressResolution|TestQUICConnectionOutlivesItsSetupBudget''
        -race -count=5 -v -timeout 2m

        go test ./internal/utils/network ./internal/client/transport ./internal/server/transport -race -timeout 8m

        go vet ./internal/utils/network ./internal/client/transport ./internal/server/transport

        '
