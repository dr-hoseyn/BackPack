        Path(''/tmp/helper-functions.sh'').write_text(s)

        PY

        source /tmp/helper-functions.sh

        info(){ printf ''%s\n'' "$*"; }

        err(){ printf ''%s\n'' "$*" >&2; }

        fetch(){ curl -fSL --retry 2 --connect-timeout 15 --max-time 180 "$1" -o "$2"; }

        export BP_HELPER_TEST_ROOT=$(mktemp -d /tmp/backpack-helper-install.XXXXXX)

        ARCH=amd64; BP_HELPERS=naive,xray

        helpers_validate

        install_helpers

        naive="$BP_HELPER_TEST_ROOT/naive/v154.0.8037.49-4-amd64/naive"

        sing="$BP_HELPER_TEST_ROOT/sing-box/v1.14.2-amd64/sing-box"

        xray="$BP_HELPER_TEST_ROOT/xray/v26.3.27-amd64/xray"

        "$naive" --version

        "$sing" version

        "$xray" version

        before=$(sha256sum "$naive")

        fetch(){ return 1; }

        install_helper naive

        test "$(sha256sum "$naive")" = "$before"

        BP_HELPERS=wrong; if helpers_validate; then exit 1; fi

        ARCH=s390x; BP_HELPERS=naive; if helpers_validate; then exit 1; fi

        ARCH=amd64; BP_HELPERS=; install_helpers

        # Corrupt/download failures are checked in a separate fresh owned directory.

        original="$BP_HELPER_TEST_ROOT"; export BP_HELPER_TEST_ROOT=$(mktemp -d /tmp/backpack-helper-failed.XXXXXX)

        fetch(){ printf corrupt > "$2"; }

        if install_helper naive; then exit 1; fi

