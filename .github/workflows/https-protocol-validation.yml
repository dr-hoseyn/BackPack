    name: Reproduce Naive independent certificate reload contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 55b3104b8e5909d169ae4053879daaca72c825dc
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - *id003
    - run: 'if go test ./internal/tunnel/naive -run TestNaiveServerJSONFreezesValidatedCertificate -v -timeout 1m > /tmp/cert-baseline.log
        2>&1; then cat /tmp/cert-baseline.log; exit 1; fi

        cat /tmp/cert-baseline.log

        grep -E "FAIL: TestNaiveServerJSONFreezesValidatedCertificate" /tmp/cert-baseline.log'
