name: Tunnel runtime cancellation and resource audit
permissions:
  contents: read
'on':
  push:
    branches:
    - codex/validate-https-protocols
jobs:
  kcp-baseline:
    name: Reproduce KCP UDP and PCK resolver cancellation and timeout failures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        ref: da304fba4bbed2e5d7c3e3091076455d884ecd1d
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - run: '

        if go test ./internal/client/transport -run ''^TestKCPClientDNSStopsWithItsDialAttempt$'' -v -timeout 1m > /tmp/kcp-baseline.log
        2>&1; then cat /tmp/kcp-baseline.log; exit 1; fi

        cat /tmp/kcp-baseline.log

        test "$(grep -c ''KCP DNS ignored client cancellation or configured dial timeout'' /tmp/kcp-baseline.log)" = 4

        '
  kcp-fixed:
    name: KCP UDP PCK ICMP cancellation, address compatibility and FEC lifetime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 36e6bcac95a09512b6b5c817f248e8b589122d57
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - run: '

        go test ./internal/client/transport -run ''^TestKCPClientDNSStopsWithItsDialAttempt$'' -race -count=5 -v -timeout
        2m

        go test ./internal/utils/network -run ''TestKCPAddressResolution|TestKCPSessionOutlivesItsSetupBudget'' -race -count=10
        -v -timeout 2m

        go test ./internal/utils/network ./internal/client/transport ./internal/server/transport ./internal/e2e -race -timeout
        10m

        go vet ./internal/utils/network ./internal/client/transport ./internal/server/transport ./internal/e2e

        '
  cohort-full:
    name: Complete integrated regression and race suite with all new runtime repairs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        ref: f180c7f6b2fc2e7fd0a4a1d07ec37b888466209f
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - run: '

        sudo install -d -m 700 -o "$(id -un)" -g "$(id -gn)" /etc/backpack

        go test ./... -timeout 10m

        go test ./internal/utils/network ./internal/client/transport ./internal/server/transport ./internal/tunnel/... ./cmd
        -race -timeout 10m

        go vet ./...

        '
