name: Managed HTTPS helpers Naive completion and protocol validation
permissions:
  contents: read
'on':
  push:
    branches:
    - codex/validate-https-protocols
jobs:
  baseline:
    name: Reproduce inherited-output restart and check descendant failures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 4f49f103a0bde83bc5ab70e9f62c81301d84d696
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - &id001
      run: 'python3 - <<''PY''

        from pathlib import Path

        Path(''internal/tunnel/naive/runtime_audit_lifecycle_test.go'').write_text(''//go:build linux\n\npackage naive\n\nimport
        (\n\t"context"\n\t"io"\n\t"net"\n\t"os"\n\t"path/filepath"\n\t"strconv"\n\t"strings"\n\t"syscall"\n\t"testing"\n\t"time"\n\n\t"github.com/sirupsen/logrus"\n)\n\nfunc
        auditLivePID(pid int) bool {\n\tb, err := os.ReadFile("/proc/" + strconv.Itoa(pid) + "/stat")\n\tif err != nil {\n\t\treturn
        false\n\t}\n\tfields := strings.Fields(string(b)[strings.LastIndexByte(string(b), \'')\'')+1:])\n\treturn len(fields)
        > 0 && fields[0] != "Z"\n}\n\nfunc auditReadPID(t *testing.T, file string) int {\n\tt.Helper()\n\tuntil := time.Now().Add(time.Second)\n\tfor
        time.Now().Before(until) {\n\t\tb, _ := os.ReadFile(file)\n\t\tpid, err := strconv.Atoi(strings.TrimSpace(string(b)))\n\t\tif
        err == nil && pid > 0 {\n\t\t\treturn pid\n\t\t}\n\t\ttime.Sleep(time.Millisecond)\n\t}\n\tt.Fatalf("no PID at %s",
        file)\n\treturn 0\n}\n\nfunc TestAuditNaiveRuntimeDescendantsAreKilled(t *testing.T) {\n\tdir := t.TempDir()\n\tpidfile
        := filepath.Join(dir, "runtime-child")\n\tbinary := filepath.Join(dir, "helper")\n\tscript := "#!/bin/sh\\nsleep 300
        &\\necho $! > \''" + pidfile + "\''\\nexec sleep 300\\n"\n\tif err := os.WriteFile(binary, []byte(script), 0700);
        err != nil {\n\t\tt.Fatal(err)\n\t}\n\tlistener, err := net.Listen("tcp", "127.0.0.1:0")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tdefer
        listener.Close()\n\tlog := logrus.New()\n\tlog.SetOutput(io.Discard)\n\tctx, cancel := context.WithCancel(context.Background())\n\tdefer
        cancel()\n\th, err := startManaged(ctx, binary, "client-fixture", []byte("{}"), listener.Addr().String(), os.Environ(),
        log, nil)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tdefer h.Close()\n\tchild := auditReadPID(t, pidfile)\n\tdefer
        syscall.Kill(child, syscall.SIGKILL)\n\tcancel()\n\tdone := make(chan struct{})\n\tgo func() { h.Close(); close(done)
        }()\n\tselect {\n\tcase <-done:\n\tcase <-time.After(3 * time.Second):\n\t\tt.Fatal("helper cancellation was unbounded")\n\t}\n\tif
        auditLivePID(child) {\n\t\tt.Fatal("runtime helper descendant survived cancellation")\n\t}\n\tif _, err := os.Stat(h.dir);
        !os.IsNotExist(err) {\n\t\tt.Fatal("private helper configuration survived cancellation")\n\t}\n}\n\nfunc TestAuditNaiveCheckDescendantsAreKilled(t
        *testing.T) {\n\tfor _, outcome := range []string{"success", "failure"} {\n\t\tt.Run(outcome, func(t *testing.T) {\n\t\t\tdir
        := t.TempDir()\n\t\t\tpidfile := filepath.Join(dir, "check-child")\n\t\t\tbinary := filepath.Join(dir, "helper")\n\t\t\texit
        := "0"\n\t\t\tif outcome == "failure" {\n\t\t\t\texit = "17"\n\t\t\t}\n\t\t\tscript := "#!/bin/sh\\nif [ \\"$1\\"
        = check ]; then\\n sleep 300 >/dev/null 2>&1 &\\n echo $! > \''" + pidfile + "\''\\n exit " + exit + "\\nfi\\nexec
        sleep 300\\n"\n\t\t\tif err := os.WriteFile(binary, []byte(script), 0700); err != nil {\n\t\t\t\tt.Fatal(err)\n\t\t\t}\n\t\t\tlistener,
        err := net.Listen("tcp", "127.0.0.1:0")\n\t\t\tif err != nil {\n\t\t\t\tt.Fatal(err)\n\t\t\t}\n\t\t\tdefer listener.Close()\n\t\t\tlog
        := logrus.New()\n\t\t\tlog.SetOutput(io.Discard)\n\t\t\tctx, cancel := context.WithCancel(context.Background())\n\t\t\tdefer
        cancel()\n\t\t\th, err := startManaged(ctx, binary, "server", []byte("{}"), listener.Addr().String(), os.Environ(),
        log, nil)\n\t\t\tchild := auditReadPID(t, pidfile)\n\t\t\tdefer syscall.Kill(child, syscall.SIGKILL)\n\t\t\tif h !=
        nil {\n\t\t\t\th.Close()\n\t\t\t}\n\t\t\tif outcome == "success" && err != nil {\n\t\t\t\tt.Fatalf("successful check
        failed: %v", err)\n\t\t\t}\n\t\t\tif outcome == "failure" && err == nil {\n\t\t\t\tt.Fatal("failed check was accepted")\n\t\t\t}\n\t\t\tif
        auditLivePID(child) {\n\t\t\t\tt.Fatal("check-command descendant survived helper cleanup")\n\t\t\t}\n\t\t})\n\t}\n}\n\nfunc
        TestAuditNaiveLeaderExitRestartsWithInheritedOutput(t *testing.T) {\n\tdir := t.TempDir()\n\tpidfile := filepath.Join(dir,
        "inherited-output-child")\n\tbinary := filepath.Join(dir, "helper")\n\tscript := "#!/bin/sh\\nsleep 300 &\\necho $!
        > \''" + pidfile + "\''\\nsleep 0.2\\nexit 0\\n"\n\tif err := os.WriteFile(binary, []byte(script), 0700); err != nil
        {\n\t\tt.Fatal(err)\n\t}\n\tlistener, err := net.Listen("tcp", "127.0.0.1:0")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tdefer
        listener.Close()\n\tlog := logrus.New()\n\tlog.SetOutput(io.Discard)\n\tctx, cancel := context.WithCancel(context.Background())\n\tdefer
        cancel()\n\th, err := startManaged(ctx, binary, "client-fixture", []byte("{}"), listener.Addr().String(), os.Environ(),
        log, nil)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tdefer h.Close()\n\tfirst := auditReadPID(t, pidfile)\n\tdefer
        syscall.Kill(first, syscall.SIGKILL)\n\tuntil := time.Now().Add(1500 * time.Millisecond)\n\tchanged := false\n\tfor
        time.Now().Before(until) {\n\t\tb, _ := os.ReadFile(pidfile)\n\t\tpid, _ := strconv.Atoi(strings.TrimSpace(string(b)))\n\t\tif
        pid != 0 && pid != first {\n\t\t\tchanged = true\n\t\t\tbreak\n\t\t}\n\t\ttime.Sleep(10 * time.Millisecond)\n\t}\n\tcancel()\n\th.Close()\n\tif
        !changed {\n\t\tt.Fatal("helper leader exited, but inherited output blocked Wait and prevented restart")\n\t}\n}\n'',encoding=''utf-8'')

        PY'
    - run: 'if go test ./internal/tunnel/naive -run "TestAuditNaiveLeaderExitRestartsWithInheritedOutput|TestAuditNaiveCheckDescendantsAreKilled"
        -count=1 -v -timeout 2m > /tmp/lifecycle-baseline.log 2>&1; then cat /tmp/lifecycle-baseline.log; exit 1; fi

        cat /tmp/lifecycle-baseline.log

        grep -E "check-command descendant survived|helper did not restart|leader exit" /tmp/lifecycle-baseline.log'
  lifecycle:
    name: Exact Naive lifecycle and validated TLS renewal races
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 55b3104b8e5909d169ae4053879daaca72c825dc
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - *id001
    - run: 'go test ./internal/tunnel/naive -run TestAuditNaive -race -count=3 -v -timeout 3m

        go test ./cmd -run "TestHelperCertificateRenewal|TestAwaitConfigChange|TestAnInvalidEdit" -race -count=2 -timeout
        5m

        sudo mkdir -p /etc/backpack /etc/systemd/system /etc/cron.d

        sudo chmod 777 /etc/backpack /etc/systemd/system /etc/cron.d

        go test ./config ./internal/manage/tunnelspec ./internal/manage/health ./internal/app -race -timeout 10m

        go vet ./cmd ./config ./internal/tunnel/naive ./internal/manage/tunnelspec

        bash -n install.sh'
  official:
    name: Pinned installer and official Naive HTTP2 complete reverse traffic/recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 55b3104b8e5909d169ae4053879daaca72c825dc
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - run: 'python3 - <<''PY''

        from pathlib import Path

        Path(''/tmp/real_naive_linux.py'').write_text(''"""Exercise official helpers and the reverse engine on isolated Linux
        loopback.\n\nRun as an unprivileged user inside a disposable network namespace. This is not\nan Internet path test.
        All files belong to the supplied disposable bundle dir.\n"""\nimport hashlib\nimport json\nimport os\nimport re\nfrom
        pathlib import Path\nimport signal\nimport socket\nimport struct\nimport subprocess\nimport sys\nimport threading\nimport
        time\nimport urllib.parse\n\nimport argparse\nparser = argparse.ArgumentParser(description=__doc__)\nparser.add_argument("--backpack",
        required=True, type=Path)\nparser.add_argument("--naive", required=True, type=Path)\nparser.add_argument("--sing-box",
        required=True, type=Path)\nparser.add_argument("--output", required=True, type=Path)\nARGS = parser.parse_args()\nROOT
        = ARGS.output.resolve()\nROOT.mkdir(mode=0o700, parents=True, exist_ok=True)\nif any(ROOT.iterdir()):\n    raise SystemExit("fixture
        output must be empty")\nBIN = ROOT / "bin"\nBIN.mkdir(mode=0o700)\nfor name, source in (("backpack", ARGS.backpack),
        ("naive", ARGS.naive), ("sing-box", ARGS.sing_box)):\n    (BIN / name).symlink_to(source.resolve())\nlisteners = [socket.create_server(("127.0.0.1",
        0)) for _ in range(4)]\nPUBLIC, REVERSE, ENTRY, BACKEND = [listener.getsockname()[1] for listener in listeners]\nfor
        listener in listeners: listener.close()\nBIN = ROOT / "bin"\nDATA = hashlib.sha256(b"independent-download-fixture").digest()
        * 32768\nPROCS = {}\nLOGS = []\nPRIVATE_DIRS = set()\nHELPER_PIDS = set()\nHELPER_GROUPS = set()\nRESULT = {"scope":
        "isolated loopback, official helpers, no Internet retest", "fresh": [], "recovery": [], "negative": {}}\n\n\ndef readn(conn,
        size):\n    out = bytearray()\n    while len(out) < size:\n        b = conn.recv(size - len(out))\n        if not
        b:\n            raise EOFError("short application response")\n        out.extend(b)\n    return bytes(out)\n\n\ndef
        backend(conn):\n    try:\n        with conn:\n            conn.settimeout(15)\n            mode = readn(conn, 1)\n            size
        = struct.unpack("!I", readn(conn, 4))[0]\n            if size > 2 * 1024 * 1024:\n                raise ValueError("oversized
        fixture")\n            if mode == b"D":\n                conn.sendall(DATA[:size])\n            else:\n                payload
        = readn(conn, size)\n                conn.sendall(payload if mode == b"E" else hashlib.sha256(payload).hexdigest().encode())\n    except
        (OSError, EOFError):\n        pass\n\n\ndef serve(listener):\n    while True:\n        try:\n            conn, _ =
        listener.accept()\n        except OSError:\n            return\n        threading.Thread(target=backend, args=(conn,),
        daemon=True).start()\n\n\ndef app(mode=b"E", payload=None, timeout=3):\n    if payload is None:\n        payload =
        os.urandom(32)\n    with socket.create_connection(("127.0.0.1", ENTRY), timeout=timeout) as conn:\n        conn.settimeout(timeout)\n        conn.sendall(mode
        + struct.pack("!I", len(payload)))\n        if mode != b"D":\n            conn.sendall(payload)\n        expected
        = DATA[:len(payload)] if mode == b"D" else (payload if mode == b"E" else hashlib.sha256(payload).hexdigest().encode())\n        if
        readn(conn, len(expected)) != expected:\n            raise ValueError("application checksum/payload mismatch")\n    return
        True\n\n\ndef start(role):\n    log = (ROOT / (role + ".log")).open("ab")\n    LOGS.append(log)\n    PROCS[role] =
        subprocess.Popen([str(BIN / "backpack"), "-c", str(ROOT / (role + ".toml"))], stdout=log, stderr=log, start_new_session=True)\n\n\ndef
        stop(role):\n    p = PROCS.pop(role)\n    p.terminate()\n    try:\n        p.wait(timeout=8)\n    except subprocess.TimeoutExpired:\n        os.killpg(p.pid,
        signal.SIGKILL)\n        p.wait(timeout=5)\n        raise RuntimeError("engine did not stop gracefully")\n\n\ndef
        helper(role):\n    p = PROCS[role]\n    if p.poll() is not None:\n        raise RuntimeError(role + " engine exited
        unexpectedly")\n    # Go may fork from any OS thread; the leader\''s children file alone misses\n    # children of
        its other threads even though they belong to this engine.\n    tasks = Path("/proc") / str(p.pid) / "task"\n    children
        = set()\n    for task in tasks.iterdir():\n        try:\n            children.update((task / "children").read_text().split())\n        except
        OSError:\n            pass\n    for child in children:\n        try:\n            args = (Path("/proc") / child /
        "cmdline").read_bytes().decode().split("\\0")\n            if args[0] == str(BIN / ("sing-box" if role == "iran" else
        "naive")) and (role != "iran" or args[1] == "run"):\n                cfg = Path(args[-2] if not args[-1] else args[-1])\n                PRIVATE_DIRS.add(cfg.parent)\n                HELPER_PIDS.add(int(child))\n                HELPER_GROUPS.add(os.getpgid(int(child)))\n                if
        cfg.stat().st_mode & 0o777 != 0o600 or cfg.parent.stat().st_mode & 0o777 != 0o700:\n                    raise RuntimeError("helper
        credential file permissions are not private")\n                return int(child), cfg\n        except (OSError, UnicodeError):\n            pass\n    return
        0, None\n\n\ndef ready(role, before=0, timeout=30):\n    end = time.monotonic() + timeout\n    while time.monotonic()
        < end:\n        pid, _ = helper(role)\n        if pid and pid != before:\n            return pid\n        time.sleep(0.05)\n    raise
        TimeoutError(role + " helper generation did not change")\n\n\ndef recovered(timeout=30):\n    end = time.monotonic()
        + timeout\n    while time.monotonic() < end:\n        try:\n            app(timeout=min(2, max(0.1, end - time.monotonic())))\n            return\n        except
        (OSError, EOFError):\n            time.sleep(0.1)\n    raise TimeoutError("application did not recover within 30 seconds")\n\n\ndef
        certificate():\n    quiet = dict(stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, cwd=ROOT, check=True, timeout=20)\n    subprocess.run(["openssl",
        "req", "-x509", "-newkey", "rsa:2048", "-nodes", "-keyout", "ca.key", "-out", "ca.pem", "-days", "2", "-subj", "/CN=BackPack-local-pilot-CA",
        "-addext", "basicConstraints=critical,CA:TRUE"], **quiet)\n    subprocess.run(["openssl", "req", "-newkey", "rsa:2048",
        "-nodes", "-keyout", "server.key", "-out", "server.csr", "-subj", "/CN=127.0.0.1"], **quiet)\n    (ROOT / "cert.ext").write_text("subjectAltName=IP:127.0.0.1\\nbasicConstraints=CA:FALSE\\nextendedKeyUsage=serverAuth\\n")\n    subprocess.run(["openssl",
        "x509", "-req", "-in", "server.csr", "-CA", "ca.pem", "-CAkey", "ca.key", "-CAcreateserial", "-days", "2", "-out",
        "server.pem", "-extfile", "cert.ext"], **quiet)\n\n\ndef socks(conn, port):\n    conn.settimeout(5)\n    conn.sendall(b"\\x05\\x01\\x00")\n    if
        readn(conn, 2) != b"\\x05\\x00":\n        raise ValueError("helper SOCKS negotiation failed")\n    conn.sendall(b"\\x05\\x01\\x00\\x01\\x7f\\x00\\x00\\x01"
        + struct.pack("!H", port))\n    reply = readn(conn, 4)\n    if reply[0] != 5:\n        raise ValueError("invalid SOCKS
        response")\n    return reply[1]\n\n\ndef main():\n    import argparse\n    RESULT["binary_sha256"] = {name: hashlib.sha256((BIN
        / name).read_bytes()).hexdigest() for name in ("backpack", "naive", "sing-box")}\n    certificate()\n    username,
        password, token = "protocol-audit", os.urandom(24).hex(), os.urandom(24).hex()\n    quote = lambda value: json.dumps(str(value))\n    configs
        = {\n      "iran": "[server]\\ntransport = \\"tcp\\"\\nbind_addr = " + quote("127.0.0.1:" + str(REVERSE)) + "\\ntoken
        = " + quote(token) + "\\nports = [" + quote("127.0.0.1:" + str(ENTRY) + "=127.0.0.1:" + str(BACKEND)) + "]\\nskip_optz
        = true\\n[server.naive]\\nbinary = " + quote(BIN / "sing-box") + "\\nlisten = " + quote("127.0.0.1:" + str(PUBLIC))
        + "\\nusername = " + quote(username) + "\\npassword = " + quote(password) + "\\ncertificate = " + quote(ROOT / "server.pem")
        + "\\nkey = " + quote(ROOT / "server.key") + "\\n",\n      "outside": "[client]\\ntransport = \\"tcp\\"\\nremote_addr
        = " + quote("127.0.0.1:" + str(REVERSE)) + "\\ntoken = " + quote(token) + "\\nconnection_pool = 4\\nskip_optz = true\\n[client.naive]\\nbinary
        = " + quote(BIN / "naive") + "\\nserver = " + quote("127.0.0.1:" + str(PUBLIC)) + "\\nusername = " + quote(username)
        + "\\npassword = " + quote(password) + "\\nca_file = " + quote(ROOT / "ca.pem") + "\\n"\n    }\n    for role, text
        in configs.items():\n        (ROOT / (role + ".toml")).write_text(text, encoding="utf-8")\n        (ROOT / (role +
        ".toml")).chmod(0o600)\n        subprocess.run([str(BIN / "backpack"), "check", "-c", str(ROOT / (role + ".toml"))],
        check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=20)\n    listener = socket.create_server(("127.0.0.1",
        BACKEND))\n    threading.Thread(target=serve, args=(listener,), daemon=True).start()\n    start("iran")\n    ready("iran")\n    start("outside")\n    ready("outside")\n    recovered()\n    import
        ssl\n    tls = ssl.create_default_context(cafile=str(ROOT / "ca.pem"))\n    tls.set_alpn_protocols(["h2"])\n    with
        socket.create_connection(("127.0.0.1", PUBLIC), timeout=3) as raw:\n        with tls.wrap_socket(raw, server_hostname="127.0.0.1")
        as secure:\n            RESULT["negotiated_alpn"] = secure.selected_alpn_protocol()\n            if RESULT["negotiated_alpn"]
        != "h2": raise RuntimeError("TLS did not negotiate HTTP/2")\n    response = subprocess.run(["curl", "--silent", "--show-error",
        "--http2", "--cacert", str(ROOT / "ca.pem"), "--max-time", "5", "--output", str(ROOT / "probe-response"), "--write-out",
        "%{http_version} %{http_code}", "https://127.0.0.1:" + str(PUBLIC) + "/"], capture_output=True, text=True, timeout=7)\n    RESULT["unauthenticated_probe"]
        = {"curl_exit": response.returncode, "http_version_status": response.stdout.strip(), "response_bytes": (ROOT / "probe-response").stat().st_size
        if (ROOT / "probe-response").exists() else 0}\n    if response.returncode or not response.stdout.startswith("2 "):
        raise RuntimeError("unauthenticated HTTP/2 probe did not complete")\n    for _ in range(3):\n        begin = time.monotonic()\n        app()\n        RESULT["fresh"].append({"ok":
        True, "elapsed_ms": round((time.monotonic() - begin) * 1000, 2)})\n    upload = os.urandom(1024 * 1024)\n    app(b"U",
        upload, timeout=15)\n    app(b"D", DATA, timeout=15)\n    RESULT["files"] = {"bytes_each_direction": len(DATA), "upload_sha256":
        hashlib.sha256(upload).hexdigest(), "download_sha256": hashlib.sha256(DATA).hexdigest(), "correct": True}\n    import
        concurrent.futures\n    def concurrent_files(index):\n        payload = hashlib.sha256(str(index).encode()).digest()
        * 8192\n        app(b"U", payload, timeout=15)\n        app(b"D", payload, timeout=15)\n        return True\n    begin
        = time.monotonic()\n    with concurrent.futures.ThreadPoolExecutor(max_workers=8) as workers:\n        if not all(workers.map(concurrent_files,
        range(8))): raise RuntimeError("concurrent checksum transfer failed")\n    RESULT["concurrent_files"] = {"flows":
        8, "bytes_each_direction_per_flow": 262144, "seconds": round(time.monotonic() - begin, 3), "ok": True}\n    for role
        in ("outside", "iran"):\n        for kind in ("helper-crash", "config-generation", "engine-restart"):\n            before,
        _ = helper(role)\n            parent_before = PROCS[role].pid\n            begin = time.monotonic()\n            if
        kind == "helper-crash":\n                os.kill(before, signal.SIGKILL)\n            elif kind == "config-generation":\n                cfg
        = ROOT / (role + ".toml")\n                text = cfg.read_text().replace("skip_optz = true", "skip_optz = true\\nkeepalive_period
        = 76")\n                cfg.write_text(text)\n            else:\n                stop(role)\n                start(role)\n            after
        = ready(role, before)\n            recovered(timeout=max(0.1, 30 - (time.monotonic() - begin)))\n            recovery_seconds
        = time.monotonic() - begin\n            for _ in range(3): app()\n            app(b"U", upload, timeout=15)\n            app(b"D",
        DATA, timeout=15)\n            RESULT["recovery"].append({"role": role, "kind": kind, "helper_pid_changed": after
        != before, "engine_pid_changed": PROCS[role].pid != parent_before, "seconds": round(recovery_seconds, 3), "verified_at_seconds":
        round(time.monotonic() - begin, 3), "ok": True})\n    _, config_file = helper("outside")\n    proxy = json.loads(config_file.read_text())\n    socks_addr
        = urllib.parse.urlsplit(proxy["listen"]).netloc\n    host, port = socks_addr.rsplit(":", 1)\n    fixture = os.urandom(32)\n    frame
        = b"E" + struct.pack("!I", len(fixture)) + fixture\n    with socket.create_connection(("127.0.0.1", BACKEND), timeout=3)
        as direct:\n        direct.sendall(frame)\n        if readn(direct, len(fixture)) != fixture:\n            raise RuntimeError("negative-target
        backend was not available")\n    # The official client can acknowledge SOCKS before its upstream CONNECT.\n    # Require
        denied application payload, not a nonzero preliminary reply.\n    with socket.create_connection((host, int(port)),
        timeout=3) as conn:\n        if socks(conn, BACKEND) != 0:\n            rejected = True\n        else:\n            conn.sendall(frame)\n            conn.settimeout(2)\n            try:\n                rejected
        = readn(conn, len(fixture)) != fixture\n            except (OSError, EOFError):\n                rejected = True\n        RESULT["negative"]["other_connect_target_rejected"]
        = rejected\n    cfg = ROOT / "outside.toml"\n    original = cfg.read_text()\n    before, _ = helper("outside")\n    cfg.write_text(re.sub(r\''^password
        = .+$\'', \''password = "wrong-proxy-password"\'', original, flags=re.M))\n    ready("outside", before)\n    time.sleep(1)\n    try:\n        app(timeout=2)\n        RESULT["negative"]["wrong_proxy_password_rejected"]
        = False\n    except (OSError, EOFError):\n        RESULT["negative"]["wrong_proxy_password_rejected"] = True\n    before,
        _ = helper("outside")\n    cfg.write_text(original)\n    ready("outside", before)\n    recovered()\n    before, _
        = helper("outside")\n    cfg.write_text(original.replace(\''token = "\'', \''token = "incorrect-\''))\n    ready("outside",
        before)\n    time.sleep(1)\n    try:\n        app(timeout=2)\n        RESULT["negative"]["wrong_reverse_token_rejected"]
        = False\n    except (OSError, EOFError):\n        RESULT["negative"]["wrong_reverse_token_rejected"] = True\n    before,
        _ = helper("outside")\n    cfg.write_text(original)\n    ready("outside", before)\n    recovered()\n    subprocess.run(["openssl",
        "req", "-x509", "-newkey", "rsa:2048", "-nodes", "-keyout", str(ROOT / "wrong-ca.key"), "-out", str(ROOT / "wrong-ca.pem"),
        "-days", "2", "-subj", "/CN=unrelated-audit-CA"], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
        timeout=20)\n    before, _ = helper("outside")\n    cfg.write_text(original.replace(str(ROOT / "ca.pem"), str(ROOT
        / "wrong-ca.pem")))\n    ready("outside", before)\n    time.sleep(1)\n    try:\n        app(timeout=2)\n        RESULT["negative"]["wrong_ca_rejected"]
        = False\n    except (OSError, EOFError):\n        RESULT["negative"]["wrong_ca_rejected"] = True\n    before, _ =
        helper("outside")\n    cfg.write_text(original)\n    ready("outside", before)\n    recovered()\n    if not all(RESULT["negative"].values()):\n        raise
        RuntimeError("negative access restriction failed")\n    listener.close()\n\n\ntry:\n    main()\n    RESULT["ok"] =
        True\nexcept Exception as exc:\n    RESULT["ok"] = False\n    RESULT["error"] = type(exc).__name__ + ": " + str(exc)\nfinally:\n    for
        role in list(PROCS):\n        try:\n            stop(role)\n        except Exception as exc:\n            RESULT["cleanup_error"]
        = str(exc)\n            RESULT["ok"] = False\n    for log in LOGS:\n        log.close()\n    RESULT["helper_private_dirs_removed"]
        = all(not p.exists() for p in PRIVATE_DIRS)\n    if not RESULT["helper_private_dirs_removed"]:\n        RESULT["ok"]
        = False\n    deadline = time.monotonic() + 3\n    while time.monotonic() < deadline and any((Path("/proc") / str(pid)).exists()
        for pid in HELPER_PIDS): time.sleep(0.05)\n    RESULT["helper_pids_removed"] = all(not (Path("/proc") / str(pid)).exists()
        for pid in HELPER_PIDS)\n    living = []\n    for proc in Path("/proc").iterdir():\n        if proc.name.isdigit():\n            try:\n                stat
        = (proc / "stat").read_text().rsplit(")", 1)[1].split()\n                if int(stat[2]) in HELPER_GROUPS and stat[0]
        != "Z": living.append(int(proc.name))\n            except (OSError, ValueError, IndexError): pass\n    RESULT["living_helper_group_members"]
        = living\n    if not RESULT["helper_pids_removed"] or living:\n        RESULT["ok"] = False\n        for group in
        HELPER_GROUPS:\n            try: os.killpg(group, signal.SIGKILL)\n            except ProcessLookupError: pass\n    RESULT["ports_released"]
        = True\n    for port in (PUBLIC, REVERSE, ENTRY):\n        try:\n            test = socket.create_server(("127.0.0.1",
        port)); test.close()\n        except OSError: RESULT["ports_released"] = False; RESULT["ok"] = False\n    (ROOT /
        "local-check.json").write_text(json.dumps(RESULT, indent=2) + "\\n")\n    print(json.dumps(RESULT), flush=True)\nsys.exit(0
        if RESULT.get("ok") else 1)\n'',encoding=''utf-8'')

        PY'
    - run: 'python3 - <<''PY''

        from pathlib import Path

        s=Path(''install.sh'').read_text()

        s=s.split(''# Optional protocol helpers:'',1)[1].split(''# End optional protocol helpers.'',1)[0]

        s=s[s.index(''helpers_validate()''):]

        s=s.replace(''root="/usr/local/lib/backpack/helpers/$helper_tool"'',''root="$BP_HELPER_TEST_ROOT/$helper_tool"'')

        Path(''/tmp/helper-functions.sh'').write_text(s)

        PY

        source /tmp/helper-functions.sh

        info(){ printf ''%s\n'' "$*"; }

        err(){ printf ''%s\n'' "$*" >&2; }

        fetch(){ curl -fSL --retry 2 --connect-timeout 15 --max-time 180 "$1" -o "$2"; }

        export BP_HELPER_TEST_ROOT=$(mktemp -d /tmp/backpack-helper-install.XXXXXX)

        ARCH=amd64; BP_HELPERS=naive,xray

        helpers_validate

        install_helpers

        naive="$BP_HELPER_TEST_ROOT/naive/v154.0.8037.49-4-amd64/naive"

        sing="$BP_HELPER_TEST_ROOT/sing-box/v1.14.2-amd64/sing-box"

        xray="$BP_HELPER_TEST_ROOT/xray/v26.3.27-amd64/xray"

        "$naive" --version

        "$sing" version

        "$xray" version

        before=$(sha256sum "$naive")

        fetch(){ return 1; }

        install_helper naive

        test "$(sha256sum "$naive")" = "$before"

        BP_HELPERS=wrong; if helpers_validate; then exit 1; fi

        ARCH=s390x; BP_HELPERS=naive; if helpers_validate; then exit 1; fi

        ARCH=amd64; BP_HELPERS=; install_helpers

        # Corrupt/download failures are checked in a separate fresh owned directory.

        original="$BP_HELPER_TEST_ROOT"; export BP_HELPER_TEST_ROOT=$(mktemp -d /tmp/backpack-helper-failed.XXXXXX)

        fetch(){ printf corrupt > "$2"; }

        if install_helper naive; then exit 1; fi

        test ! -e "$BP_HELPER_TEST_ROOT/naive/v154.0.8037.49-4-amd64"

        test -z "$(find "$BP_HELPER_TEST_ROOT" -name ''.stage.*'' -print)"

        fetch(){ return 1; }

        if install_helper xray; then exit 1; fi

        test ! -e "$BP_HELPER_TEST_ROOT/xray/v26.3.27-amd64"

        test -z "$(find "$BP_HELPER_TEST_ROOT" -name ''.stage.*'' -print)"

        export BP_HELPER_TEST_ROOT="$original"

        go build -o /tmp/backpack-protocol .

        python3 /tmp/real_naive_linux.py --backpack /tmp/backpack-protocol --naive "$naive" --sing-box "$sing" --output /tmp/backpack-real-naive

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: real-naive-protocol-results
        path: /tmp/backpack-real-naive/result*.json
        if-no-files-found: ignore
