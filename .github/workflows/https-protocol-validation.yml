name: Managed HTTPS helpers Naive completion and protocol validation
permissions:
  contents: read
'on':
  push:
    branches:
    - codex/validate-https-protocols
jobs:
  baseline:
    name: Reproduce inherited-output restart and check descendant failures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 4f49f103a0bde83bc5ab70e9f62c81301d84d696
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - &id001
      run: 'python3 - <<''PY''

        from pathlib import Path

        Path(''internal/tunnel/naive/runtime_audit_lifecycle_test.go'').write_text(''//go:build linux\n\npackage naive\n\nimport
        (\n\t"context"\n\t"io"\n\t"net"\n\t"os"\n\t"path/filepath"\n\t"strconv"\n\t"strings"\n\t"syscall"\n\t"testing"\n\t"time"\n\n\t"github.com/sirupsen/logrus"\n)\n\nfunc
        auditLivePID(pid int) bool {\n\tb, err := os.ReadFile("/proc/" + strconv.Itoa(pid) + "/stat")\n\tif err != nil {\n\t\treturn
        false\n\t}\n\tfields := strings.Fields(string(b)[strings.LastIndexByte(string(b), \'')\'')+1:])\n\treturn len(fields)
        > 0 && fields[0] != "Z"\n}\n\n// Sending a process-group signal does not wait for every member to be\n// scheduled
        and exit. Bound that wait; a surviving baseline sleep300 child\n// still fails, while zombies do not count as running
        helpers.\nfunc auditWaitPIDStopped(t *testing.T, pid int, message string) {\n\tt.Helper()\n\tuntil := time.Now().Add(500
        * time.Millisecond)\n\tfor auditLivePID(pid) && time.Now().Before(until) {\n\t\ttime.Sleep(5 * time.Millisecond)\n\t}\n\tif
        auditLivePID(pid) {\n\t\tt.Fatal(message)\n\t}\n}\n\nfunc auditReadPID(t *testing.T, file string) int {\n\tt.Helper()\n\tuntil
        := time.Now().Add(time.Second)\n\tfor time.Now().Before(until) {\n\t\tb, _ := os.ReadFile(file)\n\t\tpid, err := strconv.Atoi(strings.TrimSpace(string(b)))\n\t\tif
        err == nil && pid > 0 {\n\t\t\treturn pid\n\t\t}\n\t\ttime.Sleep(time.Millisecond)\n\t}\n\tt.Fatalf("no PID at %s",
        file)\n\treturn 0\n}\n\nfunc TestAuditNaiveRuntimeDescendantsAreKilled(t *testing.T) {\n\tdir := t.TempDir()\n\tpidfile
        := filepath.Join(dir, "runtime-child")\n\tbinary := filepath.Join(dir, "helper")\n\tscript := "#!/bin/sh\\nsleep 300
        &\\necho $! > \''" + pidfile + "\''\\nexec sleep 300\\n"\n\tif err := os.WriteFile(binary, []byte(script), 0700);
        err != nil {\n\t\tt.Fatal(err)\n\t}\n\tlistener, err := net.Listen("tcp", "127.0.0.1:0")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tdefer
        listener.Close()\n\tlog := logrus.New()\n\tlog.SetOutput(io.Discard)\n\tctx, cancel := context.WithCancel(context.Background())\n\tdefer
        cancel()\n\th, err := startManaged(ctx, binary, "client-fixture", []byte("{}"), listener.Addr().String(), os.Environ(),
        log, nil)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tdefer h.Close()\n\tchild := auditReadPID(t, pidfile)\n\tdefer
        syscall.Kill(child, syscall.SIGKILL)\n\tcancel()\n\tdone := make(chan struct{})\n\tgo func() { h.Close(); close(done)
        }()\n\tselect {\n\tcase <-done:\n\tcase <-time.After(3 * time.Second):\n\t\tt.Fatal("helper cancellation was unbounded")\n\t}\n\tauditWaitPIDStopped(t,
        child, "runtime helper descendant survived cancellation")\n\tif _, err := os.Stat(h.dir); !os.IsNotExist(err) {\n\t\tt.Fatal("private
        helper configuration survived cancellation")\n\t}\n}\n\nfunc TestAuditNaiveCheckDescendantsAreKilled(t *testing.T)
        {\n\tfor _, outcome := range []string{"success", "failure"} {\n\t\tt.Run(outcome, func(t *testing.T) {\n\t\t\tdir
        := t.TempDir()\n\t\t\tpidfile := filepath.Join(dir, "check-child")\n\t\t\tbinary := filepath.Join(dir, "helper")\n\t\t\texit
        := "0"\n\t\t\tif outcome == "failure" {\n\t\t\t\texit = "17"\n\t\t\t}\n\t\t\tscript := "#!/bin/sh\\nif [ \\"$1\\"
        = check ]; then\\n sleep 300 >/dev/null 2>&1 &\\n echo $! > \''" + pidfile + "\''\\n exit " + exit + "\\nfi\\nexec
        sleep 300\\n"\n\t\t\tif err := os.WriteFile(binary, []byte(script), 0700); err != nil {\n\t\t\t\tt.Fatal(err)\n\t\t\t}\n\t\t\tlistener,
        err := net.Listen("tcp", "127.0.0.1:0")\n\t\t\tif err != nil {\n\t\t\t\tt.Fatal(err)\n\t\t\t}\n\t\t\tdefer listener.Close()\n\t\t\tlog
        := logrus.New()\n\t\t\tlog.SetOutput(io.Discard)\n\t\t\tctx, cancel := context.WithCancel(context.Background())\n\t\t\tdefer
        cancel()\n\t\t\th, err := startManaged(ctx, binary, "server", []byte("{}"), listener.Addr().String(), os.Environ(),
        log, nil)\n\t\t\tchild := auditReadPID(t, pidfile)\n\t\t\tdefer syscall.Kill(child, syscall.SIGKILL)\n\t\t\tif h !=
        nil {\n\t\t\t\th.Close()\n\t\t\t}\n\t\t\tif outcome == "success" && err != nil {\n\t\t\t\tt.Fatalf("successful check
        failed: %v", err)\n\t\t\t}\n\t\t\tif outcome == "failure" && err == nil {\n\t\t\t\tt.Fatal("failed check was accepted")\n\t\t\t}\n\t\t\tauditWaitPIDStopped(t,
        child, "check-command descendant survived helper cleanup")\n\t\t})\n\t}\n}\n\nfunc TestAuditNaiveLeaderExitRestartsWithInheritedOutput(t
        *testing.T) {\n\tdir := t.TempDir()\n\tpidfile := filepath.Join(dir, "inherited-output-child")\n\tbinary := filepath.Join(dir,
        "helper")\n\tscript := "#!/bin/sh\\nsleep 300 &\\necho $! > \''" + pidfile + "\''\\nsleep 0.2\\nexit 0\\n"\n\tif err
        := os.WriteFile(binary, []byte(script), 0700); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tlistener, err := net.Listen("tcp",
        "127.0.0.1:0")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tdefer listener.Close()\n\tlog := logrus.New()\n\tlog.SetOutput(io.Discard)\n\tctx,
        cancel := context.WithCancel(context.Background())\n\tdefer cancel()\n\th, err := startManaged(ctx, binary, "client-fixture",
        []byte("{}"), listener.Addr().String(), os.Environ(), log, nil)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tdefer
        h.Close()\n\tfirst := auditReadPID(t, pidfile)\n\tdefer syscall.Kill(first, syscall.SIGKILL)\n\tuntil := time.Now().Add(1500
        * time.Millisecond)\n\tchanged := false\n\tfor time.Now().Before(until) {\n\t\tb, _ := os.ReadFile(pidfile)\n\t\tpid,
        _ := strconv.Atoi(strings.TrimSpace(string(b)))\n\t\tif pid != 0 && pid != first {\n\t\t\tchanged = true\n\t\t\tbreak\n\t\t}\n\t\ttime.Sleep(10
        * time.Millisecond)\n\t}\n\tcancel()\n\th.Close()\n\tif !changed {\n\t\tt.Fatal("helper leader exited, but inherited
        output blocked Wait and prevented restart")\n\t}\n}\n'',encoding=''utf-8'')

        PY'
    - run: 'if go test ./internal/tunnel/naive -run "TestAuditNaiveLeaderExitRestartsWithInheritedOutput|TestAuditNaiveCheckDescendantsAreKilled"
        -count=1 -v -timeout 2m > /tmp/lifecycle-baseline.log 2>&1; then cat /tmp/lifecycle-baseline.log; exit 1; fi

        cat /tmp/lifecycle-baseline.log

        grep -E "check-command descendant survived|helper did not restart|leader exit" /tmp/lifecycle-baseline.log'
  lifecycle:
    name: Exact Naive lifecycle and validated TLS renewal races
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        ref: b2a0612af3c86d3712460c6117ba076fdd7186f1
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - &id003
      run: 'python3 - <<''PY''

        from pathlib import Path

        Path(''internal/tunnel/naive/immutable_tls_external_test.go'').write_text(''package naive\n\nimport (\n\t"crypto/ed25519"\n\t"crypto/rand"\n\t"crypto/tls"\n\t"crypto/x509"\n\t"encoding/json"\n\t"encoding/pem"\n\t"github.com/backpack/backpack/config"\n\t"math/big"\n\t"os"\n\t"path/filepath"\n\t"strings"\n\t"testing"\n\t"time"\n)\n\n//
        External-only regression: this uses only the original Naive API so the\n// identical fixture compiles against both
        the old PR65 and its corrected head.\nfunc TestNaiveServerJSONFreezesValidatedCertificate(t *testing.T) {\n\tdir :=
        t.TempDir()\n\tcertPath, keyPath := filepath.Join(dir, "cert.pem"), filepath.Join(dir, "key.pem")\n\tpair := func(serial
        int64, expired bool) ([]byte, []byte) {\n\t\tt.Helper()\n\t\tpublic, private, err := ed25519.GenerateKey(rand.Reader)\n\t\tif
        err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\tbefore, after := time.Now().Add(-time.Hour), time.Now().Add(time.Hour)\n\t\tif
        expired {\n\t\t\tbefore, after = time.Now().Add(-2*time.Hour), time.Now().Add(-time.Hour)\n\t\t}\n\t\ttemplate :=
        &x509.Certificate{SerialNumber: big.NewInt(serial), DNSNames: []string{"localhost"}, NotBefore: before, NotAfter:
        after, KeyUsage: x509.KeyUsageDigitalSignature, ExtKeyUsage: []x509.ExtKeyUsage{x509.ExtKeyUsageServerAuth}}\n\t\tder,
        err := x509.CreateCertificate(rand.Reader, template, template, public, private)\n\t\tif err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\tpk,
        err := x509.MarshalPKCS8PrivateKey(private)\n\t\tif err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\treturn pem.EncodeToMemory(&pem.Block{Type:
        "CERTIFICATE", Bytes: der}), pem.EncodeToMemory(&pem.Block{Type: "PRIVATE KEY", Bytes: pk})\n\t}\n\twrite := func(path
        string, b []byte) {\n\t\tt.Helper()\n\t\tif err := os.WriteFile(path, b, 0600); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\toldCert,
        oldKey := pair(1, false)\n\texpiredCert, expiredKey := pair(2, true)\n\twrite(certPath, oldCert)\n\twrite(keyPath,
        oldKey)\n\tbinary, err := os.Executable()\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tcfg := config.ServerConfig{Transport:
        config.TCP, BindAddr: "127.0.0.1:26001", Naive: config.NaiveServerConfig{Binary: binary, Listen: "127.0.0.1:26003",
        Username: "audit", Password: "fixture-secret", Certificate: certPath, Key: keyPath}}\n\tif err := ValidateServer(&cfg);
        err != nil {\n\t\tt.Fatal(err)\n\t}\n\tfrozen, err := serverJSON(&cfg)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\ttype
        material struct {\n\t\tCertificate     []string `json:"certificate"`\n\t\tKey             []string `json:"key"`\n\t\tCertificatePath
        string   `json:"certificate_path"`\n\t\tKeyPath         string   `json:"key_path"`\n\t}\n\tdecode := func(body []byte)
        material {\n\t\tt.Helper()\n\t\tvar doc struct {\n\t\t\tInbounds []struct {\n\t\t\t\tTLS material `json:"tls"`\n\t\t\t}
        `json:"inbounds"`\n\t\t}\n\t\tif err := json.Unmarshal(body, &doc); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\tif
        len(doc.Inbounds) != 1 {\n\t\t\tt.Fatalf("unexpected inbounds: %s", body)\n\t\t}\n\t\treturn doc.Inbounds[0].TLS\n\t}\n\ttlsMaterial
        := decode(frozen)\n\tif tlsMaterial.CertificatePath != "" || tlsMaterial.KeyPath != "" {\n\t\tt.Error("generated JSON
        gives sing-box live certificate/key paths; independent fswatch reload bypasses validation")\n\t}\n\tif strings.Join(tlsMaterial.Certificate,
        "\\n") != string(oldCert) || strings.Join(tlsMaterial.Key, "\\n") != string(oldKey) {\n\t\tt.Error("generated JSON
        does not contain the exact validated certificate/private key")\n\t}\n\t// IPv4-mapped IPv6 loopback must canonicalize
        before applying the IPv4\n\t// prefix length; ::ffff:127.0.0.1/32 would allow a vast IPv6 range.\n\tmapped := cfg\n\tmapped.BindAddr
        = "[::ffff:127.0.0.1]:26001"\n\tmappedJSON, err := serverJSON(&mapped)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tvar
        mappedDoc struct {\n\t\tRoute struct {\n\t\t\tRules []struct {\n\t\t\t\tCIDR []string `json:"ip_cidr"`\n\t\t\t} `json:"rules"`\n\t\t}
        `json:"route"`\n\t}\n\tif err := json.Unmarshal(mappedJSON, &mappedDoc); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif
        len(mappedDoc.Route.Rules) == 0 || len(mappedDoc.Route.Rules[0].CIDR) != 1 || mappedDoc.Route.Rules[0].CIDR[0] !=
        "127.0.0.1/32" {\n\t\tt.Errorf("mapped loopback permits a non-canonical or broad destination range: %+v", mappedDoc.Route.Rules)\n\t}\n\t//
        Replace source files with a well-formed matched pair which the helper\''s\n\t// independent watcher would accept,
        but which Backpack must reject.\n\twrite(certPath, expiredCert)\n\twrite(keyPath, expiredKey)\n\tif _, err := tls.X509KeyPair(expiredCert,
        expiredKey); err != nil {\n\t\tt.Fatalf("expiry fixture is not a valid matched pair: %v", err)\n\t}\n\tif err := ValidateServer(&cfg);
        err == nil {\n\t\tt.Error("expired input unexpectedly validates")\n\t}\n\tif _, err := serverJSON(&cfg); err == nil
        {\n\t\tt.Error("fresh helper JSON accepts the matched expired replacement")\n\t}\n\t// Retained per-generation material
        stays usable without touching those files.\n\tretained := decode(frozen)\n\tif retained.CertificatePath != "" || retained.KeyPath
        != "" {\n\t\tt.Error("retained generation still references the mutated files")\n\t}\n\tif strings.Join(retained.Certificate,
        "\\n") != string(oldCert) || strings.Join(retained.Key, "\\n") != string(oldKey) {\n\t\tt.Error("retained generation
        lost the original certificate/key")\n\t}\n\tif len(retained.Certificate) > 0 && len(retained.Key) > 0 {\n\t\toldPair,
        err := tls.X509KeyPair([]byte(strings.Join(retained.Certificate, "\\n")), []byte(strings.Join(retained.Key, "\\n")))\n\t\tif
        err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\tleaf, err := x509.ParseCertificate(oldPair.Certificate[0])\n\t\tif err
        != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\tif leaf.SerialNumber.Int64() != 1 || !time.Now().Before(leaf.NotAfter) {\n\t\t\tt.Error("retained
        material is the expired replacement")\n\t\t}\n\t}\n\t// A mismatched save is also rejected before producing a child
        configuration.\n\twrite(certPath, oldCert)\n\twrite(keyPath, expiredKey)\n\tif _, err := serverJSON(&cfg); err ==
        nil {\n\t\tt.Error("fresh helper JSON accepts a mismatched certificate/key")\n\t}\n}\n'',encoding=''utf-8'')

        PY'
    - *id001
    - run: 'go test ./internal/tunnel/naive -run "TestAuditNaive|TestNaiveServerJSON" -race -count=3 -v -timeout 3m

        go test ./cmd -run "TestHelperCertificateRenewal|TestAwaitConfigChange|TestAnInvalidEdit" -race -count=2 -timeout
        5m

        sudo mkdir -p /etc/backpack /etc/systemd/system /etc/cron.d

        sudo chmod 777 /etc/backpack /etc/systemd/system /etc/cron.d

        go test ./config ./internal/manage/tunnelspec ./internal/manage/health ./internal/app -race -timeout 10m

        go vet ./cmd ./config ./internal/tunnel/naive ./internal/manage/tunnelspec

        bash -n install.sh'
  official:
    name: Pinned installer and official Naive HTTP2 complete reverse traffic/recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        ref: b2a0612af3c86d3712460c6117ba076fdd7186f1
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - &id002
      run: 'python3 - <<''PY''

        from pathlib import Path

        Path(''/tmp/real_naive_linux.py'').write_text(''"""Exercise official helpers and the reverse engine on isolated Linux
        loopback.\n\nRun as an unprivileged user inside a disposable network namespace. This is not\nan Internet path test.
        All files belong to the supplied disposable bundle dir.\n"""\nimport hashlib\nimport json\nimport os\nimport re\nfrom
        pathlib import Path\nimport signal\nimport socket\nimport struct\nimport subprocess\nimport sys\nimport threading\nimport
        time\nimport urllib.parse\n\nimport argparse\nparser = argparse.ArgumentParser(description=__doc__)\nparser.add_argument("--backpack",
        required=True, type=Path)\nparser.add_argument("--naive", required=True, type=Path)\nparser.add_argument("--sing-box",
        required=True, type=Path)\nparser.add_argument("--output", required=True, type=Path)\nARGS = parser.parse_args()\nROOT
        = ARGS.output.resolve()\nROOT.mkdir(mode=0o700, parents=True, exist_ok=True)\nif any(ROOT.iterdir()):\n    raise SystemExit("fixture
        output must be empty")\nBIN = ROOT / "bin"\nBIN.mkdir(mode=0o700)\nfor name, source in (("backpack", ARGS.backpack),
        ("naive", ARGS.naive), ("sing-box", ARGS.sing_box)):\n    (BIN / name).symlink_to(source.resolve())\nlisteners = [socket.create_server(("127.0.0.1",
        0)) for _ in range(4)]\nPUBLIC, REVERSE, ENTRY, BACKEND = [listener.getsockname()[1] for listener in listeners]\nfor
        listener in listeners: listener.close()\nBIN = ROOT / "bin"\nDATA = hashlib.sha256(b"independent-download-fixture").digest()
        * 32768\nPROCS = {}\nLOGS = []\nPRIVATE_DIRS = set()\nHELPER_PIDS = set()\nHELPER_GROUPS = set()\nRESULT = {"scope":
        "isolated loopback, official helpers, no Internet retest", "fresh": [], "recovery": [], "negative": {}}\n\n\ndef readn(conn,
        size):\n    out = bytearray()\n    while len(out) < size:\n        b = conn.recv(size - len(out))\n        if not
        b:\n            raise EOFError("short application response")\n        out.extend(b)\n    return bytes(out)\n\n\ndef
        backend(conn):\n    try:\n        with conn:\n            conn.settimeout(15)\n            mode = readn(conn, 1)\n            size
        = struct.unpack("!I", readn(conn, 4))[0]\n            if size > 2 * 1024 * 1024:\n                raise ValueError("oversized
        fixture")\n            if mode == b"D":\n                conn.sendall(DATA[:size])\n            else:\n                payload
        = readn(conn, size)\n                conn.sendall(payload if mode == b"E" else hashlib.sha256(payload).hexdigest().encode())\n    except
        (OSError, EOFError):\n        pass\n\n\ndef serve(listener):\n    while True:\n        try:\n            conn, _ =
        listener.accept()\n        except OSError:\n            return\n        threading.Thread(target=backend, args=(conn,),
        daemon=True).start()\n\n\ndef app(mode=b"E", payload=None, timeout=3):\n    if payload is None:\n        payload =
        os.urandom(32)\n    with socket.create_connection(("127.0.0.1", ENTRY), timeout=timeout) as conn:\n        conn.settimeout(timeout)\n        conn.sendall(mode
        + struct.pack("!I", len(payload)))\n        if mode != b"D":\n            conn.sendall(payload)\n        expected
        = DATA[:len(payload)] if mode == b"D" else (payload if mode == b"E" else hashlib.sha256(payload).hexdigest().encode())\n        if
        readn(conn, len(expected)) != expected:\n            raise ValueError("application checksum/payload mismatch")\n    return
        True\n\n\ndef start(role):\n    log = (ROOT / (role + ".log")).open("ab")\n    LOGS.append(log)\n    PROCS[role] =
        subprocess.Popen([str(BIN / "backpack"), "-c", str(ROOT / (role + ".toml"))], stdout=log, stderr=log, start_new_session=True)\n\n\ndef
        stop(role):\n    p = PROCS.pop(role)\n    p.terminate()\n    try:\n        p.wait(timeout=8)\n    except subprocess.TimeoutExpired:\n        os.killpg(p.pid,
        signal.SIGKILL)\n        p.wait(timeout=5)\n        raise RuntimeError("engine did not stop gracefully")\n\n\ndef
        helper(role):\n    p = PROCS[role]\n    if p.poll() is not None:\n        raise RuntimeError(role + " engine exited
        unexpectedly")\n    # Go may fork from any OS thread; the leader\''s children file alone misses\n    # children of
        its other threads even though they belong to this engine.\n    tasks = Path("/proc") / str(p.pid) / "task"\n    children
        = set()\n    for task in tasks.iterdir():\n        try:\n            children.update((task / "children").read_text().split())\n        except
        OSError:\n            pass\n    for child in children:\n        try:\n            args = (Path("/proc") / child /
        "cmdline").read_bytes().decode().split("\\0")\n            if args[0] == str(BIN / ("sing-box" if role == "iran" else
        "naive")) and (role != "iran" or args[1] == "run"):\n                cfg = Path(args[-2] if not args[-1] else args[-1])\n                PRIVATE_DIRS.add(cfg.parent)\n                HELPER_PIDS.add(int(child))\n                HELPER_GROUPS.add(os.getpgid(int(child)))\n                if
        cfg.stat().st_mode & 0o777 != 0o600 or cfg.parent.stat().st_mode & 0o777 != 0o700:\n                    raise RuntimeError("helper
        credential file permissions are not private")\n                return int(child), cfg\n        except (OSError, UnicodeError):\n            pass\n    return
        0, None\n\n\ndef ready(role, before=0, timeout=30):\n    end = time.monotonic() + timeout\n    while time.monotonic()
        < end:\n        pid, _ = helper(role)\n        if pid and pid != before:\n            return pid\n        time.sleep(0.05)\n    raise
        TimeoutError(role + " helper generation did not change")\n\n\ndef recovered(timeout=30):\n    end = time.monotonic()
        + timeout\n    while time.monotonic() < end:\n        try:\n            app(timeout=min(2, max(0.1, end - time.monotonic())))\n            return\n        except
        (OSError, EOFError):\n            time.sleep(0.1)\n    raise TimeoutError("application did not recover within 30 seconds")\n\n\ndef
        certificate():\n    quiet = dict(stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, cwd=ROOT, check=True, timeout=20)\n    subprocess.run(["openssl",
        "req", "-x509", "-newkey", "rsa:2048", "-nodes", "-keyout", "ca.key", "-out", "ca.pem", "-days", "2", "-subj", "/CN=BackPack-local-pilot-CA",
        "-addext", "basicConstraints=critical,CA:TRUE"], **quiet)\n    subprocess.run(["openssl", "req", "-newkey", "rsa:2048",
        "-nodes", "-keyout", "server.key", "-out", "server.csr", "-subj", "/CN=127.0.0.1"], **quiet)\n    (ROOT / "cert.ext").write_text("subjectAltName=IP:127.0.0.1\\nbasicConstraints=CA:FALSE\\nextendedKeyUsage=serverAuth\\n")\n    subprocess.run(["openssl",
        "x509", "-req", "-in", "server.csr", "-CA", "ca.pem", "-CAkey", "ca.key", "-CAcreateserial", "-days", "2", "-out",
        "server.pem", "-extfile", "cert.ext"], **quiet)\n\n\ndef socks(conn, port):\n    conn.settimeout(5)\n    conn.sendall(b"\\x05\\x01\\x00")\n    if
