name: Tunnel runtime cancellation and resource audit
permissions:
  contents: read
'on':
  push:
    branches:
    - codex/validate-https-protocols
jobs:
  l3-baseline:
    name: Reproduce stalled UDP startup multipath and rekey DNS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        ref: cbb931a687c95231c5824a8a9ad8f6bc96e7de0d
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - run: '

        if go test ./internal/tunnel/l3 -run ''^TestL3UDPDNSStopsWithItsGeneration$'' -v -timeout 1m > /tmp/l3-dns-baseline.log
        2>&1; then cat /tmp/l3-dns-baseline.log; exit 1; fi

        cat /tmp/l3-dns-baseline.log

        test "$(grep -c ''L3 UDP DNS ignored generation cancellation or deadline'' /tmp/l3-dns-baseline.log)" = 6

        '
  l3-fixed:
    name: L3 DNS cancellation, cached peers, QUIC recovery and UDP setup lifetime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 002c56ff9c3137c004bfdea4008f0be9063b7b22
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - run: '

        go test ./internal/tunnel/l3 -run ''TestL3UDPDNSStopsWithItsGeneration|TestL3UDPCarrierOutlivesItsSetupContext'' -race
        -count=5 -v -timeout 3m

        go test ./internal/tunnel/l3 ./internal/utils/network ./cmd -race -timeout 8m

        go vet ./internal/tunnel/l3 ./internal/utils/network ./cmd

        '
  cohort-full:
    name: Full integrated runtime suite with UDP startup and rekey recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        ref: f53031711dace0d40a23bf7fb5d7dc69da15b93d
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - run: '

        sudo install -d -m 700 -o "$(id -un)" -g "$(id -gn)" /etc/backpack

        go test ./... -timeout 10m

        go test ./internal/utils/network ./internal/client/transport ./internal/server/transport ./internal/tunnel/... ./cmd
        -race -timeout 10m

        go vet ./...

        GOOS=linux GOARCH=arm64 go build ./...

        '
