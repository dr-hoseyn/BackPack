name: Managed HTTPS helpers Naive completion and protocol validation
permissions:
  contents: read
'on':
  push:
    branches:
    - codex/validate-https-protocols
jobs:
  cohort-race-vet:
    name: Final integrated races and vet after process-state fixture correction
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        ref: bedcd4e61c2b62d0e7cdf921accc7b3f18998401
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - run: 'python3 - <<''PY''

        from pathlib import Path

        Path(''/tmp/source-selection.sh'').write_text(''#!/usr/bin/env bash\n# Isolated installer branch contract; never runs
        installer binaries/downloads.\nset -euo pipefail\nsource_script=${1:?usage: bash fixture.sh /path/to/install.sh}\nworkspace=$(mktemp
        -d)\ntrap \''rm -rf -- "$workspace"\'' EXIT\ntr -d \''\\r\'' < "$source_script" > "$workspace/install.sh"\nawk \''/^case
        "\\$\\{BP_BUILD_FROM_SOURCE:-0\\}"/ {emit=1} emit && /^# One thing may follow/ {exit} emit {print}\'' "$workspace/install.sh"
        > "$workspace/validation.sh"\nawk \''/^# Select the engine build independently/ {emit=1;next} emit && /^# End engine
        build selection/ {exit} emit {print}\'' "$workspace/install.sh" > "$workspace/selection.sh"\n[[ -s "$workspace/validation.sh"
        && -s "$workspace/selection.sh" ]] || { echo \''Installer block markers missing\'' >&2; exit 2; }\n# Keep the actual
        initial mutation in its original order; override mkdir below.\nmutation_line=$(awk \''/^mkdir -p \\/etc\\/backpack
        / {print;exit}\'' "$workspace/install.sh")\n[[ -n "$mutation_line" ]] || { echo \''Installer initial mutation marker
        missing\'' >&2; exit 2; }\ncat > "$workspace/mocks.sh" <<\''MOCKS\''\ninfo() { :; }\nwarn() { :; }\nerr() { printf
        \''%s\\n\'' "$*" >&2; }\nmkdir() { printf \''mkdir\\n\'' >> "$EVENTS"; }\ntrusted_dir() { [[ "$1" == "$SCRIPT_DIR"
        ]] || return 99; printf \''trust\\n\'' >> "$EVENTS"; [[ "$TRUSTED" == yes ]]; }\nbuild_from_source() { printf \''build\\n\''
        >> "$EVENTS"; return "$BUILD_RC"; }\ninstall_release() { printf \''release\\n\'' >> "$EVENTS"; return "$RELEASE_RC";
        }\ninstall_binary_from_tar() { printf \''extract\\n\'' >> "$EVENTS"; return "$EXTRACT_RC"; }\nMOCKS\ncat "$workspace/mocks.sh"
        "$workspace/validation.sh" > "$workspace/runner.sh"\nprintf \''%s\\n\'' "$mutation_line" >> "$workspace/runner.sh"\ncat
        "$workspace/selection.sh" >> "$workspace/runner.sh"\nmkdir -p "$workspace/source"\nprintf \''module fixture\\n\''
        > "$workspace/source/go.mod"\nprintf \''package main\\n\'' > "$workspace/source/main.go"\nrun_case() {\n  local name=$1
        flag=$2 checkout=$3 trusted=$4 release=$5 build=$6 extract=$7 expected_rc=$8 expected_events=$9\n  local rc=0 actual\n  :
        > "$workspace/events"\n  (\n    export SCRIPT_DIR="$workspace/source" INSTALL_DIR="$workspace/never-installed" BIN_PATH="$workspace/never-built"\n    export
        EVENTS="$workspace/events" TRUSTED="$trusted" RELEASE_RC="$release" BUILD_RC="$build" EXTRACT_RC="$extract"\n    if
        [[ "$flag" == UNSET ]]; then unset BP_BUILD_FROM_SOURCE; else export BP_BUILD_FROM_SOURCE="$flag"; fi\n    if [[ "$checkout"
        == missing ]]; then SCRIPT_DIR="$workspace/nonexistent"; fi\n    if [[ "$checkout" == missing-main ]]; then SCRIPT_DIR="$workspace/no-main";
        fi\n    if [[ "$checkout" == missing-go ]]; then SCRIPT_DIR="$workspace/no-go"; fi\n    export SCRIPT_DIR\n    bash
        -eu "$workspace/runner.sh"\n  ) > "$workspace/output" 2>&1 || rc=$?\n  actual=$(paste -sd, "$workspace/events")\n  if
        [[ "$rc" != "$expected_rc" || "$actual" != "$expected_events" ]]; then\n    printf \''FAIL %s: rc=%s events=%s (wanted
        %s/%s)\\n\'' "$name" "$rc" "$actual" "$expected_rc" "$expected_events" >&2\n    cat "$workspace/output" >&2\n    exit
        1\n  fi\n  printf \''PASS %s: rc=%s events=%s\\n\'' "$name" "$rc" "$actual"\n}\nmkdir -p "$workspace/no-main" "$workspace/no-go"\ncp
        "$workspace/source/go.mod" "$workspace/no-main/go.mod"\ncp "$workspace/source/main.go" "$workspace/no-go/main.go"\nrun_case
        explicit-source 1 present yes 0 0 0 0 mkdir,trust,build\nrun_case unset-prefers-release UNSET present yes 0 0 0 0
        mkdir,release,extract\nrun_case zero-prefers-release 0 present yes 0 0 0 0 mkdir,release,extract\nrun_case source-fallback
        UNSET present yes 1 0 0 0 mkdir,release,trust,build\nrun_case trust-rejected 1 present no 0 0 0 1 mkdir,trust\nrun_case
        missing-checkout 1 missing yes 0 0 0 1 \''\''\nrun_case missing-main 1 missing-main yes 0 0 0 1 \''\''\nrun_case missing-go-mod
        1 missing-go yes 0 0 0 1 \''\''\nrun_case invalid-flag 2 present yes 0 0 0 2 \''\''\nrun_case noncanonical-flag 01
        present yes 0 0 0 2 \''\''\nrun_case requested-build-fails 1 present yes 0 17 0 17 mkdir,trust,build\nrun_case release-extraction-fails
        0 present yes 0 0 19 19 mkdir,release,extract\nrun_case fallback-trust-rejected 0 present no 1 0 0 1 mkdir,release,trust\nrun_case
        no-source-no-release 0 missing yes 1 0 0 1 mkdir,release\nprintf \''NOTE explicit trust rejection currently follows
        initial directory creation; no download, build or extraction occurs.\\n\''\n'',encoding=''utf-8'')

        PY'
    - run: 'python3 - <<''PY''

        from pathlib import Path

        Path(''internal/tunnel/naive/runtime_audit_lifecycle_test.go'').write_text(''//go:build linux\n\npackage naive\n\nimport
        (\n\t"context"\n\t"io"\n\t"net"\n\t"os"\n\t"path/filepath"\n\t"strconv"\n\t"strings"\n\t"syscall"\n\t"testing"\n\t"time"\n\n\t"github.com/sirupsen/logrus"\n)\n\nfunc
        auditLivePID(pid int) bool {\n\tb, err := os.ReadFile("/proc/" + strconv.Itoa(pid) + "/stat")\n\tif err != nil {\n\t\treturn
        false\n\t}\n\tfields := strings.Fields(string(b)[strings.LastIndexByte(string(b), \'')\'')+1:])\n\treturn len(fields)
        > 0 && fields[0] != "Z" && fields[0] != "X" && fields[0] != "x"\n}\n\n// Sending a process-group signal does not wait
        for every member to be\n// scheduled and exit. Bound that wait; a surviving baseline sleep300 child\n// still fails,
        while zombies do not count as running helpers.\nfunc auditWaitPIDStopped(t *testing.T, pid int, message string) {\n\tt.Helper()\n\tuntil
        := time.Now().Add(500 * time.Millisecond)\n\tfor {\n\t\tif !auditLivePID(pid) {\n\t\t\treturn\n\t\t}\n\t\tif !time.Now().Before(until)
        {\n\t\t\tstat, _ := os.ReadFile("/proc/" + strconv.Itoa(pid) + "/stat")\n\t\t\tt.Fatalf("%s: PID %d stat=%q", message,
        pid, stat)\n\t\t}\n\t\ttime.Sleep(5 * time.Millisecond)\n\t}\n}\n\nfunc auditReadPID(t *testing.T, file string) int
        {\n\tt.Helper()\n\tuntil := time.Now().Add(time.Second)\n\tfor time.Now().Before(until) {\n\t\tb, _ := os.ReadFile(file)\n\t\tpid,
        err := strconv.Atoi(strings.TrimSpace(string(b)))\n\t\tif err == nil && pid > 0 {\n\t\t\treturn pid\n\t\t}\n\t\ttime.Sleep(time.Millisecond)\n\t}\n\tt.Fatalf("no
        PID at %s", file)\n\treturn 0\n}\n\nfunc TestAuditNaiveRuntimeDescendantsAreKilled(t *testing.T) {\n\tdir := t.TempDir()\n\tpidfile
        := filepath.Join(dir, "runtime-child")\n\tbinary := filepath.Join(dir, "helper")\n\tscript := "#!/bin/sh\\nsleep 300
        &\\necho $! > \''" + pidfile + "\''\\nexec sleep 300\\n"\n\tif err := os.WriteFile(binary, []byte(script), 0700);
        err != nil {\n\t\tt.Fatal(err)\n\t}\n\tlistener, err := net.Listen("tcp", "127.0.0.1:0")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tdefer
        listener.Close()\n\tlog := logrus.New()\n\tlog.SetOutput(io.Discard)\n\tctx, cancel := context.WithCancel(context.Background())\n\tdefer
        cancel()\n\th, err := startManaged(ctx, binary, "client-fixture", []byte("{}"), listener.Addr().String(), os.Environ(),
        log, nil)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tdefer h.Close()\n\tchild := auditReadPID(t, pidfile)\n\tdefer
        syscall.Kill(child, syscall.SIGKILL)\n\tcancel()\n\tdone := make(chan struct{})\n\tgo func() { h.Close(); close(done)
        }()\n\tselect {\n\tcase <-done:\n\tcase <-time.After(3 * time.Second):\n\t\tt.Fatal("helper cancellation was unbounded")\n\t}\n\tauditWaitPIDStopped(t,
        child, "runtime helper descendant survived cancellation")\n\tif _, err := os.Stat(h.dir); !os.IsNotExist(err) {\n\t\tt.Fatal("private
        helper configuration survived cancellation")\n\t}\n}\n\nfunc TestAuditNaiveCheckDescendantsAreKilled(t *testing.T)
        {\n\tfor _, outcome := range []string{"success", "failure"} {\n\t\tt.Run(outcome, func(t *testing.T) {\n\t\t\tdir
        := t.TempDir()\n\t\t\tpidfile := filepath.Join(dir, "check-child")\n\t\t\tbinary := filepath.Join(dir, "helper")\n\t\t\texit
        := "0"\n\t\t\tif outcome == "failure" {\n\t\t\t\texit = "17"\n\t\t\t}\n\t\t\tscript := "#!/bin/sh\\nif [ \\"$1\\"
        = check ]; then\\n sleep 300 >/dev/null 2>&1 &\\n echo $! > \''" + pidfile + "\''\\n exit " + exit + "\\nfi\\nexec
        sleep 300\\n"\n\t\t\tif err := os.WriteFile(binary, []byte(script), 0700); err != nil {\n\t\t\t\tt.Fatal(err)\n\t\t\t}\n\t\t\tlistener,
        err := net.Listen("tcp", "127.0.0.1:0")\n\t\t\tif err != nil {\n\t\t\t\tt.Fatal(err)\n\t\t\t}\n\t\t\tdefer listener.Close()\n\t\t\tlog
        := logrus.New()\n\t\t\tlog.SetOutput(io.Discard)\n\t\t\tctx, cancel := context.WithCancel(context.Background())\n\t\t\tdefer
        cancel()\n\t\t\th, err := startManaged(ctx, binary, "server", []byte("{}"), listener.Addr().String(), os.Environ(),
        log, nil)\n\t\t\tchild := auditReadPID(t, pidfile)\n\t\t\tdefer syscall.Kill(child, syscall.SIGKILL)\n\t\t\tif h !=
        nil {\n\t\t\t\th.Close()\n\t\t\t}\n\t\t\tif outcome == "success" && err != nil {\n\t\t\t\tt.Fatalf("successful check
        failed: %v", err)\n\t\t\t}\n\t\t\tif outcome == "failure" && err == nil {\n\t\t\t\tt.Fatal("failed check was accepted")\n\t\t\t}\n\t\t\tauditWaitPIDStopped(t,
        child, "check-command descendant survived helper cleanup")\n\t\t})\n\t}\n}\n\nfunc TestAuditNaiveLeaderExitRestartsWithInheritedOutput(t
        *testing.T) {\n\tdir := t.TempDir()\n\tpidfile := filepath.Join(dir, "inherited-output-child")\n\tbinary := filepath.Join(dir,
        "helper")\n\tscript := "#!/bin/sh\\nsleep 300 &\\necho $! > \''" + pidfile + "\''\\nsleep 0.2\\nexit 0\\n"\n\tif err
        := os.WriteFile(binary, []byte(script), 0700); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tlistener, err := net.Listen("tcp",
        "127.0.0.1:0")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tdefer listener.Close()\n\tlog := logrus.New()\n\tlog.SetOutput(io.Discard)\n\tctx,
        cancel := context.WithCancel(context.Background())\n\tdefer cancel()\n\th, err := startManaged(ctx, binary, "client-fixture",
        []byte("{}"), listener.Addr().String(), os.Environ(), log, nil)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tdefer
        h.Close()\n\tfirst := auditReadPID(t, pidfile)\n\tdefer syscall.Kill(first, syscall.SIGKILL)\n\tuntil := time.Now().Add(1500
        * time.Millisecond)\n\tchanged := false\n\tfor time.Now().Before(until) {\n\t\tb, _ := os.ReadFile(pidfile)\n\t\tpid,
        _ := strconv.Atoi(strings.TrimSpace(string(b)))\n\t\tif pid != 0 && pid != first {\n\t\t\tchanged = true\n\t\t\tbreak\n\t\t}\n\t\ttime.Sleep(10
        * time.Millisecond)\n\t}\n\tcancel()\n\th.Close()\n\tif !changed {\n\t\tt.Fatal("helper leader exited, but inherited
        output blocked Wait and prevented restart")\n\t}\n}\n'',encoding=''utf-8'')

        PY'
    - run: 'python3 - <<''PY''

        from pathlib import Path

        Path(''internal/tunnel/naive/initial_startup_external_test.go'').write_text(''//go:build linux\n\npackage naive\n\nimport
        (\n\t"context"\n\t"errors"\n\t"io"\n\t"net"\n\t"os"\n\t"path/filepath"\n\t"strconv"\n\t"strings"\n\t"testing"\n\t"time"\n\n\t"github.com/sirupsen/logrus"\n)\n\nfunc
        initialHelperFixture(t *testing.T, permanent bool) (string, string, string, string) {\n\tt.Helper()\n\tdir := t.TempDir()\n\tlistener,
        err := net.Listen("tcp", "127.0.0.1:0")\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\taddr := listener.Addr().String()\n\tlistener.Close()\n\t_,
        port, _ := net.SplitHostPort(addr)\n\tbinary, marker := filepath.Join(dir, "helper"), filepath.Join(dir, "failed-once")\n\tpids,
        generated := filepath.Join(dir, "pids"), filepath.Join(dir, "generated")\n\tcondition := "[ ! -e \''" + marker + "\''
        ]"\n\tif permanent {\n\t\tcondition = "true"\n\t}\n\tscript := "#!/bin/sh\\nif [ \\"$2\\" = -test ]; then exit 0;
        fi\\nprintf \''%s\\\\n\'' \\"$3\\" > \''" + generated + "\''\\nif " + condition + "; then\\n touch \''" + marker +
        "\''\\n sleep 300 &\\n echo $! >> \''" + pids + "\''\\n exit 255\\nfi\\nexec python3 - <<\''PY\''\\nimport socket\\ns=socket.socket();s.bind((\''127.0.0.1\'',"
        + port + "));s.listen(8)\\nwhile True:\\n c,_=s.accept()\\n try:\\n  data=b\''\''\\n  while len(data)<3:\\n   part=c.recv(3-len(data))\\n   if
        not part: break\\n   data+=part\\n  if data==b\''\\\\x05\\\\x01\\\\x00\'': c.sendall(b\''\\\\x05\\\\x00\'')\\n  elif
        len(data)==3: c.sendall(b\''ready\'')\\n except OSError: pass\\n finally: c.close()\\nPY\\n"\n\tif err := os.WriteFile(binary,
        []byte(script), 0700); err != nil {\n\t\tt.Fatal(err)\n\t}\n\treturn binary, addr, pids, generated\n}\n\nfunc initialHelperCleanup(t
        *testing.T, pids, generated string) {\n\tt.Helper()\n\tb, err := os.ReadFile(pids)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tfor
        _, word := range strings.Fields(string(b)) {\n\t\tpid, err := strconv.Atoi(word)\n\t\tif err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\tauditWaitPIDStopped(t,
        pid, "initial-startup descendant survived cancellation")\n\t}\n\tb, err = os.ReadFile(generated)\n\tif err != nil
        {\n\t\tt.Fatal(err)\n\t}\n\tif _, err := os.Stat(filepath.Dir(strings.TrimSpace(string(b)))); !os.IsNotExist(err)
        {\n\t\tt.Fatal("initial-startup private configuration survived cancellation")\n\t}\n}\n\nfunc TestManagedHelperInitialRuntimeExitRecoversExternal(t
        *testing.T) {\n\tbinary, addr, pids, generated := initialHelperFixture(t, false)\n\tctx, cancel := context.WithTimeout(context.Background(),
        5*time.Second)\n\tdefer cancel()\n\tlog := logrus.New()\n\tlog.SetOutput(io.Discard)\n\th, err := startManaged(ctx,
        binary, "xray-client", []byte("{}"), addr, os.Environ(), log, nil)\n\tif err != nil {\n\t\tt.Fatalf("initial helper
        exit was not recovered: %v", err)\n\t}\n\tdefer h.Close()\n\tconn, err := net.DialTimeout("tcp", addr, time.Second)\n\tif
        err != nil {\n\t\tt.Fatal(err)\n\t}\n\tconn.SetReadDeadline(time.Now().Add(time.Second))\n\tif _, err := conn.Write([]byte("app"));
        err != nil {\n\t\tconn.Close()\n\t\tt.Fatal(err)\n\t}\n\tdata, err := io.ReadAll(conn)\n\tconn.Close()\n\tif err !=
        nil || string(data) != "ready" {\n\t\tt.Fatalf("recovered helper did not carry traffic: %q %v", data, err)\n\t}\n\th.Close()\n\tinitialHelperCleanup(t,
        pids, generated)\n}\n\nfunc TestManagedHelperInitialRepeatedExitCanceledExternal(t *testing.T) {\n\tbinary, addr,
        pids, generated := initialHelperFixture(t, true)\n\tctx, cancel := context.WithTimeout(context.Background(), 1500*time.Millisecond)\n\tdefer
        cancel()\n\tlog := logrus.New()\n\tlog.SetOutput(io.Discard)\n\tstarted := time.Now()\n\th, err := startManaged(ctx,
        binary, "xray-client", []byte("{}"), addr, os.Environ(), log, nil)\n\tif h != nil {\n\t\th.Close()\n\t\tt.Fatal("unready
        helper returned success")\n\t}\n\tif !errors.Is(err, context.DeadlineExceeded) {\n\t\tt.Fatalf("initial retries did
        not await cancellation: %v", err)\n\t}\n\tif time.Since(started) > 4*time.Second {\n\t\tt.Fatal("initial retries did
        not cancel within the shutdown bound")\n\t}\n\tinitialHelperCleanup(t, pids, generated)\n}\n'',encoding=''utf-8'')

        PY'
    - run: 'bash /tmp/source-selection.sh install.sh

        bash -n install.sh'
    - run: 'python3 - <<''PY''

        from pathlib import Path

        Path(''internal/tunnel/naive/duplex_adapter_external_test.go'').write_text(''package naive\n\nimport (\n\t"bytes"\n\t"encoding/binary"\n\t"errors"\n\t"io"\n\t"net"\n\t"os"\n\t"sync"\n\t"testing"\n\t"time"\n)\n\ntype
        duplexAuditAddr struct{}\n\nfunc (duplexAuditAddr) Network() string { return "audit" }\nfunc (duplexAuditAddr) String()
        string  { return "audit" }\n\ntype duplexAuditConn struct {\n\treader          io.Reader\n\toutput          bytes.Buffer\n\twrites          int\n\tclosed          bool\n\tfailCall,
        failN int\n\tfailErr         error\n}\n\nfunc (c *duplexAuditConn) Read(p []byte) (int, error) {\n\tif c.closed {\n\t\treturn
        0, net.ErrClosed\n\t}\n\treturn c.reader.Read(p)\n}\nfunc (c *duplexAuditConn) Write(p []byte) (int, error) {\n\tif
        c.closed {\n\t\treturn 0, net.ErrClosed\n\t}\n\tc.writes++\n\tif c.failCall == c.writes {\n\t\tn := min(c.failN, len(p))\n\t\tc.output.Write(p[:n])\n\t\treturn
        n, c.failErr\n\t}\n\treturn c.output.Write(p)\n}\nfunc (c *duplexAuditConn) Close() error                   { c.closed
        = true; return nil }\nfunc (*duplexAuditConn) LocalAddr() net.Addr              { return duplexAuditAddr{} }\nfunc
        (*duplexAuditConn) RemoteAddr() net.Addr             { return duplexAuditAddr{} }\nfunc (*duplexAuditConn) SetDeadline(time.Time)
        error      { return nil }\nfunc (*duplexAuditConn) SetReadDeadline(time.Time) error  { return nil }\nfunc (*duplexAuditConn)
        SetWriteDeadline(time.Time) error { return nil }\nfunc duplexAuditRecord(p []byte) []byte {\n\tb := make([]byte, 4+len(p))\n\tbinary.BigEndian.PutUint32(b,
        uint32(len(p)))\n\tcopy(b[4:], p)\n\treturn b\n}\n\nfunc TestDuplexAdapterDelayedReplyAfterEOFExternal(t *testing.T)
        {\n\trawA, rawB := net.Pipe()\n\ta, b := WrapDuplex(rawA), WrapDuplex(rawB)\n\tdefer a.Close()\n\tdefer b.Close()\n\tdeadline
        := time.Now().Add(3 * time.Second)\n\ta.SetDeadline(deadline)\n\tb.SetDeadline(deadline)\n\tdone := make(chan error,
        1)\n\tgo func() {\n\t\trequest, err := io.ReadAll(b)\n\t\tif err != nil {\n\t\t\tdone <- err\n\t\t\treturn\n\t\t}\n\t\tif
        string(request) != "upload" {\n\t\t\tdone <- errors.New("request loss")\n\t\t\treturn\n\t\t}\n\t\ttime.Sleep(20 *
        time.Millisecond)\n\t\t_, err = b.Write([]byte("delayed-response"))\n\t\tif err == nil {\n\t\t\terr = b.CloseWrite()\n\t\t}\n\t\tdone
        <- err\n\t}()\n\tif n, err := a.Write([]byte("upload")); err != nil || n != 6 {\n\t\tt.Fatalf("upload: %d %v", n,
        err)\n\t}\n\tif err := a.CloseWrite(); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := a.CloseWrite(); err != nil
        {\n\t\tt.Fatal(err)\n\t}\n\tif n, err := a.Write([]byte("late")); n != 0 || !errors.Is(err, io.ErrClosedPipe) {\n\t\tt.Fatalf("post-EOF
        write: %d %v", n, err)\n\t}\n\tresponse, err := io.ReadAll(a)\n\tif err != nil || string(response) != "delayed-response"
        {\n\t\tt.Fatalf("response %q %v", response, err)\n\t}\n\tif err := <-done; err != nil {\n\t\tt.Fatal(err)\n\t}\n}\n\nfunc
        TestDuplexAdapterDeadlineResumeExternal(t *testing.T) {\n\tfor _, stage := range []string{"header", "body"} {\n\t\tt.Run(stage,
        func(t *testing.T) {\n\t\t\trawA, rawB := net.Pipe()\n\t\t\tdefer rawA.Close()\n\t\t\tdefer rawB.Close()\n\t\t\ta
        := WrapDuplex(rawA)\n\t\t\twire := duplexAuditRecord([]byte("abcdef"))\n\t\t\tsplit := 2\n\t\t\tif stage == "body"
        {\n\t\t\t\tsplit = 7\n\t\t\t}\n\t\t\tresume := make(chan struct{})\n\t\t\tsent := make(chan struct{})\n\t\t\tdone
        := make(chan error, 1)\n\t\t\tgo func() {\n\t\t\t\t_, err := rawB.Write(wire[:split])\n\t\t\t\tclose(sent)\n\t\t\t\tif
        err != nil {\n\t\t\t\t\tdone <- err\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t\t<-resume\n\t\t\t\t_, err = rawB.Write(append(wire[split:],
        make([]byte, 4)...))\n\t\t\t\tdone <- err\n\t\t\t}()\n\t\t\ta.SetReadDeadline(time.Now().Add(30 * time.Millisecond))\n\t\t\tbuf
        := make([]byte, 16)\n\t\t\tfirst := []byte{}\n\t\t\tfor {\n\t\t\t\tn, err := a.Read(buf)\n\t\t\t\tfirst = append(first,
        buf[:n]...)\n\t\t\t\tif err != nil {\n\t\t\t\t\tif !errors.Is(err, os.ErrDeadlineExceeded) {\n\t\t\t\t\t\tt.Fatalf("expected
