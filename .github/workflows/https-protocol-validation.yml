name: Upstream managed HTTPS menu validation
permissions:
  contents: read
on:
  push:
    branches: [codex/validate-menu-upstream]
jobs:
  menu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 7bf520dc0a1879177a4e641d2fc56ec95c1d5a1b
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          sudo install -d -m 700 -o "$(id -un)" -g "$(id -gn)" /etc/backpack
          go test ./internal/manage -run 'TestManagedHTTPS|TestTheReverseWizardOrder|TestTheReverseSummary|TestTheReverseLink|TestTransportMenu' -race -count=5 -v -timeout 4m
          go test ./internal/manage ./internal/manage/tunnelspec ./internal/tui ./internal/menu ./cmd -short -race -timeout 8m
          go vet ./internal/manage/... ./internal/tui ./internal/menu ./cmd
          GOOS=linux GOARCH=arm64 go build ./...
