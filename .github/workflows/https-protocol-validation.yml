name: Tunnel runtime cancellation and resource audit
permissions:
  contents: read
'on':
  push:
    branches:
    - codex/validate-https-protocols
jobs:
  ws-baseline:
    name: Reproduce stalled WS WSS upgrade cancellation and timeout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 5a733c2bb0d216eb81f7e2c4aaa9bccd1847c572
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - run: '

        if go test ./internal/utils/network -run ''^TestWebSocketUpgradeStopsWithItsAttempt$'' -v -timeout 1m > /tmp/ws-baseline.log
        2>&1; then cat /tmp/ws-baseline.log; exit 1; fi

        cat /tmp/ws-baseline.log

        test "$(grep -c ''HTTP upgrade ignored attempt cancellation or dial timeout'' /tmp/ws-baseline.log)" = 8

        '
  ws-fixed:
    name: WebSocket setup cancellation and live proof regressions ws-fixed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 79b621ae6eab0d2b4dbb8ad4fa1ed2713d935af1
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - run: '

        go test ./internal/utils/network -run ''TestWebSocketUpgradeStopsWithItsAttempt|TestSuccessfulWebSocketOutlivesItsSetupContext''
        -race -count=10 -v -timeout 3m

        go test ./internal/utils/network ./internal/client/transport ./internal/server/transport -race -timeout 8m

        go vet ./internal/utils/network ./internal/client/transport ./internal/server/transport

        '
  ws-cohort:
    name: WebSocket setup cancellation and live proof regressions ws-cohort
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 90d7efd65623c957c65b57c4d2b02103e2bacc15
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - run: '

        go test ./internal/utils/network -run ''TestWebSocketUpgradeStopsWithItsAttempt|TestSuccessfulWebSocketOutlivesItsSetupContext''
        -race -count=10 -v -timeout 3m

        go test ./internal/utils/network ./internal/client/transport ./internal/server/transport -race -timeout 8m

        go vet ./internal/utils/network ./internal/client/transport ./internal/server/transport

        '
