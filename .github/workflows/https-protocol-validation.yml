name: Managed HTTPS helpers Naive completion and protocol validation
permissions:
  contents: read
'on':
  push:
    branches:
    - codex/validate-https-protocols
jobs:
  xray:
    name: Exact Xray contracts and both complete managed reverse profiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 23676ecad726baf047b4b98492930d486238e39d
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - &id001
      run: 'python3 - <<''PY''

        from pathlib import Path

        Path(''internal/tunnel/naive/duplex_adapter_external_test.go'').write_text(''package naive\n\nimport (\n\t"bytes"\n\t"encoding/binary"\n\t"errors"\n\t"io"\n\t"net"\n\t"os"\n\t"sync"\n\t"testing"\n\t"time"\n)\n\ntype
        duplexAuditAddr struct{}\n\nfunc (duplexAuditAddr) Network() string { return "audit" }\nfunc (duplexAuditAddr) String()
        string  { return "audit" }\n\ntype duplexAuditConn struct {\n\treader          io.Reader\n\toutput          bytes.Buffer\n\twrites          int\n\tclosed          bool\n\tfailCall,
        failN int\n\tfailErr         error\n}\n\nfunc (c *duplexAuditConn) Read(p []byte) (int, error) {\n\tif c.closed {\n\t\treturn
        0, net.ErrClosed\n\t}\n\treturn c.reader.Read(p)\n}\nfunc (c *duplexAuditConn) Write(p []byte) (int, error) {\n\tif
        c.closed {\n\t\treturn 0, net.ErrClosed\n\t}\n\tc.writes++\n\tif c.failCall == c.writes {\n\t\tn := min(c.failN, len(p))\n\t\tc.output.Write(p[:n])\n\t\treturn
        n, c.failErr\n\t}\n\treturn c.output.Write(p)\n}\nfunc (c *duplexAuditConn) Close() error                   { c.closed
        = true; return nil }\nfunc (*duplexAuditConn) LocalAddr() net.Addr              { return duplexAuditAddr{} }\nfunc
        (*duplexAuditConn) RemoteAddr() net.Addr             { return duplexAuditAddr{} }\nfunc (*duplexAuditConn) SetDeadline(time.Time)
        error      { return nil }\nfunc (*duplexAuditConn) SetReadDeadline(time.Time) error  { return nil }\nfunc (*duplexAuditConn)
        SetWriteDeadline(time.Time) error { return nil }\nfunc duplexAuditRecord(p []byte) []byte {\n\tb := make([]byte, 4+len(p))\n\tbinary.BigEndian.PutUint32(b,
        uint32(len(p)))\n\tcopy(b[4:], p)\n\treturn b\n}\n\nfunc TestDuplexAdapterDelayedReplyAfterEOFExternal(t *testing.T)
        {\n\trawA, rawB := net.Pipe()\n\ta, b := WrapDuplex(rawA), WrapDuplex(rawB)\n\tdefer a.Close()\n\tdefer b.Close()\n\tdeadline
        := time.Now().Add(3 * time.Second)\n\ta.SetDeadline(deadline)\n\tb.SetDeadline(deadline)\n\tdone := make(chan error,
        1)\n\tgo func() {\n\t\trequest, err := io.ReadAll(b)\n\t\tif err != nil {\n\t\t\tdone <- err\n\t\t\treturn\n\t\t}\n\t\tif
        string(request) != "upload" {\n\t\t\tdone <- errors.New("request loss")\n\t\t\treturn\n\t\t}\n\t\ttime.Sleep(20 *
        time.Millisecond)\n\t\t_, err = b.Write([]byte("delayed-response"))\n\t\tif err == nil {\n\t\t\terr = b.CloseWrite()\n\t\t}\n\t\tdone
        <- err\n\t}()\n\tif n, err := a.Write([]byte("upload")); err != nil || n != 6 {\n\t\tt.Fatalf("upload: %d %v", n,
        err)\n\t}\n\tif err := a.CloseWrite(); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := a.CloseWrite(); err != nil
        {\n\t\tt.Fatal(err)\n\t}\n\tif n, err := a.Write([]byte("late")); n != 0 || !errors.Is(err, io.ErrClosedPipe) {\n\t\tt.Fatalf("post-EOF
        write: %d %v", n, err)\n\t}\n\tresponse, err := io.ReadAll(a)\n\tif err != nil || string(response) != "delayed-response"
        {\n\t\tt.Fatalf("response %q %v", response, err)\n\t}\n\tif err := <-done; err != nil {\n\t\tt.Fatal(err)\n\t}\n}\n\nfunc
        TestDuplexAdapterDeadlineResumeExternal(t *testing.T) {\n\tfor _, stage := range []string{"header", "body"} {\n\t\tt.Run(stage,
        func(t *testing.T) {\n\t\t\trawA, rawB := net.Pipe()\n\t\t\tdefer rawA.Close()\n\t\t\tdefer rawB.Close()\n\t\t\ta
        := WrapDuplex(rawA)\n\t\t\twire := duplexAuditRecord([]byte("abcdef"))\n\t\t\tsplit := 2\n\t\t\tif stage == "body"
        {\n\t\t\t\tsplit = 7\n\t\t\t}\n\t\t\tresume := make(chan struct{})\n\t\t\tsent := make(chan struct{})\n\t\t\tdone
        := make(chan error, 1)\n\t\t\tgo func() {\n\t\t\t\t_, err := rawB.Write(wire[:split])\n\t\t\t\tclose(sent)\n\t\t\t\tif
        err != nil {\n\t\t\t\t\tdone <- err\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t\t<-resume\n\t\t\t\t_, err = rawB.Write(append(wire[split:],
        make([]byte, 4)...))\n\t\t\t\tdone <- err\n\t\t\t}()\n\t\t\ta.SetReadDeadline(time.Now().Add(30 * time.Millisecond))\n\t\t\tbuf
        := make([]byte, 16)\n\t\t\tfirst := []byte{}\n\t\t\tfor {\n\t\t\t\tn, err := a.Read(buf)\n\t\t\t\tfirst = append(first,
        buf[:n]...)\n\t\t\t\tif err != nil {\n\t\t\t\t\tif !errors.Is(err, os.ErrDeadlineExceeded) {\n\t\t\t\t\t\tt.Fatalf("expected
        deadline: %v", err)\n\t\t\t\t\t}\n\t\t\t\t\tbreak\n\t\t\t\t}\n\t\t\t}\n\t\t\t<-sent\n\t\t\ta.SetReadDeadline(time.Time{})\n\t\t\tclose(resume)\n\t\t\trest,
        err := io.ReadAll(a)\n\t\t\tif err != nil {\n\t\t\t\tt.Fatal(err)\n\t\t\t}\n\t\t\tif string(append(first, rest...))
        != "abcdef" {\n\t\t\t\tt.Fatalf("lost/misaligned payload: %q %q", first, rest)\n\t\t\t}\n\t\t\tif err := <-done; err
        != nil {\n\t\t\t\tt.Fatal(err)\n\t\t\t}\n\t\t})\n\t}\n}\n\nfunc TestDuplexAdapterRecordsAndFailuresExternal(t *testing.T)
        {\n\tpayload := bytes.Repeat([]byte("a"), 65537)\n\traw := &duplexAuditConn{}\n\tc := WrapDuplex(raw)\n\tif n, err
        := c.Write(nil); n != 0 || err != nil || raw.writes != 0 {\n\t\tt.Fatal("empty write emitted a frame")\n\t}\n\tif
        n, err := c.Write(payload); n != len(payload) || err != nil {\n\t\tt.Fatalf("split write: %d %v", n, err)\n\t}\n\tif
        err := c.CloseWrite(); err != nil {\n\t\tt.Fatal(err)\n\t}\n\twire := raw.output.Bytes()\n\tif binary.BigEndian.Uint32(wire[:4])
        != 65536 || binary.BigEndian.Uint32(wire[65540:65544]) != 1 || binary.BigEndian.Uint32(wire[65545:]) != 0 {\n\t\tt.Fatalf("invalid
        split record layout len=%d", len(wire))\n\t}\n\trd := WrapDuplex(&duplexAuditConn{reader: bytes.NewReader(wire)})\n\tgot,
        err := io.ReadAll(rd)\n\tif err != nil || !bytes.Equal(got, payload) {\n\t\tt.Fatalf("split read len=%d err=%v", len(got),
        err)\n\t}\n\tfor name, wire := range map[string][]byte{"empty": {}, "partial-header": {0, 0}, "missing-body": {0,
        0, 0, 3}, "partial-body": {0, 0, 0, 3, \''a\''}, "no-eof-marker": duplexAuditRecord([]byte("abc")), "oversize": {0,
        1, 0, 1}} {\n\t\tt.Run(name, func(t *testing.T) {\n\t\t\traw := &duplexAuditConn{reader: bytes.NewReader(wire)}\n\t\t\tc
        := WrapDuplex(raw)\n\t\t\t_, err := io.ReadAll(c)\n\t\t\tif name == "oversize" {\n\t\t\t\tif err == nil {\n\t\t\t\t\tt.Fatal("oversize
        accepted")\n\t\t\t\t}\n\t\t\t} else if !errors.Is(err, io.ErrUnexpectedEOF) {\n\t\t\t\tt.Fatalf("missing EOF marker
        accepted: %v", err)\n\t\t\t}\n\t\t\tif !raw.closed {\n\t\t\t\tt.Fatal("terminal malformed/physical EOF did not close
        carrier")\n\t\t\t}\n\t\t})\n\t}\n\tfor _, tc := range []struct {\n\t\tname          string\n\t\tcall, n, want int\n\t\terr           error\n\t}{{"header-partial",
        1, 2, 0, io.ErrClosedPipe}, {"body-partial", 2, 2, 2, io.ErrClosedPipe}, {"header-no-progress", 1, 0, 0, nil}, {"body-no-progress",
        2, 0, 0, nil}} {\n\t\tt.Run(tc.name, func(t *testing.T) {\n\t\t\traw := &duplexAuditConn{failCall: tc.call, failN:
        tc.n, failErr: tc.err}\n\t\t\tc := WrapDuplex(raw)\n\t\t\tn, err := c.Write([]byte("abcdef"))\n\t\t\tif n != tc.want
        || err == nil || !raw.closed {\n\t\t\t\tt.Fatalf("partial failure n=%d err=%v closed=%v", n, err, raw.closed)\n\t\t\t}\n\t\t\tprevious
        := raw.writes\n\t\t\tif _, second := c.Write([]byte("retry")); second != err || raw.writes != previous {\n\t\t\t\tt.Fatal("poisoned
        frame was retried")\n\t\t\t}\n\t\t\tif c.CloseWrite() != err {\n\t\t\t\tt.Fatal("poisoned EOF marker was emitted")\n\t\t\t}\n\t\t})\n\t}\n\tzero
        := WrapDuplex(&duplexAuditConn{reader: bytes.NewReader(make([]byte, 4))})\n\tif n, err := zero.Read(nil); n != 0 ||
        err != nil {\n\t\tt.Fatal("empty read consumed EOF")\n\t}\n\tif _, err := zero.Read(make([]byte, 1)); err != io.EOF
        {\n\t\tt.Fatal("EOF marker missing")\n\t}\n}\n\nfunc TestDuplexAdapterCloseUnblocksBothDirectionsExternal(t *testing.T)
        {\n\ta, b := net.Pipe()\n\tdefer b.Close()\n\tc := WrapDuplex(a)\n\tdone := make(chan struct{}, 2)\n\tstart := make(chan
        struct{})\n\tgo func() { close(start); c.Read(make([]byte, 1)); done <- struct{}{} }()\n\t<-start\n\tgo func() { c.Write([]byte("blocked"));
        done <- struct{}{} }()\n\ttime.Sleep(10 * time.Millisecond)\n\tc.Close()\n\tfor i := 0; i < 2; i++ {\n\t\tselect {\n\t\tcase
        <-done:\n\t\tcase <-time.After(time.Second):\n\t\t\tt.Fatal("Close waited on an I/O mutex")\n\t\t}\n\t}\n}\n\nfunc
        TestDuplexAdapterConcurrentWritesPreserveFramesExternal(t *testing.T) {\n\ta, b := net.Pipe()\n\tdefer a.Close()\n\tdefer
        b.Close()\n\tc := WrapDuplex(a)\n\td := WrapDuplex(b)\n\tc.SetDeadline(time.Now().Add(3 * time.Second))\n\td.SetDeadline(time.Now().Add(3
        * time.Second))\n\tresult := make(chan []byte, 1)\n\tfailure := make(chan error, 1)\n\tgo func() { body, err := io.ReadAll(d);
        failure <- err; result <- body }()\n\tvar wg sync.WaitGroup\n\tfor _, ch := range []byte{\''a\'', \''b\'', \''c\'',
        \''d\''} {\n\t\twg.Add(1)\n\t\tgo func(ch byte) {\n\t\t\tdefer wg.Done()\n\t\t\tif _, err := c.Write(bytes.Repeat([]byte{ch},
        65537)); err != nil {\n\t\t\t\tt.Error(err)\n\t\t\t}\n\t\t}(ch)\n\t}\n\twg.Wait()\n\tif err := c.CloseWrite(); err
        != nil {\n\t\tt.Fatal(err)\n\t}\n\tbody := <-result\n\tif err := <-failure; err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif
        len(body) != 4*65537 {\n\t\tt.Fatal("concurrent bytes lost")\n\t}\n\tfor start := 0; start < len(body); start += 65537
        {\n\t\tsegment := body[start : start+65537]\n\t\tif !bytes.Equal(segment, bytes.Repeat(segment[:1], 65537)) {\n\t\t\tt.Fatal("record
        writes interleaved")\n\t\t}\n\t}\n}\n\ntype duplexAuditStep struct {\n\tpayload []byte\n\terr     error\n}\ntype duplexAuditStepReader
        struct{ steps []duplexAuditStep }\n\nfunc (r *duplexAuditStepReader) Read(p []byte) (int, error) {\n\tif len(r.steps)
        == 0 {\n\t\treturn 0, io.EOF\n\t}\n\tstep := r.steps[0]\n\tr.steps = r.steps[1:]\n\tif len(step.payload) > len(p)
        {\n\t\tpanic("fixture step exceeds read buffer")\n\t}\n\treturn copy(p, step.payload), step.err\n}\n\nfunc TestDuplexAdapterReadBytesAndErrorExternal(t
        *testing.T) {\n\tfor _, tc := range []struct {\n\t\tname     string\n\t\tsteps    []duplexAuditStep\n\t\tfirstN   int\n\t\tfirstErr
        error\n\t\tretry    string\n\t\tclosed   bool\n\t}{\n\t\t{"marker-with-EOF", []duplexAuditStep{{make([]byte, 4), io.EOF}},
        0, io.EOF, "", false},\n\t\t{"payload-with-EOF", []duplexAuditStep{{[]byte{0, 0, 0, 3}, nil}, {[]byte("abc"), io.EOF}},
        3, io.ErrUnexpectedEOF, "", true},\n\t\t{"payload-with-failure", []duplexAuditStep{{[]byte{0, 0, 0, 3}, nil}, {[]byte("abc"),
        io.ErrClosedPipe}}, 3, io.ErrClosedPipe, "", true},\n\t\t{"complete-header-with-timeout", []duplexAuditStep{{[]byte{0,
        0, 0, 3}, os.ErrDeadlineExceeded}, {[]byte("abc"), nil}, {make([]byte, 4), nil}}, 0, os.ErrDeadlineExceeded, "abc",
        false},\n\t\t{"payload-with-timeout", []duplexAuditStep{{[]byte{0, 0, 0, 3}, nil}, {[]byte("a"), os.ErrDeadlineExceeded},
        {[]byte("bc"), nil}, {make([]byte, 4), nil}}, 1, os.ErrDeadlineExceeded, "bc", false},\n\t} {\n\t\tt.Run(tc.name,
        func(t *testing.T) {\n\t\t\traw := &duplexAuditConn{reader: &duplexAuditStepReader{steps: tc.steps}}\n\t\t\tc := WrapDuplex(raw)\n\t\t\tbuf
        := make([]byte, 8)\n\t\t\tn, err := c.Read(buf)\n\t\t\tif n != tc.firstN || !errors.Is(err, tc.firstErr) || raw.closed
        != tc.closed {\n\t\t\t\tt.Fatalf("read=%d %v closed=%v", n, err, raw.closed)\n\t\t\t}\n\t\t\tif tc.firstN > 0 && string(buf[:n])
        != "abc"[:tc.firstN] {\n\t\t\t\tt.Fatalf("read lost returned bytes: %q", buf[:n])\n\t\t\t}\n\t\t\tif tc.retry != ""
        {\n\t\t\t\trest, err := io.ReadAll(c)\n\t\t\t\tif err != nil || string(rest) != tc.retry {\n\t\t\t\t\tt.Fatalf("retry
        misaligned: %q %v", rest, err)\n\t\t\t\t}\n\t\t\t}\n\t\t})\n\t}\n}\n\ntype duplexAuditDiscard struct{ duplexAuditConn
        }\n\nfunc (c *duplexAuditDiscard) Write(p []byte) (int, error) { return len(p), nil }\nfunc TestDuplexAdapterWarmWriteAllocationsExternal(t
        *testing.T) {\n\tc := WrapDuplex(&duplexAuditDiscard{})\n\tpayload := make([]byte, 65537)\n\tallocations := testing.AllocsPerRun(1000,
        func() {\n\t\tn, err := c.Write(payload)\n\t\tif n != len(payload) || err != nil {\n\t\t\tpanic("fixture write failed")\n\t\t}\n\t})\n\tif
        allocations != 0 {\n\t\tt.Fatalf("warm65537bytewrite allocations=%g", allocations)\n\t}\n}\n'',encoding=''utf-8'')

