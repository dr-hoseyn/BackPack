name: Connection test automatic setup
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Endpoint-local promotion, protocol and failure tests
        run: |
          sudo install -d -m 700 -o "$(id -un)" -g "$(id -gn)" /etc/backpack
          go test -race ./internal/manage ./internal/webui ./internal/tui -run 'TestConnTest|TestInputEnded|TestTheCoordinatorAnswersOnlyWithTheToken' -count=1 -timeout 5m
      - name: Real AmneziaWG Connection Test on both IP families
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 iptables netcat-openbsd
          go test -c -o "$RUNNER_TEMP/manage-setup.test" ./internal/manage
          sudo env "PATH=$PATH" "$RUNNER_TEMP/manage-setup.test" -test.run '^TestTheTestSettingsFitOnePacketAndCarryNoToken$' -test.v -test.timeout 3m
          sudo env "PATH=$PATH" BP_L3_LIVE=1 "$RUNNER_TEMP/manage-setup.test" -test.run '^TestAmneziaWGConnectionTestOverRealIPv4AndIPv6TUN$' -test.v -test.timeout 9m
