        TestRuntimeAuditRawUDPClientReplyAfterOneWayTraffic(t *testing.T) {\n\tctx, cancel := context.WithCancel(context.Background())\n\tdefer
        cancel()\n\tlisten := func() *net.UDPConn {\n\t\tc, err := net.ListenUDP("udp", &net.UDPAddr{IP: net.IPv4(127, 0,
        0, 1)})\n\t\tif err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\tt.Cleanup(func() { c.Close() })\n\t\treturn c\n\t}\n\tserver,
        backend := listen(), listen()\n\ttunnel, err := net.DialUDP("udp", nil, server.LocalAddr().(*net.UDPAddr))\n\tif err
