name: Final raw UDP flow lifetime and integrated recovery checks
permissions:
  contents: read
'on':
  push:
    branches:
    - codex/validate-final-udp-lifetime
jobs:
  combined:
    name: Final integrated UDP lifetime, DNS, restart cleanup and runtime checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 50d05f0ec686cc28d87d8d7a631939bfce4e53e1
        fetch-depth: 0
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - run: 'python3 - <<''PY''

        from pathlib import Path

        Path(''internal/client/transport/runtime_audit_raw_udp_dns_test.go'').write_text(''package transport\nimport (\n "context"\n
        "errors"\n "net"\n "sync"\n "testing"\n "time"\n "github.com/backpack/backpack/internal/utils/network"\n)\nfunc TestRuntimeAuditRawUDPBackendAndEndpointDNS(t
        *testing.T) {\n for _, backendPhase := range []bool{false,true} {\n  for _, cancelGeneration := range []bool{true,false}
        {\n   name:="endpoint";if backendPhase{name="backend"};if cancelGeneration{name+="/cancel"}else{name+="/timeout"}\n   t.Run(name,func(t
        *testing.T){\n    previous:=net.DefaultResolver;release:=make(chan struct{});started:=make(chan struct{},1);var once
        sync.Once;unblock:=func(){once.Do(func(){close(release)})}\n    net.DefaultResolver=&net.Resolver{PreferGo:true,Dial:func(ctx
        context.Context,_,_ string)(net.Conn,error){select{case started<-struct{}{}:default:};select{case<-ctx.Done():return
        nil,ctx.Err();case<-release:return nil,errors.New("audit release")}}}\n    ctx,cancel:=context.WithCancel(context.Background());log:=silentLogger()\n    timeout:=40*time.Millisecond;if
        cancelGeneration{timeout=5*time.Second}\n    config:=&UdpConfig{RemoteAddr:"raw-endpoint.invalid:53",Endpoints:network.NewEndpoints("raw-endpoint.invalid:53"),DialTimeOut:timeout,ConnPoolSize:1,Token:"audit-token"}\n    if
        backendPhase {\n     listener,err:=net.ListenUDP("udp",&net.UDPAddr{IP:net.IPv4(127,0,0,1)});if err!=nil{t.Fatal(err)};defer
        listener.Close()\n     config.RemoteAddr=listener.LocalAddr().String();config.Endpoints=network.NewEndpoints(config.RemoteAddr)\n     go
        func(){listener.SetReadDeadline(time.Now().Add(time.Second));buf:=make([]byte,256);_,peer,err:=listener.ReadFromUDP(buf);if
        err==nil{listener.WriteToUDP([]byte("raw-backend.invalid:53"),peer)}}()\n    }\n    c:=&UdpTransport{config:config};c.logger=log;c.state.Reset(ctx,cancel,nil)\n    c.state.Go(c.tunnelDialer);joined:=make(chan
        struct{});go func(){c.state.Wait();close(joined)}()\n    defer func(){c.state.Stop();unblock();select{case<-joined:case<-time.After(time.Second):t.Error("registered
        raw UDP worker failed cleanup")};net.DefaultResolver=previous}()\n    select{case<-started:case<-time.After(time.Second):t.Fatal("actual
        raw UDP DNS did not start")}\n    if cancelGeneration{c.state.Stop()}\n    select{case<-joined:case<-time.After(300*time.Millisecond):t.Error("raw
        UDP DNS ignored generation cancellation/dial timeout and held registered worker")}\n   })\n  }\n }\n}\n'',encoding=''utf-8'')

        PY

        gofmt -w internal/client/transport/runtime_audit_raw_udp_dns_test.go'
    - run: 'python3 - <<''PY''

        from pathlib import Path

        Path(''internal/client/transport/runtime_audit_reverse_udp_dns_test.go'').write_text(''package transport\nimport("context";"errors";"net";"sync";"testing";"time";"github.com/sirupsen/logrus")\nfunc
        TestRuntimeAuditReverseUDPGenerationCancelsDNS(t *testing.T){\n old:=net.DefaultResolver;release:=make(chan struct{});started:=make(chan
        struct{},1);var once sync.Once;unblock:=func(){once.Do(func(){close(release)})}\n net.DefaultResolver=&net.Resolver{PreferGo:true,Dial:func(ctx
        context.Context,_,_ string)(net.Conn,error){select{case started<-struct{}{}:default:};select{case<-release:return
        nil,errors.New("audit release");case<-ctx.Done():return nil,ctx.Err()}}}\n defer func(){unblock();net.DefaultResolver=old}()\n
        ctx,cancel:=context.WithCancel(context.Background());defer cancel();log:=logrus.New();log.SetLevel(logrus.PanicLevel)\n
        l:=&lifecycle{logger:log};l.state.Reset(ctx,cancel,nil)\n stream,peer:=net.Pipe();defer peer.Close()\n l.state.Go(func(){defer
        l.state.Own(stream)();l.relayStream(stream,"udp://generation.backend-audit.invalid:53",backendOpts{dialTimeout:40*time.Millisecond})})\n
        select{case<-started:case<-time.After(time.Second):t.Fatal("UDP resolver did not start")}\n l.state.Stop();joined:=make(chan
        struct{});go func(){l.state.Wait();close(joined)}()\n select{case<-joined:case<-time.After(250*time.Millisecond):t.Error("stalled
        UDP DNS held registered worker after generation Stop; restart Wait cannot finish");unblock();select{case<-joined:case<-time.After(time.Second):t.Error("worker
        still stuck after resolver release")}}\n}\nfunc TestRuntimeAuditReverseUDPBackendTimeoutIncludesDNS(t *testing.T){\n
        old:=net.DefaultResolver;release:=make(chan struct{});var once sync.Once;unblock:=func(){once.Do(func(){close(release)})}\n
        net.DefaultResolver=&net.Resolver{PreferGo:true,Dial:func(ctx context.Context,_,_ string)(net.Conn,error){select{case<-release:return
        nil,errors.New("audit release");case<-ctx.Done():return nil,ctx.Err()}}}\n defer func(){unblock();net.DefaultResolver=old}()\n
        ctx,cancel:=context.WithCancel(context.Background());defer cancel();log:=logrus.New();log.SetLevel(logrus.PanicLevel)\n
        l:=&lifecycle{logger:log};l.state.Reset(ctx,cancel,nil);stream,peer:=net.Pipe();defer stream.Close();defer peer.Close()\n
        done:=make(chan struct{});go func(){defer close(done);l.relayStream(stream,"udp://timeout.backend-audit.invalid:53",backendOpts{dialTimeout:40*time.Millisecond})}()\n
        select{case<-done:case<-time.After(250*time.Millisecond):t.Error("backend dialTimeout ignored for UDP DNS");unblock();select{case<-done:case<-time.After(time.Second):t.Error("worker
        still stuck after resolver release")}}\n}\n'',encoding=''utf-8'')

