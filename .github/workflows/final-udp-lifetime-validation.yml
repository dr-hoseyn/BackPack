  oneway:
    name: Exact real UDP delayed reply after sixty seconds of active uplink
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        ref: cd1450bb0398633457584d10cb18d26317085bba
        fetch-depth: 0
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - run: 'python3 - <<''PY''

        from pathlib import Path

        Path(''internal/server/transport/runtime_audit_udp_oneway_test.go'').write_text(''package transport\n\nimport (\n\t"bytes"\n\t"context"\n\t"net"\n\t"sync"\n\t"testing"\n\t"time"\n)\n\nfunc
        TestRuntimeAuditUDPReplyAfterOneWayTraffic(t *testing.T) {\n\tctx, cancel := context.WithCancel(context.Background())\n\tdefer
        cancel()\n\tlisten := func() *net.UDPConn {\n\t\tc, err := net.ListenUDP("udp", &net.UDPAddr{IP: net.IPv4(127, 0,
        0, 1)})\n\t\tif err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\tt.Cleanup(func() { c.Close() })\n\t\treturn c\n\t}\n\tlocalSock,
        localPeer, tunnelSock, tunnelPeer := listen(), listen(), listen(), listen()\n\tlim := newLimiter(Limits{MaxConnections:
        1})\n\tif !lim.acquire() {\n\t\tt.Fatal("cannot acquire flow slot")\n\t}\n\tlocal := &LocalUDPConn{addr: localPeer.LocalAddr().(*net.UDPAddr),
        listener: localSock, payload: make(chan []byte, 4)}\n\ttunnel := &TunnelUDPConn{addr: tunnelPeer.LocalAddr().(*net.UDPAddr),
        listener: tunnelSock, payload: make(chan []byte, 4)}\n\tactive := map[string]*LocalUDPConn{local.addr.String(): local}\n\tmu
        := &sync.Mutex{}\n\ts := &UdpTransport{config: &UdpConfig{}, limits: lim, lifecycle: lifecycle{logger: quietLogger()},
        activeConnections: map[string]*TunnelUDPConn{tunnel.addr.String(): tunnel}}\n\tg := &udpGen{ctx: ctx}\n\tdone := make(chan
        struct{})\n\tgo func() { defer close(done); s.udpCopy(g, local, tunnel, &active, mu) }()\n\tt.Cleanup(func() {\n\t\tcancel()\n\t\tselect
        {\n\t\tcase <-done:\n\t\tcase <-time.After(time.Second):\n\t\t\tt.Error("flow teardown leaked")\n\t\t}\n\t\tif lim.active.Load()
        != 0 {\n\t\t\tt.Errorf("held slots=%d", lim.active.Load())\n\t\t}\n\t})\n\t// The real production timeout is 60s;
        keep the uplink active beyond it.\n\tsenderDone := make(chan struct{})\n\tgo func() {\n\t\tdefer close(senderDone)\n\t\ttick
        := time.NewTicker(100 * time.Millisecond)\n\t\tdefer tick.Stop()\n\t\tfor {\n\t\t\tselect {\n\t\t\tcase <-ctx.Done():\n\t\t\t\treturn\n\t\t\tcase
        <-tick.C:\n\t\t\t\tmu.Lock()\n\t\t\t\tif active[local.addr.String()] == local {\n\t\t\t\t\tselect {\n\t\t\t\t\tcase
        local.payload <- []byte("upload"):\n\t\t\t\t\tdefault:\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\tmu.Unlock()\n\t\t\t}\n\t\t}\n\t}()\n\t//
        Drain the real loopback tunnel socket and verify uplink still works late.\n\tlastUpload := time.Now()\n\tdeadline
        := time.Now().Add(idleForward + 500*time.Millisecond)\n\tbuf := make([]byte, 64)\n\tfor time.Now().Before(deadline)
        {\n\t\tif err := tunnelPeer.SetReadDeadline(time.Now().Add(time.Second)); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\tn,
        _, err := tunnelPeer.ReadFromUDP(buf)\n\t\tif err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\tif !bytes.Equal(buf[:n],
        []byte("upload")) {\n\t\t\tt.Fatal("altered upload")\n\t\t}\n\t\tlastUpload = time.Now()\n\t}\n\tif time.Since(lastUpload)
        > time.Second {\n\t\tt.Fatal("uplink stopped before delayed response")\n\t}\n\ttunnel.payload <- []byte("delayed response")\n\tif
        err := localPeer.SetReadDeadline(time.Now().Add(time.Second)); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tn, _, err :=
        localPeer.ReadFromUDP(buf)\n\tif err != nil {\n\t\tt.Fatalf("active one-way UDP flow discarded its delayed response:
        %v", err)\n\t}\n\tif !bytes.Equal(buf[:n], []byte("delayed response")) {\n\t\tt.Fatalf("response=%q", buf[:n])\n\t}\n\tcancel()\n\t<-senderDone\n}\n'',encoding=''utf-8'')

