        gofmt -w internal/client/transport/runtime_audit_reverse_udp_dns_test.go'
    - run: 'python3 - <<''PY''

        from pathlib import Path

        Path(''internal/server/transport/runtime_audit_pairing_timeout_test.go'').write_text(''package transport\n\nimport
        (\n\t"context"\n\t"net"\n\t"sync"\n\t"testing"\n\t"time"\n)\n\nfunc TestRuntimeAuditUDPTimeoutReleasesFreshFlow(t
        *testing.T) {\n\tctx, cancel := context.WithCancel(context.Background())\n\tdefer cancel()\n\tlim := newLimiter(Limits{MaxConnections:
        1})\n\ts := &UdpTransport{config: &UdpConfig{}, limits: lim, lifecycle: lifecycle{logger: quietLogger()}}\n\tg :=
        &udpGen{ctx: ctx, tunnelChannel: make(chan *TunnelUDPConn)}\n\tpeer := &net.UDPAddr{IP: net.IPv4(127, 0, 0, 1), Port:
        12345}\n\tflow := &LocalUDPConn{timeCreated: nowMillis(), payload: make(chan []byte, 1), remoteAddr: "127.0.0.1:8080",
        addr: peer}\n\tactive := map[string]*LocalUDPConn{peer.String(): flow}\n\tmu := &sync.Mutex{}\n\tqueue := make(chan
        *LocalUDPConn, 1)\n\tif !lim.acquire() {\n\t\tt.Fatal("slot acquisition failed")\n\t}\n\tqueue <- flow\n\tdone :=
        make(chan struct{})\n\tgo func() { defer close(done); s.handleLoop(g, queue, &active, mu) }()\n\tt.Cleanup(func()
        {\n\t\tcancel()\n\t\tselect {\n\t\tcase <-done:\n\t\tcase <-time.After(time.Second):\n\t\t\tt.Error("pairing worker
        leaked")\n\t\t}\n\t})\n\tuntil := time.Now().Add(pairingTimeout + 500*time.Millisecond)\n\tfor time.Now().Before(until)
        {\n\t\tmu.Lock()\n\t\tremaining := len(active)\n\t\tmu.Unlock()\n\t\tif remaining == 0 && lim.active.Load() == 0 {\n\t\t\tselect
        {\n\t\t\tcase _, open := <-flow.payload:\n\t\t\t\tif open {\n\t\t\t\t\tt.Fatal("expired payload channel left open")\n\t\t\t\t}\n\t\t\tdefault:\n\t\t\t\tt.Fatal("expired
        payload channel not closed")\n\t\t\t}\n\t\t\tif !lim.acquire() {\n\t\t\t\tt.Fatal("timed-out flow exhausted limit")\n\t\t\t}\n\t\t\tlim.release()\n\t\t\tif
        ctx.Err() != nil {\n\t\t\t\tt.Fatal("timeout required canceling generation")\n\t\t\t}\n\t\t\treturn\n\t\t}\n\t\ttime.Sleep(10
        * time.Millisecond)\n\t}\n\tmu.Lock()\n\tremaining := len(active)\n\tmu.Unlock()\n\tt.Fatalf("fresh flow timeout did
        not expire: remaining=%d slots=%d", remaining, lim.active.Load())\n}\n'',encoding=''utf-8'')

