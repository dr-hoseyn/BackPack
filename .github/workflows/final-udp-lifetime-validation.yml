        gofmt -w internal/server/transport/runtime_audit_pairing_timeout_test.go'
    - run: 'python3 - <<''PY''

        from pathlib import Path

        Path(''internal/tunnel/l3/runtime_audit_mtu_startup_test.go'').write_text(''package l3\nimport (\n "context"\n "net"\n
        "sync"\n "sync/atomic"\n "testing"\n "time"\n)\ntype auditDelayInitCarrier struct { DatagramCarrier; once sync.Once
        }\nfunc (c *auditDelayInitCarrier) WriteTo(p []byte,a net.Addr)(int,error) {\n if h,_,err:=parseHeader(p);err==nil
        && h.kind==typeInit {c.once.Do(func(){time.Sleep(300*time.Millisecond)})}\n return c.DatagramCarrier.WriteTo(p,a)\n}\nfunc
        TestAuditAutoMTUAfterSlowInitialHandshake(t *testing.T) {\n ctx,cancel:=context.WithCancel(context.Background());t.Cleanup(cancel)\n
        ld,dd:=newFakeDevice(1400),newFakeDevice(1400)\n listener,err:=New(Config{Mode:ModeListen,Addr:"127.0.0.1:0",Token:"slow-mtu-audit",Encap:"gre",LocalIP:"10.10.0.2/30",PeerIP:"10.10.0.1",MTU:1400},quietLogger());if
        err!=nil {t.Fatal(err)}\n listener.openDevice=func(deviceSpec)(packetDevice,error){return ld,nil};start(t,ctx,cancel,listener,ld)\n
        dialer,err:=New(Config{Mode:ModeDial,Addr:awaitBind(t,listener).String(),Token:"slow-mtu-audit",Encap:"gre",LocalIP:"10.10.0.1/30",PeerIP:"10.10.0.2",MTU:1400,AutoMTU:true},quietLogger());if
        err!=nil {t.Fatal(err)}\n dialer.openDevice=func(deviceSpec)(packetDevice,error){return dd,nil}\n dialer.probe=probeTiming{timeout:10*time.Millisecond,attempts:1,settle:20*time.Millisecond,every:time.Hour}\n
        var dropped atomic.Int64\n dialer.wrapCarrier=func(c DatagramCarrier)DatagramCarrier{return &auditDelayInitCarrier{DatagramCarrier:&cappedCarrier{DatagramCarrier:c,ceiling:1200,dropped:&dropped}}}\n
        start(t,ctx,cancel,dialer,dd);awaitSession(t,dialer,2*time.Second)\n small:=make([]byte,64);small[0]=0x45;dd.inject<-small;ld.receive(t,time.Second)\n
        for end:=time.Now().Add(time.Second);time.Now().Before(end); {if got:=dd.settledMTU();got!=1400 {if got+dialer.carrier.Overhead()+dataOverhead+dialer.encap.Overhead()>1200
        {t.Fatalf("unsafe MTU %d",got)};return};time.Sleep(5*time.Millisecond)}\n t.Fatalf("handshake completed and 64-byte
        UDP/TUN packet delivered, but AutoMTU stayed %d instead of measuring 1200-byte capped path (oversized probes dropped=%d)",dd.settledMTU(),dropped.Load())\n}\n\ntype
        auditNoProbeCarrier struct { DatagramCarrier; probes *atomic.Int64 }\nfunc (c *auditNoProbeCarrier) WriteTo(p []byte,a
        net.Addr)(int,error) {\n if h,_,err:=parseHeader(p);err==nil && h.kind==typeProbe {c.probes.Add(1);return len(p),nil}\n
        return c.DatagramCarrier.WriteTo(p,a)\n}\nfunc TestAuditAutoMTUWaitCancellation(t *testing.T) {\n ctx,cancel:=context.WithCancel(context.Background());defer
        cancel()\n dev:=newFakeDevice(1400)\n tun,err:=New(Config{Mode:ModeListen,Addr:"127.0.0.1:0",Token:"cancel-mtu-audit",Encap:"gre",LocalIP:"10.10.0.2/30",PeerIP:"10.10.0.1",MTU:1400,AutoMTU:true},quietLogger());if
        err!=nil {t.Fatal(err)}\n tun.openDevice=func(deviceSpec)(packetDevice,error){return dev,nil}\n done:=make(chan error,1);go
        func(){done<-tun.Run(ctx)}();awaitBind(t,tun)\n time.Sleep(150*time.Millisecond)\n if tun.sendSession()!=nil {t.Fatal("unexpected
        session")}\n started:=time.Now();cancel()\n select {case err:=<-done:if err!=nil {t.Fatal(err)};t.Logf("no-session
        cancellation returned in %s",time.Since(started));case<-time.After(250*time.Millisecond):t.Fatal("shutdown stuck waiting
        for a session")}\n}\nfunc TestAuditAutoMTUNoProbeAnswerBackoff(t *testing.T) {\n ctx,cancel:=context.WithCancel(context.Background());t.Cleanup(cancel)\n
        ld,dd:=newFakeDevice(1400),newFakeDevice(1400)\n listener,err:=New(Config{Mode:ModeListen,Addr:"127.0.0.1:0",Token:"legacy-mtu-audit",Encap:"gre",LocalIP:"10.10.0.2/30",PeerIP:"10.10.0.1",MTU:1400},quietLogger());if
        err!=nil {t.Fatal(err)}\n listener.openDevice=func(deviceSpec)(packetDevice,error){return ld,nil};start(t,ctx,cancel,listener,ld)\n
        dialer,err:=New(Config{Mode:ModeDial,Addr:awaitBind(t,listener).String(),Token:"legacy-mtu-audit",Encap:"gre",LocalIP:"10.10.0.1/30",PeerIP:"10.10.0.2",MTU:1400,AutoMTU:true},quietLogger());if
        err!=nil {t.Fatal(err)}\n dialer.openDevice=func(deviceSpec)(packetDevice,error){return dd,nil}\n dialer.probe=probeTiming{timeout:10*time.Millisecond,attempts:1,settle:20*time.Millisecond,every:time.Hour}\n
        var probes atomic.Int64\n dialer.wrapCarrier=func(c DatagramCarrier)DatagramCarrier{return &auditNoProbeCarrier{DatagramCarrier:c,probes:&probes}}\n
        start(t,ctx,cancel,dialer,dd);awaitSession(t,dialer,time.Second)\n small:=make([]byte,64);small[0]=0x45;dd.inject<-small;ld.receive(t,time.Second)\n
        for end:=time.Now().Add(time.Second);time.Now().Before(end)&&probes.Load()<2; {time.Sleep(5*time.Millisecond)}\n if
        probes.Load()!=2 {t.Fatalf("initial measurement probes %d, expected ceiling+floor",probes.Load())}\n time.Sleep(400*time.Millisecond)\n
        if probes.Load()!=2 {t.Fatalf("unanswered legacy probes were retried too soon: %d",probes.Load())}\n if dd.settledMTU()!=1400
        {t.Fatal("unanswered probes changed configured MTU")}\n}\n'',encoding=''utf-8'')

