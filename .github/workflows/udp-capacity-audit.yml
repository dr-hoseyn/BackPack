name: L3 allocation fixture audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Compare Linux allocation checks with race instrumentation
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/alloc-base" 1f6834579b8e6a14f9729a8bb9857f9fbbd1fd71
          for tree in "$RUNNER_TEMP/alloc-base" "$GITHUB_WORKSPACE"; do
            python3 - "$tree/internal/tunnel/l3/batchread_test.go" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          anchor = 'got := minAllocsPerRun(5, 20, func() { c.WriteBatch(bufs, to) })'
          assert text.count(anchor) == 1
          path.write_text(text.replace(anchor, anchor + '\n\tt.Logf("L3_WRITE_ALLOCS %.1f", got)'))
          PY
          done
          for role in base candidate; do
            tree="$GITHUB_WORKSPACE"
            if [ "$role" = base ]; then tree="$RUNNER_TEMP/alloc-base"; fi
            (cd "$tree" && go test -race -c -o "$RUNNER_TEMP/alloc-$role.test" ./internal/tunnel/l3)
            if "$RUNNER_TEMP/alloc-$role.test" -test.run='^TestWriteBatchDoesNotAllocatePerCall$' -test.count=100 -test.v > "$RUNNER_TEMP/alloc-$role.log" 2>&1; then
              echo "RESULT $role passed"
            else
              echo "RESULT $role failed"
              if [ "$role" = candidate ]; then cat "$RUNNER_TEMP/alloc-$role.log"; exit 1; fi
            fi
            echo "RESULT $role successful/failed allocation measurements"
            grep 'L3_WRITE_ALLOCS' "$RUNNER_TEMP/alloc-$role.log" | awk '{print $NF}' | sort -n | uniq -c
            grep -c -- '--- FAIL:' "$RUNNER_TEMP/alloc-$role.log" || true
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: l3-allocation-fixture
          path: ${{ runner.temp }}/alloc-*.log